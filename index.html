<!DOCTYPE html>
<html lang="pt-BR" data-b="Raw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Universe Desk">
<meta name="mobile-web-app-capable" content="yes">
<title>Universe Manager · WWE 2K26</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --ac: #e11d2e;
  --on: #fff;
  --bg: #0a0a0e;
  --card: #14141a;
  --bd: #2a2a33;
  --tx: #f0f0f5;
  --mu: #8b8b9a;
  --in: #0d0d12;
  --glow: color-mix(in srgb, var(--ac) 35%, transparent);
  color-scheme: dark;
  box-sizing: border-box;
}
:root[data-b="Raw"] {
  --ac: #e11d2e;
  --on: #fff;
  --bg: #0c0809;
  --card: #161012;
  --bd: #3a1a1f;
}
:root[data-b="SmackDown"] {
  --ac: #2a7bf0;
  --on: #fff;
  --bg: #070b12;
  --card: #0e141f;
  --bd: #1a2a45;
}
:root[data-b="NXT"] {
  --ac: #a0a6b4;
  --on: #111;
  --bg: #0b0b0e;
  --card: #141418;
  --bd: #2c2c35;
}
:root[data-b="Free Agency"] {
  --ac: #9b5de5;
  --on: #fff;
  --bg: #100b17;
  --card: #1b1325;
  --bd: #49305f;
}
:root[data-b="Global"] {
  --ac: #20c9b0;
  --on: #04221c;
  --bg: #061412;
  --card: #0d1f1c;
  --bd: #1a4a42;
}

* { box-sizing: border-box; }
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  transition: background .35s ease;
}
body {
  margin: 0;
  min-height: 100vh;
  color: var(--tx);
  font: 15px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background:
    radial-gradient(1100px 500px at 50% -120px, var(--glow), transparent 70%),
    var(--bg);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 20;
}

/* Header */
header {
  padding: 18px 16px 6px;
  max-width: 760px;
  margin: 0 auto;
}
h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 3px;
  font-weight: 900;
  text-transform: uppercase;
}
h1 span { color: var(--ac); }
.sub {
  color: var(--mu);
  font-size: 12px;
  letter-spacing: 1.2px;
  margin-top: 2px;
  text-transform: uppercase;
}

/* Sticky top bar */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 8px 12px 4px;
  border-bottom: 1px solid color-mix(in srgb, var(--bd) 60%, transparent);
}

/* Brands */
.brands {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  max-width: 760px;
  margin: 0 auto;
}
.brands button {
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 11px;
  padding: 10px 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .6px;
  cursor: pointer;
  transition: all .2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.brands button::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
  flex-shrink: 0;
}
.brands button.on {
  background: var(--c);
  border-color: var(--c);
  color: #fff;
  box-shadow: 0 0 18px -4px var(--c);
}
.brands button.on[style*="9aa0ad"],
.brands button.on[style*="a0a6b4"],
.brands button.on[style*="d4a017"] {
  color: #111;
}
.brands button.on::before { background: currentColor; }

/* Nav tabs */
nav {
  display: flex;
  gap: 6px;
  padding: 10px 0 6px;
  overflow-x: auto;
  max-width: 760px;
  margin: 0 auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button, .chip {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  padding: 8px 14px;
  border-radius: 22px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s ease;
  white-space: nowrap;
}
nav button.on, .chip.on {
  background: var(--ac);
  border-color: var(--ac);
  color: var(--on);
  font-weight: 700;
  box-shadow: 0 0 14px -5px var(--ac);
}

/* Main content */
main {
  padding: 12px 14px 60px;
  max-width: 760px;
  margin: 0 auto;
}

/* Cards & sections */
.card, .sec {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  transition: border-color .2s;
}
.sec {
  border-left: 4px solid var(--c);
  margin-bottom: 16px;
}
.sh {
  font-weight: 800;
  letter-spacing: 1.6px;
  color: var(--c);
  margin-bottom: 8px;
  font-size: 13px;
  text-transform: uppercase;
}
.hero {
  border-color: var(--ac);
  box-shadow: 0 0 28px -12px var(--ac);
  background: linear-gradient(145deg, color-mix(in srgb, var(--ac) 8%, var(--card)), var(--card));
}
.champ {
  font-size: 22px;
  font-weight: 900;
  color: var(--ac);
  letter-spacing: .5px;
  margin: 4px 0 10px;
}

/* Details / accordion */
summary {
  cursor: pointer;
  list-style: none;
}
summary::-webkit-details-marker { display: none; }
details.card {
  padding: 0;
  overflow: hidden;
}
details.card > summary {
  padding: 14px;
}
details.card[open] > summary {
  border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--ac) 5%, transparent);
}
details.card > :not(summary) {
  padding: 14px;
}

/* Layout helpers */
.row, .rw {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.rw {
  padding: 8px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--bd) 70%, transparent);
  gap: 6px;
}
.rw:last-child { border: 0; }
.g {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.fl {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

/* Form elements */
input, select, textarea {
  background: var(--in);
  color: var(--tx);
  border: 1px solid var(--bd);
  border-radius: 9px;
  padding: 10px 11px;
  font: inherit;
  min-width: 0;
  width: 100%;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--ac) 25%, transparent);
}
.row input, .row select { width: auto; }
input.f { flex: 1 1 140px; }
textarea {
  margin-top: 4px;
  resize: vertical;
  min-height: 60px;
}

/* Buttons */
button.add {
  background: var(--ac);
  color: var(--on);
  border: 0;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: transform .12s, box-shadow .15s;
}
button.add:active { transform: scale(.97); }
button.add:hover { box-shadow: 0 0 16px -4px var(--ac); }
button.x {
  background: none;
  border: 0;
  color: var(--mu);
  font-size: 14px;
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 6px;
  transition: color .15s, background .15s;
}
button.x:hover {
  color: #ff6b6b;
  background: color-mix(in srgb, #ff6b6b 12%, transparent);
}

/* Text & tags */
.t { font-weight: 650; }
.m { color: var(--mu); font-size: 13px; }
.n {
  display: inline-flex;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--ac);
  color: var(--on);
  font-size: 12px;
  font-weight: 800;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tag {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 12px;
  border: 1px solid var(--bd);
  color: var(--mu);
  white-space: nowrap;
  font-weight: 500;
}
.face {
  color: var(--ac);
  border-color: color-mix(in srgb, var(--ac) 50%, transparent);
  background: color-mix(in srgb, var(--ac) 10%, transparent);
}
.heel {
  color: #ff6b6b;
  border-color: color-mix(in srgb, #ff6b6b 50%, transparent);
  background: color-mix(in srgb, #ff6b6b 10%, transparent);
}
.sp { flex: 1; }
.empty {
  text-align: center;
  color: var(--mu);
  padding: 32px 12px;
  font-size: 14px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0;
}

h2 {
  font-size: 12px;
  letter-spacing: 1.8px;
  color: var(--ac);
  margin: 20px 2px 10px;
  text-transform: uppercase;
  font-weight: 800;
}

/* Small polish */
.rw .t { font-size: 15px; }
.sec .rw:last-child { padding-bottom: 0; }

@media (max-width: 420px) {
  .brands button { font-size: 11px; padding: 9px 2px; }
  h1 { font-size: 20px; letter-spacing: 2px; }
}

<script>
const KEY = 'wwe-universe-v3', OLD = 'wwe-universe-v2';
const BRS = ['Raw','SmackDown','NXT','Free Agency'], BR3 = BRS.slice(0,3);
const COL = {Raw:'#e11d2e', SmackDown:'#2a7bf0', NXT:'#a0a6b4', 'Free Agency':'#9b5de5'};
const DIV = ['Masculino','Feminino'], CARD = ['Main Eventer','Midcard','Lowcard'];
const ST = ['Ativo','Lesionado','Ausente','Em Desenvolvimento'];
const LVS = ['Main Event','Midcard','Lowcard','Tag Team'];
const MS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const N = {
  Raw: 'World Heavyweight Championship,Intercontinental Championship,Hardcore Championship,World Tag Team Championship,Women’s World Championship,Women’s Intercontinental Championship,Women’s Hardcore Championship',
  SmackDown: 'WWE Championship,United States Championship,Speed Championship,WWE Tag Team Championship,WWE Women’s Championship,Women’s United States Championship,Women’s Speed Championship',
  NXT: 'NXT Championship,NXT North American Championship,NXT Heritage Championship,NXT Tag Team Championship,NXT Women’s Championship,NXT Women’s North American Championship,NXT Women’s Heritage Championship'
};
const LV = ['Main Event','Midcard','Lowcard','Tag Team','Main Event','Midcard','Lowcard'];
const uid = () => Math.random().toString(36).slice(2,9);
const mkT = (n,b,lv) => ({id:uid(), name:n, brand:b, lv, champ:'', since:'', reigns:0, defs:0, rank:[], obs:''});
const seed = () => ({roster:[], teams:[], titles: BR3.flatMap(b => N[b].split(',').map((n,j) => mkT(n,b,LV[j]))), factions:[], feuds:[], shows:[], year:{}, matchTypes:['Promo','Single','Tag Team','Triple Threat','Fatal 4-Way','Battle Royal','Royal Rumble','Ladder Match','Tables Match','TLC','Hell in a Cell','Steel Cage','No Holds Barred','Iron Man','Submission','Last Man Standing'], pushBoard:{suggestions:{men:[],women:[],tagMen:[],tagWomen:[]}, selected:{singles:[],tags:[]}, activeBonus:{singles:[],tags:[]}, lastPpvId:'', pending:false}, promoAdded:true});

function mig(o) {
  if (!o || !o.titles) return seed();
  ['roster','teams','factions','feuds','shows'].forEach(k => o[k] = o[k] || []);
  o.pushBoard = o.pushBoard || {suggestions:{men:[],women:[],tagMen:[],tagWomen:[]}, selected:{singles:[],tags:[]}, activeBonus:{singles:[],tags:[]}, lastPpvId:'', pending:false};
  o.pushBoard.suggestions = o.pushBoard.suggestions || {men:[],women:[],tagMen:[],tagWomen:[]};
  o.pushBoard.selected = o.pushBoard.selected || {singles:[],tags:[]};
  o.pushBoard.activeBonus = o.pushBoard.activeBonus || {singles:[],tags:[]};
  o.feuds.forEach(f=>{
    f.kind = f.kind || 'lutador';
    f.division = f.division || 'Masculino';
    f.hasTitle = !!f.hasTitle;
    f.titleId = f.titleId || '';
    f.sideA = f.sideA || (f.a?[f.a]:[]);
    f.sideB = f.sideB || (f.b?[f.b]:[]);
    f.participants = f.participants || [];
    f.resolved = !!f.resolved;
  });
  o.year = o.year || {};
  o.moves = o.moves || [];
  if(!o.promoAdded){ if(!o.matchTypes.includes('Promo')) o.matchTypes.unshift('Promo'); o.promoAdded=true; }
  o.nxtReview = o.nxtReview || {last:'',kept:[]};
  o.matchTypes = o.matchTypes || ['Single','Tag Team','Triple Threat','Fatal 4-Way','Battle Royal','Royal Rumble','Ladder Match','Tables Match','TLC','Hell in a Cell','Steel Cage','No Holds Barred','Iron Man','Submission','Last Man Standing'];
  o.roster.forEach(r => {
    r.role = r.role || 'Lutador';
    r.origin = r.origin || 'Não definido';
    if (!BRS.includes(r.brand)) r.brand = 'Free Agency';
    if (r.division == 'Tag Team') r.division = 'Masculino';
    r.manager = r.manager || '';
    r.faction = r.faction || '';
    r.alignment = r.alignment || 'Tweener';
    if(r.popAdj==null)r.popAdj=0;
    if(r.photo==null)r.photo='';
    r.stats = r.stats || {wins:0,losses:0,draws:0};
  });
  o.titles.forEach(t => { t.rank = t.rank || (t.q || []).filter(Boolean); t.history = t.history || []; if(t.champ && !t.history.some(h=>h.champion===t.champ)) { const tm=(o.teams||[]).find(x=>x.id===t.champ); t.history.push({champion:t.champ,championMembers:tm?(tm.members||[]).slice():[],previous:'',previousMembers:[],started:t.since||'Histórico anterior',ended:'',lostTo:'',legacy:true}); } });
  o.teams.forEach(t => { t.brand = t.brand || 'Raw'; t.members = t.members || []; });
  o.factions.forEach(f => { f.brand = f.brand || 'Raw'; });
  o.shows.forEach(s => { s.brands = s.brands || [s.brand || 'Raw']; s.matches = (s.matches || []).map(m => typeof m == 'string' ? {t:m,title:'',result:'',notes:'',participants:[],outcomes:{},division:'Masculino',matchType:'Single'} : ({...m,result:m.result||'',notes:m.notes||'',participants:m.participants||[],outcomes:m.outcomes||{},division:m.division||'Masculino',matchType:m.matchType||'Single'})); s.notes=s.notes||''; });
  o.feuds.forEach(f => { f.story = f.story || ''; f.goal = f.goal || ''; });
  return o;
}

let S = null;
try { S = JSON.parse(localStorage.getItem(KEY) || localStorage.getItem(OLD)); } catch(e) {}
S = mig(S);

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const opt = a => a.map(x => `<option>${x}</option>`).join('');
const sel = (a,v,at) => `<select ${at}>` + a.map(x => `<option ${x==v?'selected':''}>${x}</option>`).join('') + '</select>';
const fld = (l,h) => `<label class="fl"><span class="m">${l}</span>${h}</label>`;
const byN = (a,b) => a.name.localeCompare(b.name);
const cmp = (a,b) => CARD.indexOf(a.card) - CARD.indexOf(b.card) || b.push - a.push || byN(a,b);
const person = id => S.roster.find(r => r.id == id) || S.teams.find(t => t.id == id);
const nm = id => (person(id) || {name:'Vago'}).name;
function initials(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';}
function avHtml(r, big, square){
  const cls = (big ? 'av-lg' : 'av') + (square ? ' av-sq' : '');
  if(r && r.photo) return `<img class="${cls}" src="${esc(r.photo)}" alt="${esc(r.name||'')}" onerror="this.onerror=null;this.className='${cls} av-ph';this.removeAttribute('src');this.textContent='${esc(initials(r.name))}';">`;
  return `<div class="${cls} av-ph">${esc(initials(r&&r.name))}</div>`;
}
function avChamp(r){
  if(r && r.photo) return `<img class="champ-photo" src="${esc(r.photo)}" alt="${esc(r.name||'')}" onerror="this.onerror=null;this.className='champ-photo av-ph';this.removeAttribute('src');this.textContent='${esc(initials(r.name))}';">`;
  return `<div class="champ-photo av-ph">${esc(initials(r&&r.name))}</div>`;
}
function avRank(r){
  if(r && r.photo) return `<img class="rank-av" src="${esc(r.photo)}" alt="">`;
  return `<div class="rank-av av-ph">${esc(initials(r&&r.name))}</div>`;
}
function closeAllWsel(except){
  document.querySelectorAll('.wsel.open').forEach(el=>{if(el!==except)el.classList.remove('open');});
}
function wselRoster(list, value, onpick){
  /* onpick = JS expression receiving id string, e.g. "setChamp('tid',id)" */
  const sel = list.find(x=>x.id===value);
  const items = [`<button type="button" class="wsel-item" data-id="" onclick="(function(btn){const w=btn.closest('.wsel');w.classList.remove('open');(${onpick})('');})(this)"><span class="m">— vago / nenhum —</span></button>`]
    .concat(list.slice().sort(byN).map(r=>`<button type="button" class="wsel-item ${r.id===value?'on':''}" data-id="${r.id}" onclick="(function(btn){const w=btn.closest('.wsel');w.classList.remove('open');(${onpick})('${r.id}');})(this)">${avHtml(r,false)}<span>${esc(r.name)} <span class="m">· ${esc(r.brand||'')}</span></span></button>`));
  return `<div class="wsel" onclick="event.stopPropagation()">
    <button type="button" class="wsel-btn" onclick="event.stopPropagation();const w=this.parentElement;const o=w.classList.contains('open');closeAllWsel();if(!o)w.classList.add('open');">
      ${sel?avHtml(sel,false)+`<span>${esc(sel.name)}</span>`:'<span class="m">Selecionar wrestler…</span>'}
    </button>
    <div class="wsel-menu">${items.join('')}</div>
  </div>`;
}
function wselTeam(list, value, onpick){
  const sel = list.find(x=>x.id===value);
  const items = [`<button type="button" class="wsel-item" onclick="(function(btn){btn.closest('.wsel').classList.remove('open');(${onpick})('');})(this)"><span class="m">—</span></button>`]
    .concat(list.slice().sort(byN).map(t=>{
      const mem=(t.members||[]).map(nm).join(' · ');
      return `<button type="button" class="wsel-item ${t.id===value?'on':''}" onclick="(function(btn){btn.closest('.wsel').classList.remove('open');(${onpick})('${t.id}');})(this)"><span>${esc(t.name)}</span><span class="m" style="margin-left:6px">${esc(mem)}</span></button>`;
    }));
  return `<div class="wsel" onclick="event.stopPropagation()">
    <button type="button" class="wsel-btn" onclick="event.stopPropagation();const w=this.parentElement;const o=w.classList.contains('open');closeAllWsel();if(!o)w.classList.add('open');">
      ${sel?`<span>${esc(sel.name)}</span><span class="m"> · ${esc((sel.members||[]).map(nm).join(' · '))}</span>`:'<span class="m">Selecionar tag…</span>'}
    </button>
    <div class="wsel-menu">${items.join('')}</div>
  </div>`;
}
function wselInput(list, name, value, ph, inputId){
  const sel = list.find(x=>x.id===value);
  const label = (r)=> r ? avHtml(r,false)+`<span>${esc(r.name)}</span>` : `<span class="m">${esc(ph||'Selecionar wrestler…')}</span>`;
  const items = [`<button type="button" class="wsel-item" data-clear="1"><span class="m">${esc(ph||'—')}</span></button>`]
    .concat(list.slice().sort(byN).map(r=>`<button type="button" class="wsel-item ${r.id===value?'on':''}" data-id="${r.id}">${avHtml(r,false)}<span>${esc(r.name)} <span class="m">· ${esc(r.brand||'')}</span></span></button>`));
  return `<div class="wsel" onclick="event.stopPropagation()" data-wsel-input="1">
    <button type="button" class="wsel-btn" onclick="event.stopPropagation();const w=this.parentElement;const o=w.classList.contains('open');closeAllWsel();if(!o)w.classList.add('open');">${label(sel)}</button>
    <div class="wsel-menu">${items.join('')}</div>
    <input type="hidden" ${inputId?`id="${inputId}"`:''} name="${name}" value="${esc(value||'')}">
  </div>`;
}
function bindWselInputs(root){
  (root||document).querySelectorAll('.wsel[data-wsel-input] .wsel-item').forEach(btn=>{
    if(btn._bound)return; btn._bound=true;
    btn.addEventListener('click',()=>{
      const w=btn.closest('.wsel'); w.classList.remove('open');
      const h=w.querySelector('input[type=hidden]');
      const b=w.querySelector('.wsel-btn');
      if(btn.dataset.clear){ if(h)h.value=''; if(b)b.innerHTML='<span class="m">Selecionar wrestler…</span>'; return; }
      const id=btn.dataset.id; if(h)h.value=id;
      const r=S.roster.find(x=>x.id===id);
      if(b&&r)b.innerHTML=avHtml(r,false)+'<span>'+esc(r.name)+'</span>';
    });
  });
}
document.addEventListener('click',()=>closeAllWsel());


function setPhotoUrl(id,url){const r=S.roster.find(x=>x.id===id);if(!r)return;r.photo=(url||'').trim();save();draw();}
function clearPhoto(id){const r=S.roster.find(x=>x.id===id);if(!r)return;r.photo='';save();draw();}
function setPhotoFile(id,input){
  const file=input&&input.files&&input.files[0];if(!file)return;
  if(!file.type.startsWith('image/')){alert('Escolha uma imagem.');return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=420; let w=img.width, h=img.height;
      if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const data=canvas.toDataURL('image/jpeg',0.72);
      const r=S.roster.find(x=>x.id===id);if(!r)return;r.photo=data;save();draw();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

const carry = id => S.titles.filter(t => t.champ && (t.champ == id || ((S.teams.find(x => x.id == t.champ) || {}).members || []).includes(id)));
const lut = b => S.roster.filter(r => r.role == 'Lutador' && (!b || r.brand == b));
const mgrs = () => S.roster.filter(r => r.role == 'Manager');
const po = (l,v,ph) => `<option value="">${ph || '—'}</option>` + l.slice().sort(byN).map(x => `<option value="${x.id}" ${x.id==v?'selected':''}>${esc(x.name)}</option>`).join('');
const pool = t => t.lv == 'Tag Team' ? S.teams.filter(x => x.brand == t.brand) : lut(t.brand).filter(r => /women/i.test(t.name) ? r.division == 'Feminino' : r.division != 'Feminino');
const em = t => `<div class="empty">${t}</div>`;
const tag = (t,c) => `<span class="tag ${c||''}">${esc(t)}</span>`;
const trophies = id => carry(id).map(x => tag('🏆 ' + x.name, 'face')).join('');
const OP = new Set(), SEL = {};
let B = 'Raw', tab = 'landing', F = {r:'', d:''}, G = {r:'', d:''};
const tg = (id,o) => { o ? OP.add(id) : OP.delete(id); };
const dt = (id,head,body) => `<details class="card" ${OP.has(id)?'open':''} ontoggle="tg('${id}',this.open)"><summary>${head}</summary>${body}</details>`;
const TABS = [['landing','Home inicial'],['all','Home da brand'],['roster','Roster da brand'],['titles','Títulos'],['feuds','Rivalidades'],['shows','Shows / PPVs'],['teams','Tag Teams & Facções'],['push','Push pós-PPV'],['summary','Resumo'],['year','Histórico'],['freeAgency','Free Agency'],['downgrade','Downgrade → NXT'],['nxtcut','Revisão da NXT'],['globalRoster','Roster global'],['bk','Backup']];

function sb(b) { B = b; tab = b==='Free Agency'?'freeAgency':'all'; draw(); window.scrollTo(0,0); }
function go(t) { tab = t; draw(); window.scrollTo(0,0); }
function setF(scope,k,v){(scope==='g'?G:F)[k]=v;draw();}
function filterMenu(scope,color){const f=scope==='g'?G:F;const row=(k,label,opts,all)=>`<div class="fm-row"><span class="fm-l">${label}</span>${[['',all]].concat(opts.map(o=>[o,o])).map(([v,l])=>`<button class="fm-chip ${f[k]===v?'on':''}" onclick="setF('${scope}','${k}','${v}')">${l}</button>`).join('')}</div>`;return `<div class="filter-menu" style="--c:${color}">${row('r','PAPEL',['Lutador','Manager'],'Todos')}${row('d','DIVISÃO',DIV,'Todas')}</div>`;}
function st(k,id,f,v,rd) { const x=S[k].find(x=>x.id==id); if(x)x[f]=v; save(); if(rd)draw(); }
function statsFor(id){let wins=0,losses=0,draws=0;S.shows.forEach(s=>(s.matches||[]).forEach(m=>{if(m.matchType==='Promo'||!(m.participants||[]).includes(id))return;const o=(m.outcomes||{})[id];if(o==='Vitoria')wins++;else if(o==='Derrota')losses++;else if(o==='Empate')draws++;}));const total=wins+losses+draws;return{wins,losses,draws,total,pct:total?Math.round(wins/total*100):0};}

/* ===== ESTRELAS DAS LUTAS (0 a 5, passo 0,5) ===== */
const STAR_STEPS=Array.from({length:11},(_,i)=>i/2);
function starTxt(v){if(typeof v!=='number'||isNaN(v))return '';const f=Math.floor(v);return (f?'★'.repeat(f):'')+(v-f>=.5?'½':'')+(v===0?'☆':'')+' '+v.toFixed(1).replace('.',',');}
function starsInfo(id){let sum=0,n=0;S.shows.forEach(sh=>(sh.matches||[]).forEach(m=>{if(typeof m.stars==='number'&&(m.participants||[]).includes(id)){sum+=m.stars;n++;}}));
  // nota manual do perfil (opcional) vale como ponto de partida; sem ela, o ponto de partida é 3,0 (neutro)
  const r=S.roster.find(x=>x.id===id),man=r&&typeof r.starBase==='number'?r.starBase:null,base=man!=null?man:3;
  return {n,sum,man,avg:n?sum/n:null,adj:(sum+base*2)/(n+2)};}
function starLine(id){const i=starsInfo(id),f=v=>v.toFixed(1).replace('.',',');if(i.man!=null)return '★ '+f(i.adj)+(i.n?' ('+i.n+(i.n===1?' luta':' lutas')+' + base '+f(i.man)+')':' (manual)');return i.n?'★ '+f(i.avg)+' ('+i.n+(i.n===1?' luta':' lutas')+')':'★ sem notas';}
function starFactor(id){return .4+1.6*starsInfo(id).adj/5;}      // 0,4 (péssimo) … 2,0 (5 estrelas)
function pushWeight(r){const p=popularity(r.id),ideal=Math.abs((p<40?40:p>75?75:p)-55);const fit=Math.max(.2,1-ideal/25);const f=starFactor(r.id);return fit*f*f;}
function weightedOrder(items,wfn){return items.map(x=>({x,k:-Math.log(Math.random()||1e-9)/Math.max(1e-6,wfn(x))})).sort((a,b)=>a.k-b.k).map(o=>o.x);}
function setMatchStars(showId,idx,val){const m=S.shows.find(s=>s.id==showId).matches[idx];if(val==='')delete m.stars;else m.stars=Math.max(0,Math.min(5,Math.round(+val*2)/2));save();draw();}

/* ===== DATA DO UNIVERSO / UTILITÁRIOS DE DATA ===== */
const WK={Raw:1,SmackDown:5,NXT:2}, DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(x){const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(x,n){const d=pd(x);d.setDate(d.getDate()+n);return dstr(d);}
function addMonths(x,n){const d=pd(x);d.setMonth(d.getMonth()+n);return dstr(d);}
function fmtBR(x){return x?x.split('-').reverse().join('/'):'';}
function dow(x){return DIAS[pd(x).getDay()];}
function universeDate(){const done=S.shows.filter(s=>s.completed&&s.date).map(s=>s.date).sort();if(done.length)return done[done.length-1];const all=S.shows.filter(s=>s.date).map(s=>s.date).sort();return all.length?all[0]:dstr(new Date());}

/* ===== CALENDÁRIO: shows semanais avançam +7 dias automaticamente ===== */
function lastWeekly(b){const l=S.shows.filter(s=>s.type==='Show semanal'&&s.brand===b&&s.date).map(s=>s.date).sort();return l.length?l[l.length-1]:'';}
function nextWeekly(b){const l=lastWeekly(b);if(l)return {date:addDays(l,7),auto:true,last:l};const d=new Date();d.setDate(d.getDate()+((WK[b]-d.getDay()+7)%7));return {date:dstr(d),auto:false,last:''};}
function createWeekly(b,manual){const date=manual||nextWeekly(b).date;if(S.shows.some(s=>s.type==='Show semanal'&&s.brand===b&&s.date===date)){alert(b+' já tem show semanal em '+fmtBR(date)+'.');return false;}S.shows.push({id:uid(),name:b,type:'Show semanal',brand:b,brands:[b],date,matches:[],notes:'',completed:false});return true;}
function addWeeklyOne(b){const el=$('wk'+b);if(createWeekly(b,el&&el.value)){save();draw();}}
function addWeeklyPack(){let ok=false;['Raw','SmackDown','NXT'].forEach(b=>{const el=$('wk'+b);if(createWeekly(b,el&&el.value))ok=true;});if(ok){save();draw();}}

/* ===== DESEMPENHO (usado no downgrade e na revisão da NXT) ===== */
function champIds(){const ids=new Set();S.titles.forEach(t=>{if(!t.champ)return;ids.add(t.champ);const tm=S.teams.find(x=>x.id===t.champ);if(tm)(tm.members||[]).forEach(m=>ids.add(m));});return ids;}
function perfOf(r,pool){const pop=popularity(r.id),si=starsInfo(r.id),st=statsFor(r.id);const maxW=Math.max(1,...pool.map(x=>statsFor(x.id).wins));
  const starsBad=(5-si.adj)/5*100,winsBad=100*(1-(.5*st.wins/maxW+.5*(st.total?st.wins/st.total:.5)));
  return {r,pop,si,st,score:.35*(100-pop)+.35*starsBad+.30*winsBad};}
function perfReason(c){const w=c.st.wins;return 'Pop '+Math.round(c.pop)+'% · '+starLine(c.r.id)+' · '+w+(w===1?' vitória':' vitórias')+(c.st.total?' ('+c.st.pct+'%)':'')+' · pior nota '+c.score.toFixed(0)+'/100';}
function worstByDivision(pool,n){const ch=champIds(),res={};['Masculino','Feminino'].forEach(d=>{const g=pool.filter(r=>r.division===d&&!ch.has(r.id));res[d]=g.map(r=>perfOf(r,g)).sort((a,b)=>b.score-a.score).slice(0,n);});return res;}
function moveBrand(id,to,kind){const r=S.roster.find(x=>x.id===id);if(!r)return;if(!confirm((kind==='cut'?'Demitir ':'Mandar para a '+to+': ')+r.name+(kind==='cut'?' (vai para a Free Agency)?':'?')))return;
  (S.moves=S.moves||[]).unshift({date:universeDate(),id,name:r.name,from:r.brand,to,kind});r.brand=to;save();draw();}

/* ===== SUGESTÃO DE BOOKING (renovada a cada 3 meses, pela data do universo) ===== */
function hashN(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rngFrom(seed){let a=hashN(String(seed))||1;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pickR(rnd,arr){return arr.length?arr[Math.floor(rnd()*arr.length)]:null;}
function rosterAverages(){const l=S.roster.filter(r=>r.role==='Lutador'&&r.brand!=='Free Agency');if(!l.length)return {pop:50,adj:3};return {pop:l.reduce((a,r)=>a+popularity(r.id),0)/l.length,adj:l.reduce((a,r)=>a+starsInfo(r.id).adj,0)/l.length};}
const FAC_WORDS=['Regime','Syndicate','Order','Dominion','Collective','Alliance','Legion','Council'];
const TAG_WORDS=['Connection','Express','Dynasty','Inc.','Brothers','Duo','Project','Tandem'];
function buildBooking(r,bump){
  const today=universeDate(),av=rosterAverages(),pop=popularity(r.id),si=starsInfo(r.id),st=statsFor(r.id),held=carry(r.id);
  const rnd=rngFrom(r.id+'|'+today+'|'+(bump||0));
  const z=(pop-av.pop)/15+(si.adj-av.adj)/.8+(st.total>=3?(st.pct-50)/50:0)+(held.length?1:0);
  const reduced=!held.length&&(pop<av.pop-8||si.adj<av.adj-.7||(st.total>=3&&st.pct<30));
  const tier=reduced?'reduzido':(z>=1.5||(pop>=75&&si.adj>=3.5))?'forte':z>=.4?'subindo':'estavel';
  const short=r.name.split(' ').slice(-1)[0];
  const same=S.roster.filter(x=>x.id!==r.id&&x.role==='Lutador'&&x.status!=='Lesionado'&&x.brand===r.brand&&x.division===r.division);
  const byClose=(arr)=>arr.slice().sort((a,b)=>Math.abs(popularity(a.id)-pop)-Math.abs(popularity(b.id)-pop)).slice(0,3);
  const al=r.alignment||'Tweener';
  const opp=al==='Face'?'Heel':al==='Heel'?'Face':null;
  const rivals=byClose(same.filter(x=>!opp||x.alignment===opp));
  const rival=pickR(rnd,rivals.length?rivals:byClose(same)),rival2=pickR(rnd,byClose(same).filter(x=>!rival||x.id!==rival.id));
  const free=same.filter(x=>!S.teams.some(t=>(t.members||[]).includes(x.id)&&t.status!=='Dissolvido'));
  const partner=(r.brand!=='Free Agency'&&!teamFor(r.id).length)?pickR(rnd,byClose(free.filter(x=>x.alignment===al||!x.alignment))):null;
  const facPool=same.filter(x=>!x.faction&&(!partner||x.id!==partner.id)&&x.alignment===al);
  const facMembers=(!r.faction&&r.brand!=='Free Agency'&&facPool.length>=2)?byClose(facPool).slice(0,2):[];
  const titles=S.titles.filter(t=>t.brand===r.brand&&t.champ&&!held.includes(t)&&((S.roster.find(x=>x.id===t.champ)||{}).division||r.division)===r.division&&t.lv!=='Tag Team');
  const title=pickR(rnd,titles.filter(t=>(r.card==='Main Event'?t.lv==='Main Event':true)));
  const plan=[],act={turn:null,partner:null,teamName:'',facIds:[],facName:''};
  const rv=rival?rival.name:'um rival da brand';
  let head,why;
  if(r.brand==='Free Agency'){
    tier==='reduzido'?(head='Sem contrato · baixa demanda',why='Popularidade e estrelas abaixo da média do elenco.'):(head='Sem contrato · bom candidato à contratação',why='Estatísticas acima ou na média do elenco: vale contratar.');
    plan.push('Contratar para '+(r.division==='Feminino'?'Raw ou SmackDown':'Raw, SmackDown ou NXT')+' conforme a vaga e iniciar com 2–3 vitórias em TV para recuperar o momentum.');
  }else if(tier==='forte'){
    head='Destaque · booking de topo de card';
    why='Popularidade '+Math.round(pop)+'% (média do elenco '+Math.round(av.pop)+'%), '+starLine(r.id).replace('★ ','')+' estrelas'+(held.length?' e campeão atual':'')+'. Está com momentum.';
    plan.push(held.length?'Defesas de título em PPV contra '+rv+(rival2?' e '+rival2.name:'')+', com reinado longo e vitórias limpas.':(title?'Disputa pelo '+title.name+' (campeão: '+nm(title.champ)+'), construída em 3 shows com promos e luta em PPV.':'Rivalidade principal com '+rv+' ao longo dos próximos 3 meses, fechando em luta de PPV.'));
    plan.push('Espaço no main event de TV e promo de abertura ao menos 1 vez por mês.');
    if(al==='Face'&&pop>=75){act.turn='Heel';plan.push('Virada heel: traição a '+(partner?partner.name:'um aliado')+' no auge do apoio do público — história de "quem te fez grande agora te abandona".');}
    else if(al==='Heel'&&pop>=75){act.turn='Face';plan.push('Virada face: o público já torce por ele; deixe os fãs "adotarem" '+short+' após uma derrota injusta por interferência.');}
    else if(al==='Tweener'){act.turn=rnd()<.5?'Face':'Heel';plan.push('Definir alinhamento ('+act.turn+') para dar direção clara ao personagem no topo.');}
  }else if(tier==='subindo'){
    head='Em ascensão · meio de card em alta';
    why='Acima da média recente ('+Math.round(pop)+'% de popularidade, '+si.adj.toFixed(1).replace('.',',')+'★). Merece subir de degrau.';
    plan.push('Rivalidade com '+rv+': dois confrontos em TV (um de cada lado vencendo) e luta decisiva em PPV.');
    plan.push('Sequência de 2–3 vitórias em TV para firmar o nome e sustentar o crescimento.');
    if(title)plan.push('Se mantiver o ritmo, disputar o '+title.name+' no próximo ciclo.');
  }else if(tier==='estavel'){
    head='Estável · manter no meio de card';
    why='Desempenho na média do elenco ('+Math.round(pop)+'% de popularidade, '+si.adj.toFixed(1).replace('.',',')+'★).';
    plan.push('Luta de TV regular e uma história curta com '+rv+' para testar a reação do público.');
    plan.push('Subir só se emendar boas lutas (≥ 3,5★) e vitórias nos próximos shows.');
  }else{
    head='Participação reduzida até melhorar';
    why='Abaixo da média do elenco ('+Math.round(pop)+'% vs '+Math.round(av.pop)+'% de popularidade; '+si.adj.toFixed(1).replace('.',',')+'★ vs '+av.adj.toFixed(1).replace('.',',')+'★'+(st.total>=3?'; '+st.pct+'% de aproveitamento':'')+').';
    plan.push('Aparições curtas: segmentos, promos e lutas de TV sem destaque; fora de títulos e de lutas principais de PPV.');
    plan.push('Reconstrução: vitória clara sobre '+(rival?rival.name:'um lutador de nível menor')+' para reabrir a história.');
    plan.push('Meta para voltar a ter destaque: popularidade ≥ '+Math.round(av.pop)+'% e estrelas ≥ '+av.adj.toFixed(1).replace('.',',')+'.');
    {act.turn=al==='Face'?'Heel':'Face';plan.push('Mudança de alinhamento ('+al+' → '+act.turn+') para renovar o personagem: '+(act.turn==='Heel'?'abandona o público que "não o apoiou o suficiente"':'passa a ser o azarão que o público volta a abraçar')+'.');}
  }
  if(partner&&tier!=='forte'||(partner&&tier==='forte'&&rnd()<.4)){act.partner=partner.id;act.teamName=short+' & '+partner.name.split(' ').slice(-1)[0]+' '+pickR(rnd,TAG_WORDS);plan.push('Tag team com '+partner.name+' ("'+act.teamName+'"): '+(tier==='reduzido'?'dividir o holofote ajuda a recuperar fôlego e a estar em lutas de PPV.':'abre a disputa pelos títulos de duplas.'));}
  if(facMembers.length&&(tier==='forte'||tier==='subindo')&&rnd()<.6){act.facIds=facMembers.map(x=>x.id);act.facName=short+' '+pickR(rnd,FAC_WORDS);plan.push('Facção "'+act.facName+'" com '+facMembers.map(x=>x.name).join(' e ')+': '+short+' como líder, dominando o meio de card.');}
  if(rival)plan.push('História sugerida: '+(al==='Face'?rv+' passa a desprezar '+r.name+' depois de roubar uma vitória; '+r.name+' busca revanche limpa.':al==='Heel'?r.name+' ataca '+rv+' nos bastidores para provar quem manda; a revanche vira o evento principal da semana.':r.name+' e '+rv+' disputam o respeito do vestiário — o vencedor decide de que lado vai ficar.'));
  return {date:today,next:addMonths(today,3),tier,head,why,plan,act,bump:bump||0};
}
let _bkSave=0;
function ensureBooking(r){
  if(r.role!=='Lutador')return null;
  const b=r.bookingSug;
  if(!b||universeDate()>=b.next){r.bookingSug=buildBooking(r,0);if(!_bkSave)_bkSave=setTimeout(()=>{_bkSave=0;save();},60);}
  return r.bookingSug;
}
function regenBooking(id){const r=S.roster.find(x=>x.id===id);if(!r)return;r.bookingSug=buildBooking(r,((r.bookingSug||{}).bump||0)+1);save();draw();}
function bookingTurn(id){const r=S.roster.find(x=>x.id===id),a=r&&r.bookingSug&&r.bookingSug.act;if(!a||!a.turn)return;if(!confirm('Mudar o alinhamento de '+r.name+' para '+a.turn+'?'))return;r.alignment=a.turn;a.turn=null;save();draw();}
function bookingTeam(id){const r=S.roster.find(x=>x.id===id),a=r&&r.bookingSug&&r.bookingSug.act;if(!a||!a.partner)return;const pt=S.roster.find(x=>x.id===a.partner);if(!pt)return;if(!confirm('Criar a tag team "'+a.teamName+'" com '+r.name+' e '+pt.name+'?'))return;S.teams.push({id:uid(),name:a.teamName,brand:r.brand,members:[r.id,pt.id],status:'Ativo',since:'',manager:'',notes:'Criada pela sugestão de booking.'});a.partner=null;save();draw();}
function bookingFaction(id){const r=S.roster.find(x=>x.id===id),a=r&&r.bookingSug&&r.bookingSug.act;if(!a||!a.facIds||!a.facIds.length)return;const ms=a.facIds.map(i=>S.roster.find(x=>x.id===i)).filter(Boolean);if(!confirm('Criar a facção "'+a.facName+'" com '+[r].concat(ms).map(x=>x.name).join(', ')+'?'))return;const f={id:uid(),name:a.facName,brand:r.brand,tipo:'Stable',status:'Ativa',since:'',leader:r.id,goal:'',enemies:'',notes:'Criada pela sugestão de booking.'};S.factions.push(f);[r].concat(ms).forEach(x=>x.faction=f.id);a.facIds=[];save();draw();}
function bookingBlock(r,held){
  const b=ensureBooking(r);if(!b)return '';
  const col=b.tier==='reduzido'?'heel':'face';
  return `<div class="card" style="margin-top:10px"><div class="row" style="flex-wrap:wrap"><div class="m">SUGESTÃO DE BOOKING · renovada a cada 3 meses</div><span class="sp"></span>${tag(b.head,col)}</div>
  <div class="m" style="margin:8px 0">${esc(b.why)}${held?' Campeão atual: fora das sugestões de push.':''}</div>
  <ul style="margin:0 0 8px 18px;padding:0">${b.plan.map(x=>`<li class="m" style="margin:4px 0">${esc(x)}</li>`).join('')}</ul>
  <div class="row" style="flex-wrap:wrap;gap:6px">${b.act.turn?`<button class="add" onclick="bookingTurn('${r.id}')">Aplicar: virar ${b.act.turn}</button>`:''}${b.act.partner?`<button class="add" onclick="bookingTeam('${r.id}')">Criar tag team sugerida</button>`:''}${b.act.facIds&&b.act.facIds.length?`<button class="add" onclick="bookingFaction('${r.id}')">Criar facção sugerida</button>`:''}<button class="add" onclick="regenBooking('${r.id}')">Outra sugestão</button></div>
  <div class="m" style="margin-top:6px">Gerada em ${fmtBR(b.date)} · próxima renovação em ${fmtBR(b.next)} (data do universo).</div></div>`;
}

function miniShow(sh){const ms=sh.matches||[];const rated=ms.filter(m=>typeof m.stars==='number');const avg=rated.length?rated.reduce((a,m)=>a+m.stars,0)/rated.length:null;

function showAvg(sh){const r=(sh.matches||[]).filter(m=>typeof m.stars==='number'&&m.matchType!=='Promo');return r.length?{avg:r.reduce((a,m)=>a+m.stars,0)/r.length,n:r.length}:null;}
function starAvgTxt(v){return starTxt(Math.floor(v*2)/2).replace(/\s[\d,]+$/,'')+' '+v.toFixed(2).replace('.',',');}

function teamFor(id){return S.teams.filter(t=>(t.members||[]).includes(id));}
function historyHas(h,field,id){return h[field]===id||(h[field+'Members']||[]).includes(id)||teamFor(id).some(tm=>tm.id===h[field]);}
function titleReigns(id){return S.titles.reduce((n,t)=>n+(t.history||[]).filter(h=>historyHas(h,'champion',id)).length,0);}
function hasPushBonus(id){
  const pb=S.pushBoard||{};
  const ab=pb.activeBonus||{singles:[],tags:[]};
  if((ab.singles||[]).includes(id)) return true;
  return (ab.tags||[]).some(tid=>{
    const t=S.teams.find(x=>x.id===tid);
    return t&&(t.members||[]).includes(id);
  });
}
function popularity(id){
  const r=S.roster.find(x=>x.id===id);
  let score=50+(r&&r.popAdj?+r.popAdj:0);
  S.shows.forEach(s=>(s.matches||[]).forEach(m=>{
    const o=(m.outcomes||{})[id];if(!o)return;
    // Promo: vencedor +0,5 · perdedor −0,5 · empate: todos +0,5
    if(m.matchType==='Promo'){if(o==='Vitoria'||o==='Empate')score+=.5;else if(o==='Derrota')score-=.5;return;}
    const stv=typeof m.stars==='number'?m.stars:null;
    if(o==='Vitoria'){let g=m.matchType==='Royal Rumble'?10:s.type==='PPV'?2.5:1;if(stv===5)g*=1.5;score+=g;}   // luta 5★: vencedor ganha ×1,5
    else if(o==='Derrota'){let l=.5;if(stv!==null&&stv>=5)l=0;else if(stv!==null&&stv>=4)l=.25;score-=l;}        // 5★ não perde · 4–4,5★ perde metade
  }));
  S.titles.forEach(t=>(t.history||[]).forEach(h=>{
    if(historyHas(h,'champion',id))score+=5;
    if(historyHas(h,'previous',id))score-=5;
  }));
  if(hasPushBonus(id)) score = score * 1.5; // +0.5 no multiplicador até o próximo PPV
  return Math.max(0,Math.min(100,Math.round(score*10)/10));
}
function teamDivision(t){
  const mem=(t.members||[]).map(id=>S.roster.find(r=>r.id===id)).filter(Boolean);
  if(!mem.length) return 'Masculino';
  const f=mem.filter(r=>r.division==='Feminino').length;
  const m=mem.filter(r=>r.division==='Masculino').length;
  if(f&&!m) return 'Feminino';
  if(m&&!f) return 'Masculino';
  return 'Mix';
}
function generatePushSuggestions(ppvId){
  const pb=S.pushBoard||(S.pushBoard={suggestions:{men:[],women:[],tagMen:[],tagWomen:[]},selected:{singles:[],tags:[]},activeBonus:{singles:[],tags:[]},lastPpvId:'',pending:false});
  // Encerra bônus do ciclo anterior ao gerar novas sugestões pós-PPV
  pb.activeBonus={singles:[],tags:[]};
  pb.selected={singles:[],tags:[]};
  const eligible=r=>r.role==='Lutador'&&r.status==='Ativo'&&r.brand!=='Free Agency';
  const rankW=(a,b)=>{
    // prioriza mid pop (espaço para crescer) + vitórias recentes
    const pa=popularity(a.id), pb2=popularity(b.id);
    const ideal=x=>Math.abs((x<40?40:x>75?75:x)-55);
    return ideal(pa)-ideal(pb2) || pb2-pa;
  };
  // temporariamente sem bônus já limpo
  // quanto melhores as estrelas (e quanto mais "espaço para crescer" em popularidade), maior a chance de ser sugerido
  let men=weightedOrder(S.roster.filter(r=>eligible(r)&&r.division==='Masculino'),pushWeight);
  let women=weightedOrder(S.roster.filter(r=>eligible(r)&&r.division==='Feminino'),pushWeight);
  // evita campeões mundiais principais se possível
  const worldish=t=>/championship/i.test(t.name)&&t.lv==='Main Event';
  const isWorldChamp=id=>S.titles.some(t=>worldish(t)&&t.champ===id);
  men=men.filter(r=>!isWorldChamp(r.id)).concat(men.filter(r=>isWorldChamp(r.id)));
  women=women.filter(r=>!isWorldChamp(r.id)).concat(women.filter(r=>isWorldChamp(r.id)));
  const pick=arr=>arr.slice(0,2).map(r=>r.id);
  pb.suggestions.men=pick(men);
  pb.suggestions.women=pick(women);
  const tags=S.teams.filter(t=>(t.members||[]).length>=2&&t.status!=='Dissolvido');
  const tw=t=>{const ms=(t.members||[]).map(id=>S.roster.find(r=>r.id===id)).filter(Boolean);return ms.length?ms.reduce((a,r)=>a+pushWeight(r),0)/ms.length:.2;};
  const tagMen=weightedOrder(tags.filter(t=>teamDivision(t)==='Masculino'),tw);
  const tagWomen=weightedOrder(tags.filter(t=>teamDivision(t)==='Feminino'),tw);
  pb.suggestions.tagMen=tagMen.slice(0,2).map(t=>t.id);
  pb.suggestions.tagWomen=tagWomen.slice(0,2).map(t=>t.id);
  pb.pending=true;
  pb.lastPpvId=ppvId||'';
  S.pushBoard=pb;
}
function togglePushSelect(kind,id){
  const pb=S.pushBoard; if(!pb)return;
  const arr=pb.selected[kind]||(pb.selected[kind]=[]);
  const i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1); else arr.push(id);
  save();draw();
}
function confirmPushPicks(){
  const pb=S.pushBoard; if(!pb)return;
  pb.activeBonus={
    singles:(pb.selected.singles||[]).slice(),
    tags:(pb.selected.tags||[]).slice()
  };

}

function groupFromPicks(name,teamId,store){const ids=[...new Set([...document.querySelectorAll('[name="'+name+'"]')].map(x=>x.value).filter(Boolean))];if(!ids.length)return {empty:true};if(ids.length<2)return {err:'Cada dupla precisa de pelo menos 2 lutadores.'};

function feudSideMembers(f,side){
  const ids=[];
  if(f.kind==='lutador'){
    const arr=side==='a'?(f.sideA||[f.a]).filter(Boolean):(f.sideB||[f.b]).filter(Boolean);

function resolveFeud(id,winnerKey){

    const parts=(f.participants||[]).filter(Boolean);

    const tWin=getTeam(winnerKey);

    parts.filter(tid=>tid!==winnerKey).forEach(tid=>{
      const t=getTeam(tid);
      if(t)(t.members||[]).forEach(m=>lose.push(m));
    });
    win=[...new Set(win)]; lose=[...new Set(lose)].filter(x=>!win.includes(x));
    win.forEach(i=>applyPop(i,1.5));
    lose.forEach(i=>applyPop(i,-1));
  } else {
    const side = winnerKey;
    win=feudSideMembers(f,side);
    lose=feudSideMembers(f,side==='a'?'b':'a');
    const isGroup = f.kind==='tag'||f.kind==='faction';
    const wDelta = isGroup ? 1.5 : 3.5;
    const lDelta = isGroup ? -1 : -2;
    win.forEach(i=>applyPop(i,wDelta));

  }

function addMatch(id){const s=S.shows.find(x=>x.id===id),type=$('type'+id)?.value||'Single',division=$('div'+id)?.value||'Masculino',count=s.name==='Royal Rumble'?30:type==='Promo'?Math.max(1,Math.min(3,parseInt($('cnt'+id)?.value||2))):Math.max(2,Math.min(10,parseInt($('cnt'+id)?.value||2))),participants=[];if(type==='Tag Team'&&s.name!=='Royal Rumble'&&$('tg'+id+'_0_0')){const nT=Math.max(2,Math.min(6,parseInt($('nt'+id)?.value||2))),per=Math.max(1,Math.min(4,parseInt($('per'+id)?.value||2))),groups=[];for(let g=0;g<nT;g++){const mem=[];for(let k=0;k<per;k++){const v=$('tg'+id+'_'+g+'_'+k)?.value;if(v)mem.push(v);}groups.push(mem);}const flat=groups.flat();if(groups.some(g=>g.length!==per)||new Set(flat).size!==flat.length){alert('Preencha todos os lutadores de cada grupo, sem repetir ninguém.');return;}s.matches.push({t:groups.map(g=>g.map(nm).join(' & ')).join(' vs '),title:$('mt'+id).value||'',result:'',notes:'',participants:flat,groups,outcomes:{},division,matchType:type});save();draw();return;}for(let i=0;i<count;i++){const v=$('mp'+id+'_'+i)?.value;if(v&&!participants.includes(v))participants.push(v);}if(participants.length!==count){alert('Selecione '+count+' wrestlers diferentes para esta luta.');return;}if(type==='Royal Rumble'&&participants.length!==30){alert('Royal Rumble exige 30 participantes.');return;}s.matches.push({t:participants.map(nm).join(type==='Promo'?' · ':' vs '),title:type==='Promo'?'':($('mt'+id).value||''),result:'',notes:'',participants,outcomes:{},division,matchType:type});save();draw();}

function parseBackup(txt) {
  txt = String(txt == null ? '' : txt).replace(/^\uFEFF/, '').trim();
  let o = JSON.parse(txt);
  if (typeof o === 'string') o = JSON.parse(o); // JSON duplamente serializado
  // aceita formatos embrulhados: {S:{...}}, {data:{...}}, {state:{...}}
  for (const k of ['S','data','state','universe','backup']) if (o && !o.titles && !o.roster && o[k] && typeof o[k] === 'object') { o = o[k]; break; }
  if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('o arquivo não é um backup do Universe Desk');
  if (!o.titles && !o.roster) throw new Error('não encontrei "titles" nem "roster" no arquivo');
  if (!Array.isArray(o.titles)) o.titles = seed().titles;
  if (!Array.isArray(o.roster)) o.roster = [];
  return o;
}
function showMsg(t) { const m = $('msg'); if (m) m.textContent = t; }
function imp(txt) {
  let o;
  try { o = parseBackup(txt !== undefined && typeof txt === 'string' ? txt : $('bk').value); }
  catch (e) { showMsg('JSON inválido: ' + (e && e.message || e)); return; }
  try {
    S = mig(o); save(); draw();
    showMsg('Importado com sucesso!');
  } catch (e) { console.error(e); showMsg('Erro ao importar: ' + (e && e.message || e)); }
}
function impFile(inp) {
  const f = inp && inp.files && inp.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { imp(String(r.result)); };
  r.onerror = () => showMsg('Não consegui ler o arquivo.');
  r.readAsText(f); inp.value = '';
}
function pickImport() { if (window.AndroidApp && AndroidApp.pickFile) AndroidApp.pickFile(); else $('impf').click(); }
window.onNativeImport = function (txt) { imp(txt); };

utador'?'':`<section class="sec"><div class="sh">MANAGERS</div>${managers.length?managers.map(r=>profileCard(r,true)).join(''):em('Nenhum manager cadastrado.')}</section>`}${filterMenu('g','#35c9a5')}`;

    <div class="card"><div class="sh">TIPOS DE LUTA</div><div class="row"><input id="newType" class="f" placeholder="Novo tipo de luta"><button class="add" onclick="addMatchType()">Adicionar tipo</button></div><div class="chips" style="margin-top:10px">${S.matchTypes.map(t=>`<span class="tag">${esc(t)} <button class="x" onclick="delMatchType(${JSON.stringify(t).replace(/"/g,'&quot;')})">×</button></span>`).join('')}</div></div>`+
    (l.length?`<div class="row" style="gap:8px;margin:4px 0 8px"><button class="add" onclick="minAllShows(true)">▾ Minimizar todos</button><button class="add" onclick="minAllShows(false)">▸ Expandir todos</button></div>`+l.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(s=>`<div class="card"><div class="row"><div><div class="t">${esc(s.name)}</div><div class="m">${s.type}${s.date?' · '+fmtBR(s.date)+' ('+dow(s.date)+')':' · sem data'} · ${brandsFor(s).join(' / ')}</div></div><span class="sp"></span><input type="date" value="${s.date||''}" title="Alterar a data deste show" onchange="st('shows','${s.id}','date',this.value,1)" style="max-width:150px">${tag(s.completed?'Concluído':'Em booking',s.completed?'face':'')}${s.completed&&showAvg(s)?tag('Média do show: '+starAvgTxt(showAvg(s).avg)+' ('+showAvg(s).n+(showAvg(s).n===1?' luta':' lutas')+')','face'):''}<button class="add" type="button" onclick="toggleMinShow('${s.id}')" style="padding:6px 10px">${MINS.has(s.id)?'▸ Expandir':'▾ Minimizar'}</button><button class="x" onclick="del('shows','${s.id}')">✕</button></div>
      ${MINS.has(s.id)?miniShow(s):`<div>${s.matches.map((m,i)=>`<div class="card" style="margin-top:10px;margin-bottom:8px"><div class="row"><span class="m">${i+1}.</span><div><div class="t">${esc(m.matchType||'Luta')} · ${esc(m.division||'Mix')}</div><div class="m">${esc(matchLine(m))}</div></div><span class="sp"></span>${typeof m.stars==='number'?tag(starTxt(m.stars),'face'):''}${m.title?tag('🏆 '+m.title,'face'):''}<button class="x" onclick="delMatch('${s.id}',${i})">Remover</button></div><div class="g" style="margin-top:8px">${fld('Resultado oficial',`<select onchange="setMatchResult('${s.id}',${i},this.value)"><option value="">Não registrado</option>${resultOpts(m)}<option value="__draw" ${m.result==='Empate'?'selected':''}>Empate</option></select>`)}${m.matchType==='Promo'?'':fld('Estrelas da luta (0–5)',`<select onchange="setMatchStars('${s.id}',${i},this.value)"><option value="">Sem nota</option>${STAR_STEPS.map(v=>`<option value="${v}" ${m.stars===v?'selected':''}>${starTxt(v)}</option>`).join('')}</select>`)}${fld('Notas da luta',`<input value="${esc(m.notes||'')}" placeholder="Finalização, interferência, momento-chave..." onchange="matchEdit('${s.id}',${i},'notes',this.value)">`)}</div></div>`).join('')}
      ${s.rumble?rumbleForm(s.id,'Masculino')+rumbleForm(s.id,'Feminino'):`<div id="matchForm${s.id}">${matchForm(s.id)}</div>`}<label class="fl" style="margin-top:10px"><span class="m">Notas do show / plano do booker</span><textarea rows="2" placeholder="Promos, segmentos, decisões para as histórias..." onchange="st('shows','${s.id}','notes',this.value)">${esc(s.notes||'')}</textarea></label><div class="row" style="margin-top:10px"><button class="add" onclick="completeShow('${s.id}')">${s.completed?'Reabrir show':'Marcar show concluído'}</button></div></div>`}</div>`).join(''):em('Nenhum evento ainda. Crie um card ou gere a semana padrão.'));
  },


  downgrade() {
    const pool=S.roster.filter(r=>r.role==='Lutador'&&r.status!=='Lesionado'&&['Raw','SmackDown'].includes(r.brand));
    const w=worstByDivision(pool,4);
    const card=(c,top)=>`<div class="card" style="margin-top:8px;${top?'border-color:var(--ac)':''}"><div class="row">${avHtml(c.r,false)}<div style="flex:1;min-width:0"><div class="t">${esc(c.r.name)}</div><div class="m">${esc(c.r.brand)} · ${perfReason(c)}</div></div>${top?tag('SUGESTÃO','face'):''}<button class="add" onclick="moveBrand('${c.r.id}','NXT','down')">Mandar para a NXT</button></div></div>`;
    const sec=(d,lbl)=>`<div class="card"><div class="sh">${lbl}</div>${w[d].length?card(w[d][0],true)+(w[d].length>1?`<div class="m" style="margin:12px 0 0">Outros candidatos</div>`+w[d].slice(1).map(c=>card(c,false)).join(''):''):em('Nenhum candidato (campeões não entram na lista).')}</div>`;
    const mv=(S.moves||[]).filter(m=>m.kind==='down').slice(0,8);
    return `<div class="card"><div class="sh">DOWNGRADE PARA A NXT</div><div class="m">Sugere 1 homem e 1 mulher de Raw/SmackDown com o pior desempenho: poucas vitórias, estrelas baixas nas lutas e popularidade baixa (35% popularidade · 35% estrelas · 30% vitórias). Campeões atuais e lesionados não entram. Wrestlers sem lutas avaliadas contam como nota neutra (3,0).</div></div>${sec('Masculino','HOMEM SUGERIDO')}${sec('Feminino','MULHER SUGERIDA')}${mv.length?`<div class="card"><div class="sh">ÚLTIMOS DOWNGRADES</div>${mv.map(m=>`<div class="rw"><span class="t">${esc(m.name)}</span><span class="sp"></span><span class="m">${esc(m.from)} → ${esc(m.to)} · ${fmtBR(m.date)}</span></div>`).join('')}</div>`:''}`;
  },
  nxtcut() {
    const st=nxtState();
    const pool=S.roster.filter(r=>r.role==='Lutador'&&r.brand==='NXT'&&r.status!=='Lesionado');
    const w=worstByDivision(pool,2);
    const kept=st.rv.kept||[];
    const card=(c)=>`<div class="card" style="margin-top:8px"><div class="row">${avHtml(c.r,false)}<div style="flex:1;min-width:0"><div class="t">${esc(c.r.name)}</div><div class="m">${perfReason(c)}</div></div><button class="add" onclick="moveBrand('${c.r.id}','Free Agency','cut')">Demitir</button><button class="add" onclick="keepNxt('${c.r.id}')">Manter</button></div></div>`;
    const sec=(d,lbl)=>{const l=w[d].filter(c=>!kept.includes(c.r.id));return `<div class="card"><div class="sh">${lbl}</div>${l.length?l.map(card).join(''):em('Nenhuma sugestão pendente.')}</div>`;};
    const status=st.isDue?`${tag('REVISÃO DISPONÍVEL','face')} <span class="m">desde ${fmtBR(st.due)} (data do universo: ${fmtBR(st.today)})</span>`:`<span class="m">Próxima revisão em <b>${fmtBR(st.due)}</b> (data do universo: ${fmtBR(st.today)}). Abaixo, uma prévia de como está o ranking agora.</span>`;
    const mv=(S.moves||[]).filter(m=>m.kind==='cut').slice(0,8);
    return `<div class="card"><div class="sh">REVISÃO DA NXT · A CADA 6 MESES</div><div class="m" style="margin-bottom:8px">A cada 6 meses (pela data dos shows do universo) sugere dispensar os 2 piores homens e as 2 piores mulheres da NXT, pela pior combinação de popularidade, estrelas das lutas e vitórias. Campeões e lesionados ficam de fora. "Demitir" envia o lutador para a Free Agency.</div><div class="row" style="flex-wrap:wrap;gap:8px">${status}<span class="sp"></span><button class="add" onclick="finishNxtReview()">Concluir revisão (reinicia 6 meses)</button></div></div>${sec('Masculino','HOMENS · PIORES DA NXT')}${sec('Feminino','MULHERES · PIORES DA NXT')}${mv.length?`<div class="card"><div class="sh">ÚLTIMAS DEMISSÕES</div>${mv.map(m=>`<div class="rw"><span class="t">${esc(m.name)}</span><span class="sp"></span><span class="m">${esc(m.from)} → ${esc(m.to)} · ${fmtBR(m.date)}</span></div>`).join('')}</div>`:''}`;
  },
  push() {
    const pb=S.pushBoard||{suggestions:{men:[],women:[],tagMen:[],tagWomen:[]},selected:{singles:[],tags:[]},activeBonus:{singles:[],tags:[]},pending:false};
    const sug=pb.suggestions||{};
    const sel=pb.selected||{singles:[],tags:[]};
    const ab=pb.activeBonus||{singles:[],tags:[]};
    const cardW=(id,kind)=>{
      const r=S.roster.find(x=>x.id===id); if(!r)return '';
      const on=(sel[kind]||[]).includes(id);
      const active=(ab.singles||[]).includes(id);
      return `<button type="button" class="card" style="text-align:left;cursor:pointer;border-color:${on||active?'var(--ac)':''}" onclick="togglePushSelect('singles','${id}')">
        <div class="row">${avHtml(r,false)}<div style="flex:1"><div class="t">${esc(r.name)}</div><div class="m">${esc(r.brand)} · ${popularity(id)}% pop · ${starLine(id)} · ${esc(r.card||'')}</div></div>${on?tag('SELECIONADO','face'):active?tag('PUSH ATIVO','face'):tag('Toque para escolher')}</div>
      </button>`;
    };
    const cardT=(id)=>{
      const t=S.teams.find(x=>x.id===id); if(!t)return '';
      const on=(sel.tags||[]).includes(id);
      const active=(ab.tags||[]).includes(id);
      const mems=(t.members||[]).map(nm).join(' · ');
      return `<button type="button" class="card" style="text-align:left;cursor:pointer;border-color:${on||active?'var(--ac)':''}" onclick="togglePushSelect('tags','${id}')">
        <div class="t">👥 ${esc(t.name)}</div>
        <div class="m">${esc(t.brand)} · ${esc(mems)}</div>
        <div style="margin-top:6px">${on?tag('SELECIONADO','face'):active?tag('PUSH ATIVO','face'):tag('Toque para escolher')}</div>
      </button>`;
    };
    const lastPpv=S.shows.find(s=>s.id===pb.lastPpvId);
    return `<div class="card">
      <div class="sh">PUSH PÓS-PPV</div>
      <div class="m">Depois de marcar um PPV como concluído, o sistema sugere 2 homens + 2 mulheres (singles) e 2 tags masculinas + 2 tags femininas. Você escolhe quem recebe o push. O selecionado ganha multiplicador ×1.5 na popularidade até o próximo PPV.</div>
      <div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
        <button class="add" onclick="generatePushSuggestions('');save();draw()">Gerar sugestões agora</button>
        ${(sel.singles||[]).length+(sel.tags||[]).length?`<button class="add" onclick="confirmPushPicks()">Confirmar push selecionado</button>`:''}
      </div>
      ${lastPpv?`<div class="m" style="margin-top:8px">Último PPV que gerou a lista: <b>${esc(lastPpv.name)}</b>${lastPpv.date?' · '+lastPpv.date:''}</div>`:''}
      ${pb.pending?tag('Aguardando sua escolha de push','face'):(ab.singles||[]).length+(ab.tags||[]).length?tag('Push ativo até o próximo PPV','face'):''}
    </div>
    <h2>Singles · Homens (2 sugestões)</h2>
    <div class="g">${(sug.men||[]).map(id=>cardW(id,'singles')).join('')||em('Sem sugestões. Conclua um PPV ou gere manualmente.')}</div>
    <h2>Singles · Mulheres (2 sugestões)</h2>
    <div class="g">${(sug.women||[]).map(id=>cardW(id,'singles')).join('')||em('Sem sugestões.')}</div>
    <h2>Tag Team · Masculino (2 sugestões)</h2>
    <div class="g">${(sug.tagMen||[]).map(cardT).join('')||em('Cadastre tag teams masculinas para sugerir.')}</div>
    <h2>Tag Team · Feminino (2 sugestões)</h2>
    <div class="g">${(sug.tagWomen||[]).map(cardT).join('')||em('Cadastre tag teams femininas para sugerir.')}</div>
    <div class="card"><div class="m">Push ativo agora: singles ${(ab.singles||[]).map(nm).map(esc).join(', ')||'—'} · tags ${(ab.tags||[]).map(id=>{const t=S.teams.find(x=>x.id===id);return t?t.name:id;}).map(esc).join(', ')||'—'}</div></div>`;
  },

  summary() {
    const shows=S.shows.filter(s=>brandsFor(s).includes(B)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const feuds=S.feuds.filter(f=>!f.brand||f.brand===B);
    return `<div class="card"><div class="sh">RESUMO HISTÓRICO · ${B.toUpperCase()}</div><div class="g"><div><b>${shows.length}</b><div class="m">Shows e PPVs</div></div><div><b>${shows.filter(s=>s.completed).length}</b><div class="m">Concluídos</div></div><div><b>${feuds.length}</b><div class="m">Rivalidades</div></div></div></div><div class="card"><div class="sh">RIVALIDADES</div>${feuds.length?feuds.map(f=>`<div class="rw"><div><span class="t">${feudLabel(f)}</span><div class="m">${esc(f.goal||f.story||f.notes||'Sem resumo registrado')} · ${kindTag(f.kind||'lutador')}</div></div><span class="sp"></span>${tag(f.status||'Ativa')}</div>`).join(''):em('Sem rivalidades registradas.')}</div><div class="card"><div class="sh">RESULTADOS DE SHOWS E PPVS</div>${shows.length?shows.map(s=>`<div class="card"><div class="row"><div><span class="t">${esc(s.name)}</span><div class="m">${esc(s.date||'Data não definida')} · ${brandsFor(s).join(' / ')}</div></div><span class="sp"></span>${tag(s.completed?'Concluído':'Em booking',s.completed?'face':'')}</div>${(s.matches||[]).length?(s.matches||[]).map((m,i)=>`<div class="rw"><div><span>${i+1}. ${esc(m.matchType||'Luta')} · ${esc(matchLine(m))}</span><div class="m">Resultado: ${esc(m.result||'Não registrado')}${m.title?' · '+esc(m.title):''}</div></div></div>`).join(''):em('Card ainda não montado.')}</div>`).join(''):em('Nenhum evento no histórico.')}</div>`;
  },

  year() {
    return MS.map((m,i) => {
      const y = S.year[i+'-'+B] || {};
      const events=S.shows.filter(s=>s.date&&Number(s.date.slice(5,7))===i+1&&brandsFor(s).includes(B)); return dt('y'+i, `<span class="t">${m}</span><span class="m"> · ${events.length} eventos</span>`,
        (events.length?`<div class="m" style="margin-bottom:10px">EVENTOS: ${events.map(s=>esc(s.name)).join(' · ')}</div>`:'') + [['e','Principais acontecimentos'],['t','Mudanças de título / campeões'],['n','Notas / impacto na história']]
          .map(([f,p]) => `<textarea rows="2" placeholder="${p}" onchange="sy('${i}-${B}','${f}',this.value)">${esc(y[f])}</textarea>`).join(''));
    }).join('');
  },

  bk() {
    return `<div class="card">
      <div class="t">Backup do Universe</div>
      <div class="m" style="margin:6px 0 12px">SIM, salva automaticamente neste navegador (localStorage). Não some ao fechar a aba. Cuidado: limpar dados do site, outro navegador ou modo anônimo apaga tudo. Faça backup JSON com frequência. Copie abaixo ou baixe o arquivo; para restaurar, cole e toque em Importar.</div>
      <textarea id="bk" rows="9">${esc(JSON.stringify(S))}</textarea>
      <div class="row" style="margin-top:10px"><button class="add" onclick="exportJSON()">Baixar backup (.json)</button><button class="add" onclick="imp()">Importar backup (texto colado)</button><button class="add" onclick="pickImport()">Importar arquivo (.json)</button><input id="impf" type="file" accept="*/*" style="display:none" onchange="impFile(this)"><span class="m" id="msg"></span></div>
    </div>`;
  }
};

function draw() {
  const y=window.scrollY;
  const theme = tab==='globalRoster' ? 'Global' : B;
  document.documentElement.dataset.b = theme;
  if(B==='Free Agency'&&!['freeAgency','globalRoster','landing','bk'].includes(tab))tab='freeAgency';
  // Título do header: Universe Desk na home; nome da brand quando selecionada; Roster Global / Free Agency
  const h1 = document.querySelector('header.masthead h1');
  const sub = document.querySelector('header.masthead .sub');
  if(h1){
    if(tab==='landing'){ h1.innerHTML='UNIVERSE <span>DESK</span>'; if(sub)sub.textContent='Seu universo. Seu booking. Sua história.'; }
    else if(tab==='globalRoster'){ h1.innerHTML='ROSTER <span>GLOBAL</span>'; if(sub)sub.textContent='Visão completa de todos os personagens'; }
    else if(B==='Free Agency'){ h1.innerHTML='FREE <span>AGENCY</span>'; if(sub)sub.textContent='Agentes livres e contratos'; }
    else { h1.innerHTML=B.toUpperCase()+' <span>DESK</span>'; if(sub)sub.textContent='Brand ativa · booking em andamento'; }
  }
  const brandTabs=B==='Free Agency'?[]:TABS.filter(([k])=>['roster','titles','feuds','shows','teams','push','summary','year'].includes(k)||(k==='downgrade'&&B!=='NXT')||(k==='nxtcut'&&B==='NXT'));
  $('top').innerHTML=`<nav class="home-nav"><button class="${tab==='landing'?'on':''}" onclick="go('landing')">HOME</button><div class="brands">${BRS.filter(b=>b!=='Free Agency').map(b=>`<button style="--c:${COL[b]}" class="${b===B&&tab!=='landing'&&tab!=='globalRoster'?'on':''}" onclick="sb('${b}')">${b}</button>`).join('')}</div><span class="nav-divider" aria-hidden="true"></span><button style="--c:${COL['Free Agency']}" class="nav-wide ${B==='Free Agency'&&tab!=='globalRoster'?'on':''}" onclick="sb('Free Agency')">FREE AGENCY</button><button style="--c:#20c9b0" class="nav-wide ${tab==='globalRoster'?'on':''}" onclick="go('globalRoster')">ROSTER GLOBAL</button><button style="--c:#f4c95d" class="nav-wide ${tab==='bk'?'on':''}" onclick="go('bk')">💾 BACKUP</button></nav>${tab==='all'?`<div class="brand-home-label" style="--c:${COL[B]}">${B.toUpperCase()} · HOME DA BRAND</div><nav class="brand-menu">${brandTabs.map(([k,l])=>`<button class="brand-menu-btn ${tab===k?'on':''}" onclick="go('${k}')">${l}<span>ABRIR →</span></button>`).join('')}</nav>`:''}`;
  const back=c=>(B!=='Free Agency'&&['roster','titles','feuds','shows','teams','push','summary','year','downgrade','nxtcut'].includes(tab))?`<button class="back-btn ${c}" style="--c:${COL[B]}" onclick="go('all')">← Voltar à Home da ${B}</button>`:'';
  $('app').innerHTML=back('')+V[tab]()+back('bottom');
  window.scrollTo(0,y);
}

draw();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>

<style>
/* v10: alinhamento da Home e do cabeçalho */
.brand-lockup .brand-mark{display:flex;align-items:center;justify-content:center;letter-spacing:-2px;line-height:1;overflow:hidden}
.brand-lockup .brand-mark span{opacity:.75}
.tile-name{display:block;font-size:clamp(18px,2.2vw,26px);font-weight:900;letter-spacing:.08em;line-height:1.15;color:var(--c);text-transform:uppercase;overflow-wrap:break-word}
.free-tile .tile-name,.roster-tile .tile-name{font-size:clamp(15px,1.55vw,19px);letter-spacing:.06em}
.home-nav{width:100%;max-width:1120px;margin:0 auto!important}
.home-nav .brands{margin:0!important;max-width:none}
.brand-picker{grid-template-columns:repeat(12,minmax(0,1fr))!important;align-items:stretch}
.brand-picker>.brand-tile{grid-column:span 4}
.brand-picker>.free-tile,.brand-picker>.roster-tile{grid-column:span 3}
.brand-tile small{line-height:1.3}
@media(max-width:900px){.brand-picker{grid-template-columns:repeat(6,minmax(0,1fr))!important}.brand-picker>.brand-tile{grid-column:span 2}.brand-picker>.free-tile,.brand-picker>.roster-tile{grid-column:span 3}}
@media(max-width:700px){.home-nav{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px!important;padding:10px 12px 12px}.home-nav .brands{display:contents!important}.home-nav .nav-divider{display:none}.home-nav>button,.home-nav .brands>button{width:100%;padding:9px 4px!important;font-size:10px!important;justify-content:center;text-align:center}.home-nav .nav-wide{grid-column:span 2}}
@media(max-width:420px){.home-nav>button,.home-nav .brands>button{letter-spacing:.2px!important;font-size:9.5px!important}.home-nav .brands>button::before{display:none}}
@media(max-width:560px){.brand-picker{grid-template-columns:1fr!important}.brand-picker>.brand-tile,.brand-picker>.free-tile,.brand-picker>.roster-tile{grid-column:auto;min-height:0!important}}
</style>
<style>
/* v11: submenu de filtros e botão voltar */
.back-btn{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 14px;padding:12px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 55%,var(--bd));background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--tx);font-weight:800;font-size:13px;letter-spacing:.04em;cursor:pointer;text-align:left}
.back-btn.bottom{margin:18px 0 0}
.filter-menu{position:static;z-index:1;margin-top:18px;padding:12px;border:1px solid color-mix(in srgb,var(--c) 55%,var(--bd));border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--card));display:grid;gap:8px;box-shadow:none}
.fm-row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.fm-l{flex:none;min-width:64px;font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--c)}
.fm-chip{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:12px;font-weight:700;cursor:pointer}
.fm-chip.on{background:var(--c);border-color:var(--c);color:#fff;text-shadow:0 1px 2px #0006}

/* Fotos de lutadores */
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--bd);background:#1a1a22;flex-shrink:0}
.av-lg{width:120px;height:120px;border-radius:14px;object-fit:cover;border:2px solid var(--bd);background:#1a1a22;display:block}
.av-ph{display:grid;place-items:center;font-weight:900;font-size:14px;color:var(--mu);background:linear-gradient(145deg,#1a1e28,#12151c)}
.av-ph.av-lg{font-size:36px;letter-spacing:-1px}
.photo-box{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.photo-box .fl{flex:1;min-width:180px}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photo-actions label.add{display:inline-flex;align-items:center;cursor:pointer;margin:0}
.photo-actions input[type=file]{display:none}

.champ-photo{width:88px;height:88px;border-radius:12px;object-fit:cover;border:2px solid var(--ac);background:#1a1a22;display:block;box-shadow:0 6px 18px color-mix(in srgb,var(--ac) 25%,transparent)}
.champ-photo.av-ph{font-size:28px;display:grid;place-items:center}
.champ-row{display:flex;gap:14px;align-items:center;margin:8px 0 12px}
.rank-av{width:28px;height:28px;border-radius:6px;object-fit:cover;border:1px solid var(--bd);flex-shrink:0;background:#1a1a22}
.rank-av.av-ph{font-size:11px;display:grid;place-items:center;border-radius:6px}
.wsel{position:relative;width:100%}
.wsel-btn{width:100%;display:flex;align-items:center;gap:8px;background:var(--in);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;color:var(--tx);font:inherit;cursor:pointer;text-align:left;min-height:44px}
.wsel-btn .av{width:28px;height:28px}
.wsel-menu{display:none;position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:240px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 12px 28px #000a}
.wsel.open .wsel-menu{display:block}
.wsel-item{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:transparent;color:var(--tx);font:inherit;cursor:pointer;text-align:left}
.wsel-item:hover,.wsel-item.on{background:color-mix(in srgb,var(--ac) 14%,transparent)}
.wsel-item .av{width:28px;height:28px}
.av-sq{border-radius:8px!important}
</style>
