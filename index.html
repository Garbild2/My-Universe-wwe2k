function parseBackup(txt) {
  txt = String(txt == null ? '' : txt).replace(/^\uFEFF/, '').trim();
  let o = JSON.parse(txt);
  if (typeof o === 'string') o = JSON.parse(o); // JSON duplamente serializado
  // aceita formatos embrulhados: {S:{...}}, {data:{...}}, {state:{...}}
  for (const k of ['S','data','state','universe','backup']) if (o && !o.titles && !o.roster && o[k] && typeof o[k] === 'object') { o = o[k]; break; }
  if (!o || typeof o !== 'object' || Array.isArray(o)) throw new Error('o arquivo não é um backup do Universe Desk');
  if (!o.titles && !o.roster) throw new Error('não encontrei "titles" nem "roster" no arquivo');
  if (!Array.isArray(o.titles)) o.titles = seed().titles;
  if (!Array.isArray(o.roster)) o.roster = [];
  return o;
}
function showMsg(t) { const m = $('msg'); if (m) m.textContent = t; }
function imp(txt) {
  let o;
  try { o = parseBackup(txt !== undefined && typeof txt === 'string' ? txt : $('bk').value); }
  catch (e) { showMsg('JSON inválido: ' + (e && e.message || e)); return; }
  let n;
  try { n = mig(o); } catch (e) { console.error(e); showMsg('Erro ao importar: ' + (e && e.message || e)); return; }
  const cnt = x => (x && x.wrestlers && x.wrestlers.length) || 0;
  const msg = 'ATENÇÃO: importar vai SUBSTITUIR todos os dados atuais.\n\nAtual: ' + cnt(S) + ' lutadores\nBackup: ' + cnt(n) + ' lutadores\n\nUma cópia de segurança dos dados atuais será guardada (aba Backup > cópias automáticas).\n\nContinuar?';
  if (!window.confirm(msg)) { showMsg('Importação cancelada.'); return; }
  takeSnap('import').then(() => {
    S = n; save(); draw();
    showMsg('Importado com sucesso!');
  }).catch(e => { console.error(e); showMsg('Erro ao importar: ' + (e && e.message || e)); });
}

/* ===== Cópias automáticas locais (IndexedDB) ===== */
const SNAP_DB = 'universedesk_bk', SNAP_ST = 'snaps', SNAP_AUTO = 3, SNAP_OTHER = 2;
function snapDB() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open(SNAP_DB + (SESSION ? '_' + SESSION.user.id : ''), 1);
      r.onupgradeneeded = () => r.result.createObjectStore(SNAP_ST, { keyPath: 'ts' });
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function snapAll() {
  const db = await snapDB();
  return new Promise((res, rej) => { const q = db.transaction(SNAP_ST).objectStore(SNAP_ST).getAll(); q.onsuccess = () => res((q.result || []).sort((a, b) => b.ts - a.ts)); q.onerror = () => rej(q.error); });
}
async function pruneSnaps() {
  const all = await snapAll(), db = await snapDB();
  const drop = [...all.filter(x => x.kind === 'auto').slice(SNAP_AUTO), ...all.filter(x => x.kind !== 'auto').slice(SNAP_OTHER)];
  if (!drop.length) return;
  await new Promise(res => { const tx = db.transaction(SNAP_ST, 'readwrite'); drop.forEach(x => tx.objectStore(SNAP_ST).delete(x.ts)); tx.oncomplete = res; tx.onerror = res; });
}
async function takeSnap(kind) {
  try {
    const data = JSON.stringify(S), db = await snapDB(), ts = Date.now();
    await new Promise((res, rej) => { const tx = db.transaction(SNAP_ST, 'readwrite'); tx.objectStore(SNAP_ST).put({ ts, kind, data, n: (S.wrestlers || []).length }); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    await pruneSnaps();
  } catch (e) { console.warn('snapshot falhou', e); }
}
let _snapBusy = false;
async function autoSnap() {
  if (_snapBusy) return;
  try {
    const last = +localStorage.getItem('universedesk_lastsnap' + (SESSION ? SESSION.user.id : '')) || 0;
    if (Date.now() - last < 30 * 60 * 1000) return;
    _snapBusy = true;
    const all = await snapAll(), cur = JSON.stringify(S);
    const la = all.find(x => x.kind === 'auto');
    if (!la || la.data !== cur) await takeSnap('auto');
    localStorage.setItem('universedesk_lastsnap' + (SESSION ? SESSION.user.id : ''), String(Date.now()));
  } catch (e) {} finally { _snapBusy = false; }
}
function fmtSnap(ts) { const d = new Date(ts); return fmtBR(dstr(d)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
async function renderSnapList() {
  const el = $('snapList'); if (!el) return;

  } catch (e) { el.innerHTML = '<span class="m">Cópias automáticas indisponíveis neste navegador.</span>'; }
}
async function restoreSnap(ts) {
  try {
    const all = await snapAll(), x = all.find(z => z.ts === ts);
    if (!x) { showMsg('Cópia não encontrada.'); return; }
    if (!window.confirm('Restaurar a cópia de ' + fmtSnap(x.ts) + ' (' + x.n + ' lutadores)?\nOs dados atuais serão substituídos (uma cópia deles será guardada antes).')) return;
    const n = mig(JSON.parse(x.data));
    await takeSnap('restore');
    S = n; save(); draw(); showMsg('Cópia restaurada.');

    (l.length?`<div class="row" style="gap:8px;margin:4px 0 8px"><button class="add" onclick="minAllShows(true)">▾ Minimizar todos</button><button class="add" onclick="minAllShows(false)">▸ Expandir todos</button></div>`+l.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(s=>`<div class="card" id="show-${s.id}"><div class="row"><div><div class="t">${esc(s.name)}</div><div class="m">${s.type}${s.date?' · '+fmtBR(s.date)+' ('+dow(s.date)+')':' · sem data'} · ${brandsFor(s).join(' / ')}</div></div><span class="sp"></span><input type="date" value="${s.date||''}" title="Alterar a data deste show" onchange="st('shows','${s.id}','date',this.value,1)" style="max-width:150px">${tag(s.completed?'Concluído':'Em booking',s.completed?'face':'')}${s.completed&&showAvg(s)?tag('Média do show: '+starAvgTxt(showAvg(s).avg)+' ('+showAvg(s).n+(showAvg(s).n===1?' luta':' lutas')+')','face'):''}<button class="add" type="button" onclick="toggleMinShow('${s.id}')" style="padding:6px 10px">${MINS.has(s.id)?'▸ Expandir':'▾ Minimizar'}</button><button class="x" onclick="del('shows','${s.id}')">✕</button></div>

  nxtcut() {
    const st=nxtState();
    const pool=S.roster.filter(r=>r.role==='Lutador'&&r.brand==='NXT'&&r.status!=='Lesionado');
    const w=worstByDivision(pool,2);
    const kept=st.rv.kept||[];
    const card=(c)=>`<div class="card" style="margin-top:8px"><div class="row">${avHtml(c.r,false)}<div style="flex:1;min-width:0"><div class="t">${esc(c.r.name)}</div><div class="m">${perfReason(c)}</div></div><button class="add" onclick="moveBrand('${c.r.id}','Free Agency','cut')">Demitir</button><button class="add" onclick="keepNxt('${c.r.id}')">Manter</button></div></div>`;
    const sec=(d,lbl)=>{const l=w[d].filter(c=>!kept.includes(c.r.id));return `<div class="card"><div class="sh">${lbl}</div>${l.length?l.map(card).join(''):em('Nenhuma sugestão pendente.')}</div>`;};

/* ===== v6.1: Calendário por brand + Busca no formato do concept ===== */
const DABR=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'],MABR=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const CAL={ym:'',wk:'',view:'Mês',ed:'',form:false,fd:'',day:''};
function calYM(){return CAL.ym||(CAL.ym=universeDate().slice(0,7));}
function calNav(d){const [y,m]=calYM().split('-').map(Number);const x=new Date(y,m-1+d,1);CAL.ym=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');CAL.day='';draw();}
function calWkStart(){const x=new Date((CAL.wk||universeDate())+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return dstr(x);}
function calWkNav(d){CAL.wk=addDays(calWkStart(),7*d);draw();}
function calView(v){CAL.view=v;CAL.ed='';draw();}
function calEd(id){CAL.ed=CAL.ed===id?'':id;draw();}
function calDay(d){CAL.day=CAL.day===d?'':d;draw();}
function calNew(d){CAL.form=true;CAL.fd=d||'';draw();setTimeout(()=>{const e=document.getElementById('calform');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});},50);}
function calSet(id,k,v){const sh=S.shows.find(x=>x.id===id);if(!sh)return;sh[k]=v;save();draw();}
function calDel(id){if(!confirm('Remover este evento do calendário? (as lutas dele também serão apagadas)'))return;S.shows=S.shows.filter(x=>x.id!==id);CAL.ed='';save();draw();}
function calEvents(){return S.shows.filter(x=>x.date&&!x.archived&&brandsFor(x).includes(B)).sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name));}
function calRow(x){
  const bs=brandsFor(x),d=new Date(x.date+'T12:00:00');
  const ed=CAL.ed===x.id?`<div class="caled"><label>Data<input type="date" value="${esc(x.date||'')}" onchange="calSet('${x.id}','date',this.value)"></label><label>Nome<input value="${esc(x.name)}" onchange="calSet('${x.id}','name',this.value)"></label><label>Local<input value="${esc(x.place||'')}" placeholder="Ex.: Orlando, FL" onchange="calSet('${x.id}','place',this.value)"></label><button class="x" onclick="calDel('${x.id}')">🗑 Remover</button></div>`:'';
  return `<div class="calr ${x.type==='PPV'?'ppv':''}" style="--c:${HBC[bs[0]]||'#e11d2e'}"><div class="calb">${bs.length>1?bs.map(b=>wordmark(b,1)).join(''):wordmark(bs[0])}</div><div class="cald"><small>${DABR[d.getDay()]}</small><b>${String(d.getDate()).padStart(2,'0')}</b><small>${MABR[d.getMonth()]}</small></div><div class="calm"><div class="hrt">${esc(x.name)}</div><div class="m">📍 ${esc(x.place||'Local não definido')}${x.type==='PPV'?' · PPV':''}${x.completed?' · ✔ Concluído':''} · ${(x.matches||[]).length} lutas</div></div><button class="calgo" onclick="openShow('${x.id}')">DETALHES</button><button class="calpen" title="Editar data e local" onclick="calEd('${x.id}')">✎</button></div>${ed}`;
}
function calForm(){
  const d=CAL.fd||universeDate();
  return `<div class="card" id="calform"><div class="sh">＋ AGENDAR EVENTO</div><div class="calfg"><label>Tipo<select id="cft" onchange="calFT()"><option>Show semanal</option><option>PPV</option></select></label><label>Nome<input id="cfn" placeholder="${esc(B)} / nome do PPV"></label><label>Data<input type="date" id="cfd" value="${esc(d)}"></label><label>Local<input id="cfp" placeholder="Ex.: Orlando, FL"></label></div><div id="cfb" class="row" style="gap:12px;display:none;margin-top:8px"><span class="m">Brands do PPV:</span>${['Raw','SmackDown','NXT'].map(b=>`<label class="row" style="gap:4px"><input type="checkbox" name="cfbr" value="${b}" ${b===B?'checked':''}> ${b}</label>`).join('')}</div><div class="row" style="gap:8px;margin-top:10px"><button class="btn-gold sm" onclick="calAdd()">AGENDAR</button><button class="add" onclick="CAL.form=false;draw()">Cancelar</button></div></div>`;
}
function calFT(){const t=$('cft').value;$('cfb').style.display=t==='PPV'?'flex':'none';}
function calAdd(){
  const type=$('cft').value,date=$('cfd').value;let name=$('cfn').value.trim();const place=$('cfp').value.trim();
  if(!date){alert('Escolha a data.');return;}

function calendarHtml(){
  const ev=calEvents(),ud=universeDate(),view=CAL.view;
  const tabs=['Mês','Semana','Lista'].map(v=>`<button class="${view===v?'on':''}" onclick="calView('${v}')">${v}</button>`).join('');
  let body='';
  if(view==='Mês'){
    const ym=calYM(),[y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1),off=(first.getDay()+6)%7,dim=new Date(y,m,0).getDate();
    const inM=ev.filter(x=>x.date.slice(0,7)===ym),byD={};inM.forEach(x=>(byD[x.date]=byD[x.date]||[]).push(x));
    let cells=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'].map(h=>`<div class="cgh">${h}</div>`).join('');
    for(let i=0;i<off;i++)cells+='<div class="cgc empty"></div>';
    for(let d=1;d<=dim;d++){const ds=ym+'-'+String(d).padStart(2,'0'),l=byD[ds]||[];cells+=`<div class="cgc ${l.length?'has':''} ${ds===ud?'today':''} ${CAL.day===ds?'sel':''}" ${l.length?`onclick="calDay('${ds}')"`:`onclick="calNew('${ds}')" title="Agendar neste dia"`}><span>${d}</span><div class="cgd">${l.slice(0,3).map(x=>`<i style="background:${x.type==='PPV'?'#f2c230':(HBC[brandsFor(x)[0]]||'#888')}"></i>`).join('')}</div></div>`;}
    const shown=CAL.day?inM.filter(x=>x.date===CAL.day):inM;
    body=`<div class="calnav"><button onclick="calNav(-1)">‹</button><b>${MESES[m-1].toUpperCase()} ${y}</b><button onclick="calNav(1)">›</button></div><div class="cgrid">${cells}</div>${CAL.day?`<div class="m" style="margin:8px 0">Mostrando ${esc(fmtBR(CAL.day))} · <a class="lk" onclick="calDay('${CAL.day}')">ver o mês inteiro</a></div>`:''}<div class="callist">${shown.length?shown.map(calRow).join(''):em('Nenhum evento neste mês. Use "＋ Agendar evento".')}</div>`;
  }else if(view==='Semana'){
    const st=calWkStart(),days=Array.from({length:7},(_,i)=>addDays(st,i));
    body=`<div class="calnav"><button onclick="calWkNav(-1)">‹</button><b>${esc(fmtBR(days[0]).slice(0,5))} – ${esc(fmtBR(days[6]))}</b><button onclick="calWkNav(1)">›</button></div><div class="callist">`+days.map(d=>{const l=ev.filter(x=>x.date===d),dd=new Date(d+'T12:00:00');return `<div class="calwd ${d===ud?'today':''}"><div class="calwh"><b>${WDAY[dd.getDay()]}</b> <span class="m">${esc(fmtBR(d).slice(0,5))}</span><span class="sp"></span><button class="add" onclick="calNew('${d}')">＋</button></div>${l.length?l.map(calRow).join(''):'<div class="m" style="padding:4px 2px">Sem eventos</div>'}</div>`;}).join('')+`</div>`;
  }else{
    const up=ev.filter(x=>x.date>=ud),past=ev.filter(x=>x.date<ud).slice(-5).reverse();
    body=`<div class="hsh">PRÓXIMOS</div><div class="callist">${up.length?up.slice(0,40).map(calRow).join(''):em('Nenhum evento futuro agendado.')}</div>${past.length?`<div class="hsh" style="margin-top:16px">ANTERIORES</div><div class="callist">${past.map(calRow).join('')}</div>`:''}`;
  }
  const big=ev.filter(x=>x.type==='PPV'&&x.date>=ud&&!x.completed)[0];
  const bigH=big?`<div class="calbig" style="--c:${HBC[brandsFor(big)[0]]||'#f2c230'}"><div><div class="calbt">🏆 PRÓXIMO GRANDE EVENTO</div><div class="calbn">${esc(big.name)}</div><div class="m">${esc(wdayLabel(big.date))} · ${esc(big.place||'Local não definido')}</div></div><button class="calgo big" onclick="openShow('${big.id}')">DETALHES</button></div>`:'';
  return `<section class="bhd"><div><h2 class="sech">🗓 CALENDÁRIO</h2><div class="m">Acompanhe os próximos shows e eventos da sua empresa!</div></div><div class="shr">${wordmark(B)}<div class="htabs sect" style="margin:0">${tabs}</div></div></section>${body}${bigH}<div style="margin:14px 0"><button class="btn-gold sm" onclick="calNew('')">＋ AGENDAR EVENTO</button></div>${CAL.form?calForm():''}`;
}

function ensurePB(){const pb=S.pushBoard=S.pushBoard||{suggestions:{men:[],women:[],tagMen:[],tagWomen:[]},selected:{singles:[],tags:[]},activeBonus:{singles:[],tags:[]},lastPpvId:'',pending:false};pb.selected=pb.selected||{singles:[],tags:[]};pb.selected.singles=pb.selected.singles||[];pb.activeBonus=pb.activeBonus||{singles:[],tags:[]};return pb;}
function momentumOf(id){
  const sh=S.shows.filter(x=>x.completed).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),res=[];
  for(const x of sh){for(const m of (x.matches||[]).slice().reverse()){if(m.matchType==='Promo'||!(m.participants||[]).includes(id))continue;const o=(m.outcomes||{})[id];if(o==='Vitoria'||o==='Derrota')res.push({w:o==='Vitoria',st:typeof m.stars==='number'?m.stars:null});if(res.length>=5)break;}if(res.length>=5)break;}
  if(!res.length)return {v:null,t:0};
  const w=res.filter(x=>x.w).length,l=res.length-w,sts=res.filter(x=>x.st!=null).map(x=>x.st),av=sts.length?sts.reduce((a,b)=>a+b,0)/sts.length:3;
  return {v:Math.max(5,Math.min(99,Math.round(50+(w-l)*10+(av-3)*8))),t:w>l?1:w<l?-1:0};
}
/* push da semana: por brand, vale só para o próximo show semanal, rotativo */
function nextWeeklyShow(b){return S.shows.filter(x=>x.type==='Show semanal'&&brandsFor(x).includes(b)&&!x.completed&&!x.archived&&x.date).sort((x,y)=>x.date.localeCompare(y.date))[0]||null;}
function wpState(b){S.weeklyPush=S.weeklyPush||{};const sh=nextWeeklyShow(b),key=sh?sh.id:'none';let w=S.weeklyPush[b];
  if(!w)w=S.weeklyPush[b]={key,singles:[],tags:[],prev:[],prevTags:[]};
  if(w.key!==key){w.prev=(w.singles||[]).slice();w.prevTags=(w.tags||[]).slice();w.key=key;w.singles=[];w.tags=[];}
  w.singles=w.singles||[];w.tags=w.tags||[];w.prev=w.prev||[];w.prevTags=w.prevTags||[];return w;}
function weeklyPushIds(sh){const out=new Set();if(!sh||sh.completed)return out;brandsFor(sh).forEach(b=>{const w=(S.weeklyPush||{})[b];if(w&&w.key===sh.id){(w.singles||[]).forEach(i=>out.add(i));(w.tags||[]).forEach(t=>{const tm=S.teams.find(x=>x.id===t);if(tm)(tm.members||[]).forEach(i=>out.add(i));});}});return out;}
function teamDivOf(t){const ms=(t.members||[]).map(person).filter(Boolean);return ms.length&&ms.every(m=>m.division==='Feminino')?'F':'M';}
function wpMark(id){const w=wpState(B),r=person(id);const sh=nextWeeklyShow(B);S.wpLast=S.wpLast||{};S.wpLast[id]=(sh&&sh.date)||universeDate();}
function pushToggle(id){const w=wpState(B),i=w.singles.indexOf(id);
  if(i>=0)w.singles.splice(i,1);else{if(w.singles.length>=4){alert('Máximo de 4 lutadores no push da semana.');return;}w.singles.push(id);wpMark(id);}
  save();draw();}
function pushToggleTag(id){const w=wpState(B),i=w.tags.indexOf(id);
  if(i>=0){w.tags.splice(i,1);save();draw();return;}
  const t=S.teams.find(x=>x.id===id);if(!t)return;const d=teamDivOf(t);
  if(w.tags.some(x=>{const o=S.teams.find(z=>z.id===x);return o&&teamDivOf(o)===d;})){alert(d==='F'?'Já há uma tag feminina no push da semana.':'Já há uma tag masculina no push da semana.');return;}
  w.tags.push(id);S.wpLast=S.wpLast||{};S.wpLast[id]=universeDate();save();draw();}
function pushClearWeek(){const w=wpState(B);w.singles=[];w.tags=[];save();draw();}
function wpRank(list,key){S.wpLast=S.wpLast||{};return list.slice().sort((a,b)=>((S.wpLast[a.id]||'')).localeCompare(S.wpLast[b.id]||'')||hashN(a.id+key)-hashN(b.id+key));}

  const tRows=tms.length?tms.map(t=>{const on=w.tags.includes(t.id),d=teamDivOf(t);return `<div class="pshr tg ${on?'on':''}"><div class="psh1">${(t.members||[]).slice(0,2).map(id=>himg(person(id),'hav sm')).join('')}</div><div class="pshn"><div class="hrt">${esc(t.name)}</div><span class="m">Tag ${d==='F'?'feminina':'masculina'}</span>${w.prevTags.includes(t.id)?'<span class="m" style="margin-left:6px">(semana passada)</span>':''}</div><div></div><button class="ptg ${on?'on':''}" onclick="pushToggleTag('${t.id}')"><i></i><span>Push?</span></button><span></span></div>`;}).join(''):em('Nenhuma tag team nesta brand.');
  const elig=ros.filter(r=>!w.singles.includes(r.id)&&!w.prev.includes(r.id));

  const nM=w.tags.filter(x=>{const o=S.teams.find(z=>z.id===x);return o&&teamDivOf(o)==='M';}).length,nF=w.tags.length-nM;
  return `<section class="bhd"><div><h2 class="sech">📈 PUSH DA SEMANA · ${esc(B.toUpperCase())}</h2><div class="m">${sh?`Vale só para <b>${esc(sh.name)}</b> (${esc(wdayLabel(sh.date))}). A cada semana a lista zera e rotaciona.`:'Nenhum show semanal agendado para esta brand — agende um no Calendário para o push valer para ele.'}</div></div><div class="shr">${wordmark(B)}</div></section>
  <div class="pgrid"><div class="hp"><div class="hph">SEU ROSTER · ${esc(B.toUpperCase())}<span class="sp"></span><span class="m" style="font-weight:600">Lutadores: ${w.singles.length}/4 · Tag M: ${nM}/1 · Tag F: ${nF}/1</span></div><div class="hpb pscroll">${rows}<div class="hsh" style="margin:12px 0 8px">TAG TEAMS</div>${tRows}</div><div class="hpf" style="text-align:left;display:flex;gap:8px;justify-content:space-between;align-items:center"><span class="m">Até 4 lutadores + 1 tag masculina + 1 tag feminina.</span>${w.singles.length||w.tags.length?`<button class="add" onclick="pushClearWeek()">Limpar semana</button>`:''}</div></div>
  <div class="hp"><div class="hph">⭐ RECOMENDAÇÕES DA SEMANA</div><div class="hpb"><div class="m" style="margin-bottom:8px">Rodízio simples: quem está há mais tempo sem push (ou nunca teve) aparece primeiro. Quem recebeu push na semana passada fica de fora.</div>${recH||em('Sem recomendações — todos já estão selecionados ou receberam push na semana passada.')}</div></div></div>
  ${secManage('PUSH PÓS-PPV · VALE ATÉ O PRÓXIMO PPV (ÍNDICE ×1.5)')}`;
}

/* recomendações: banco do app + modelos importados/escritos pelo usuário + próximos passos das suas histórias */
let SLR=[];
function slRecs(){
  const ud=universeDate(),seed=ud.slice(0,7)+Math.ceil(+ud.slice(8,10)/7),en=LANG==='en';
  const ros=S.roster.filter(r=>r.role==='Lutador'&&r.status!=='Lesionado'&&r.brand&&r.brand!=='Free Agency');
  const used=new Set();S.feuds.filter(f=>!feudEnded(f)).forEach(f=>used.add(feudIds(f).slice().sort().join('|')));
  slList().forEach(x=>{if(x.status!=='Concluída'&&x.ids.length>=2)used.add(x.ids.slice(0,2).sort().join('|'));});
  const tpl=[];STORY_BANK.forEach((x,i)=>tpl.push({src:'app',c:x.c,text:en?x.en:x.pt,k:'b'+i}));
  (S.stories||[]).filter(x=>x.on!==false).forEach(x=>tpl.push({src:'mine',c:x.align==='Face'?'face':x.align==='Heel'?'heel':x.align==='Tweener'?'tween':'any',text:x.text,brand:x.brand,k:'m'+x.id}));
  const al=r=>r.alignment||'Tweener';
  const out=[];const seen=new Set();
  tpl.sort((a,b)=>(a.src==='mine'?0:1)-(b.src==='mine'?0:1)||hashN(seed+a.k)-hashN(seed+b.k)).forEach(t=>{
    if(out.length>=16)return;
    const needT=/\{T\}/i.test(t.text),pool=ros.filter(r=>!t.brand||t.brand==='Todas'||r.brand===t.brand);
    let cands=[];
    pool.slice().sort((a,b)=>hashN(seed+t.k+a.id)-hashN(seed+t.k+b.id)).forEach(A=>{
      if(cands.length)return;
      const want=t.c==='face'?al(A)==='Face':t.c==='heel'?al(A)==='Heel':t.c==='tween'?al(A)==='Tweener':true;if(!want)return;
      const Bs=pool.filter(B=>B.id!==A.id&&B.brand===A.brand&&B.division===A.division&&(t.c==='face'?al(B)==='Heel':t.c==='heel'?al(B)==='Face':true)).sort((a,b)=>hashN(seed+t.k+A.id+a.id)-hashN(seed+t.k+A.id+b.id));
      for(const B of Bs){const sig=[A.id,B.id].sort().join('|');if(used.has(sig)||seen.has(sig))continue;
        let T=null;if(needT){T=S.titles.find(z=>z.brand===A.brand&&(z.champ===B.id||z.champ===A.id));if(!T)continue;}
        cands=[{A,B,T,sig}];break;}
    });
    if(!cands.length)return;const {A,B,T,sig}=cands[0];seen.add(sig);
    out.push({src:t.src,A,B,brand:A.brand,title:A.name+' vs '+B.name,text:fillStory(t.text,A.name,B.name,T?T.name:(en?'title':'título')),kind:'new'});
  });
  /* alterna fontes: app e modelos do usuário */
  const mine=out.filter(x=>x.src==='mine'),app=out.filter(x=>x.src==='app'),mix=[];
  while(mine.length||app.length){if(mine.length)mix.push(mine.shift());if(app.length)mix.push(app.shift());}
  /* próximos passos das rivalidades e histórias em andamento */
  const next=slItems('').filter(i=>!i.ended&&i.pr<100).sort((x,y)=>(y.t==='riv'?(y.o.hasTitle?30:0):0)-(x.t==='riv'?(x.o.hasTitle?30:0):0)).map(i=>{const nx=STEPS.find(([k])=>!i.steps[k]);return nx?{kind:'next',src:'next',it:i,step:nx,brand:i.brand,title:i.title,text:'Próximo passo: '+nx[1]}:null;}).filter(Boolean);
  return next.slice(0,3).concat(mix);
}

function slRecCard(rc,i){
  const src=rc.kind==='next'?'<span class="hbd gr">PRÓXIMO PASSO</span>':rc.src==='mine'?'<span class="hbd pu">MINHA</span>':'<span class="hbd bl">APP</span>';

  return `<div class="slrec">${wordmark(rc.brand==='Multi-Brand'?'Raw':rc.brand,1)}<div style="flex:1;min-width:0"><div class="hrt">${rc.kind==='next'?rc.it.titleH:esc(rc.title)} ${src}</div><div class="m clamp2">${esc(rc.text)}</div></div><button class="calgo" onclick="${act}">${rc.kind==='next'?'MARCAR':'ADICIONAR'}</button></div>`;

/* v6.6: banner no estilo do concept (logo no topo + quadro por tipo de luta) */
function slFrameInfo(x){
  const o=x.o;let gs;
  if(x.t==='riv')gs=feudGroups(o).filter(g=>g.length);else gs=x.ids.length?[x.ids]:[];
  let label,vs=false;
  if(x.t==='his'){label=x.ids.length?'HISTÓRIA · '+x.ids.length+' ENVOLVIDO'+(x.ids.length>1?'S':''):'HISTÓRIA';}
  else if(gs.length===2){const n=gs[0].length,m=gs[1].length;vs=true;label=(o.kind==='tag'&&n===2&&m===2)?'TAG TEAM':o.kind==='faction'?'FACÇÃO VS FACÇÃO':n+' VS '+m;}
  else if(gs.length>=3){label=gs.every(g=>g.length===1)?gs.length+' SUPERSTARS':gs.length+' TAG TEAMS';}
  else label='RIVALIDADE';
  return {gs,label,vs};
}
function slFace(id,small){return `<div class="slfc ${small?'sm':''}" onclick="openWrestler('${id}')" title="${esc(nm(id))}"><div class="slfp">${himg(person(id),'hbig')}</div><div class="slfn">${esc(nm(id))}</div></div>`;}
function slHero(x){
  const art=artOf(x.brand==='Multi-Brand'?'Raw':x.brand),fi=slFrameInfo(x),c=HBC[x.brand]||'#9b5de5';
  const top=`<div class="slbn" style="--c:${c}">${art.banner?`<img class="bbanner" src="${esc(art.banner)}" alt="" onerror="this.style.display='none'">`:''}<div class="slbnw">${art.banner?'':(x.brand==='Multi-Brand'?'<span class="wm" style="--c:#fff">MULTI-BRAND</span>':wordmark(x.brand))}</div></div>`;
  const cap=Math.max(1,fi.gs.length?Math.max(...fi.gs.map(g=>g.length)):1),sm=cap>3||fi.gs.length>2||(fi.gs[0]&&fi.gs[0].length>4);
  const grp=g=>`<div class="slgrp">${g.slice(0,4).map(id=>slFace(id,sm)).join('')}${g.length>4?`<div class="slmore">+${g.length-4}</div>`:''}</div>`;
  let inner;
  if(!fi.gs.length)inner='<div class="m" style="padding:26px;text-align:center">Nenhum envolvido. Use "Editar".</div>';
  else if(fi.vs)inner=`<div class="slfr">${grp(fi.gs[0])}<div class="slvs">VS</div>${grp(fi.gs[1])}</div>`;
  else if(x.t==='riv')inner=`<div class="slfr">${fi.gs.map(grp).join('')}</div>`;
  else inner=`<div class="slfr">${grp(fi.gs[0])}</div>`;
  return top+`<div class="slframe" style="--c:${c}"><div class="slflab">${fi.label}</div>${inner}</div>`;
}

function storiesDash(){
  const inBr=tab==='feuds'&&B&&B!=='Free Agency',br=inBr?B:(STL.br||'');
  const TB=['Ativas','Encerradas','Importar','Recomendações'];
  if(!TB.includes(STL.tab))STL.tab='Ativas';
  const all=slItems(br),act=all.filter(i=>!i.ended),end=all.filter(i=>i.ended);
  const cnt={Ativas:act.length,Encerradas:end.length};
  const tabs=TB.map(k=>`<button class="${STL.tab===k?'on':''}" onclick="slTab('${k}')">${k}${cnt[k]!==undefined?' ('+cnt[k]+')':''}</button>`).join('');
  SLR=slRecs();
  if(br)SLR=SLR.filter(z=>z.kind==='next'?(z.brand===br||z.brand==='Multi-Brand'):(z.brand===br));
  const chips=inBr?'':`<div class="row" style="gap:6px;flex-wrap:wrap;margin:10px 0 0">${['','Raw','SmackDown','NXT'].map(b=>`<button class="fm-chip ${br===b?'on':''}" onclick="slBr('${b}')">${b||'Todas as brands'}</button>`).join('')}</div>`;
  const head=`<section class="bhd"><div class="slhd"><span class="slbook">📖</span><div><h2 class="sech">RIVALIDADES & HISTÓRIAS${br?' · '+br.toUpperCase():''}</h2><div class="m">Crie, importe e gerencie rivalidades e sagas do seu universo!</div></div></div><div class="slinfo">ⓘ Histórias tornam seu show mais emocionante, aumentam o engajamento e criam rivalidades inesquecíveis!</div></section>${chips}<div class="htabs sect srtabs">${tabs}</div>`;
  if(STL.mode==='riv'){
    FEUDFORM=true;let fh='';try{fh=V.feudsRaw();}finally{FEUDFORM=false;}
    const bsel=inBr?'':`<div class="row" style="gap:8px;margin-bottom:8px"><span class="m">Brand da rivalidade:</span><select onchange="B=this.value;draw()">${['Raw','SmackDown','NXT'].map(b=>`<option ${B===b?'selected':''}>${b}</option>`).join('')}</select></div>`;
    return head+`<div style="margin-top:12px"><button class="add" onclick="slMode('')">← Voltar</button></div>`+`<div style="margin-top:10px">${bsel}${fh}</div>`;
  }
  if(STL.tab==='Importar'){
    return head+`<div class="card"><div class="sh">IMPORTAR HISTÓRIAS PRONTAS</div><div class="m" style="margin:6px 0 8px">Uma história por linha, no formato <b>Título | descrição</b>. Elas entram como Planejadas.</div><textarea class="f" id="sl_imp" rows="5" style="width:100%" placeholder="A Era de Roman Reigns | Roman começa uma nova fase…&#10;Guerra de Brands | Raw contra SmackDown…"></textarea><div class="row" style="margin-top:8px"><button class="btn-gold sm" onclick="slImport()">IMPORTAR</button></div></div>
    <div class="hsh" style="margin-top:18px">MODELOS PARA SUGESTÕES (usam {A}, {B} e {T}) · alimentam o booking e as recomendações</div>`+storyTemplatesHtml();
  }
  if(STL.tab==='Recomendações'){
    return head+`<div class="m" style="margin:4px 0 10px">Recomendações geradas a partir do banco de histórias do app (${STORY_BANK.length}), dos modelos que você escreveu ou importou (${(S.stories||[]).filter(x=>x.on!==false).length}) e dos próximos passos das suas rivalidades e histórias. Os nomes vêm do seu elenco e o rodízio muda a cada semana. ADICIONAR cria uma rivalidade em Ativas.</div><div class="callist">${SLR.length?SLR.map(slRecCard).join(''):em('Cadastre lutadores com alinhamento (Face/Heel) para gerar recomendações.')}</div>`;
  }
  if(STL.form&&STL.d)return head+slFormHtml();
  const list=STL.tab==='Encerradas'?end:act;
  let x=list.find(y=>y.id===STL.sel);if(!x){x=list[0];STL.sel=x?x.id:'';}
  const ico=y=>y.t==='riv'?'🔥':'📖';
  const left=list.map(y=>`<div class="sli ${x&&y.id===x.id?'on':''}" onclick="slSel('${y.id}')">${wordmark(y.brand==='Multi-Brand'?'Raw':y.brand,1)}<div style="flex:1;min-width:0"><div class="hrt">${ico(y)} ${y.titleH}</div><div class="m">${esc(y.brand)} • ${esc(y.status)}</div></div><span>›</span></div>`).join('')
    +`<div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button class="add" style="flex:1" onclick="slMode('riv')">⊕ NOVA RIVALIDADE</button><button class="add" style="flex:1" onclick="slNew()">⊕ CRIAR NOVA HISTÓRIA</button></div>`;
  let center='',right='';
  if(x){
    const o=x.o,riv=x.t==='riv',ids=x.ids,art=artOf(x.brand==='Multi-Brand'?'Raw':x.brand);
    const ph=riv?feudSides(o).map(g=>g[0]):ids.slice(0,2);
    const tt=riv&&o.hasTitle&&o.titleId?(S.titles.find(z=>z.id===o.titleId)||{}).name:'';
    center=slHero(x);
    center+=`
    <div class="sltt">${x.titleH}</div><div class="row" style="gap:6px;flex-wrap:wrap;margin:4px 0">${tag(riv?'🔥 Rivalidade':'📖 História',riv?'':'face')}${tt?tag('🏆 '+tt,'face'):''}${riv?tag(o.division||'Masculino'):''}</div>
    <div class="sltx">${esc(x.text||'Sem descrição.')}</div>${riv&&o.goal?`<div class="m" style="margin-top:4px">🎯 ${esc(o.goal)}</div>`:''}
    <div class="slinfs"><div><span class="m">BRAND</span><b>${esc(x.brand)}</b></div><div><span class="m">STATUS</span><b style="color:${x.ended?'#8a93a6':x.status==='Pausada'?'#f4c95d':x.status==='Planejada'?'#f4c95d':'#3ddc84'}">${esc(x.status)}</b></div><div><span class="m">INÍCIO</span><b>${x.start?esc(fmtBR(x.start)):'—'}</b></div></div>
    ${STL.det?`<div class="card" style="margin-top:10px"><div class="sh">DETALHES</div>${riv?(()=>{const tl=(o.timeline||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));return (o.story?`<div class="m" style="margin-bottom:8px">${esc(o.story)}</div>`:'')+(tl.length?`<div class="tl">${tl.map(e=>`<div class="te"><span class="m">${e.date?fmtBR(e.date):'sem data'}</span><div>${esc(e.text)}</div></div>`).join('')}</div>`:'<div class="m">Nenhum momento registrado ainda.</div>');})():(ids.length>=2?`<button class="add" onclick="slToFeud('${x.id}')">🔥 Transformar em rivalidade</button><div class="m" style="margin-top:6px">A história vira uma rivalidade entre os dois primeiros envolvidos, mantendo o progresso.</div>`:'<div class="m">Adicione 2 ou mais envolvidos para transformar em rivalidade.</div>')}</div>`:''}
    ${riv&&STL.edit?`<div style="margin-top:10px">${feudCard(o)}</div>`:''}`;
    right=`<div class="hp"><div class="hph">PROGRESSO DA HISTÓRIA</div><div class="hpb slprg"><div class="slring" style="--p:${x.pr}"><span>${x.pr}%</span></div><div class="slsteps">${STEPS.map(([k,l])=>{const on=x.steps[k];return `<div class="slst ${on?'on':''}" onclick="slStepAny('${x.t}','${x.id}','${k}')"><i>${on?'✓':''}</i>${l}</div>`;}).join('')}</div></div></div>
    <div class="hp" style="margin-top:10px"><div class="hph">AÇÕES DISPONÍVEIS</div><div class="hpb slact"><button class="btn-gold sm" style="width:100%" onclick="slEditAny('${x.t}','${x.id}')">✎ EDITAR HISTÓRIA</button><button onclick="STL.det=!STL.det;draw()">🔍 VER DETALHES</button><button onclick="slTab('Importar')">⬇ IMPORTAR HISTÓRIA</button><button onclick="slDelAny('${x.t}','${x.id}')">🗑 EXCLUIR HISTÓRIA</button></div></div>`;
  }else{center=em(STL.tab==='Encerradas'?'Nenhuma rivalidade ou história encerrada.':'Nada ativo'+(br?' em '+br:'')+'. Crie uma rivalidade, uma história ou adicione uma recomendação abaixo.');}
  const bottom=SLR.filter(z=>z.kind!=='next').slice(0,2);
  const recs=`<div class="hsh" style="margin-top:16px">⭐ HISTÓRIAS RECOMENDADAS</div><div class="slrecs">${bottom.length?bottom.map(z=>slRecCard(z,SLR.indexOf(z))).join(''):em('Sem recomendações no momento.')}</div><div style="text-align:right;margin-top:6px"><a class="lk" onclick="slTab('Recomendações')">Ver todas as recomendações →</a></div>`;
  return head+`<div class="slg"><div class="slleft">${left}</div><div>${center}</div><div>${right}</div></div>`+recs;
}
V.feudsRaw=V.feuds;V.feuds=storiesDash;V.stories=storiesDash;

function draw() {
  const y=window.scrollY;
  const theme = tab==='globalRoster' ? 'Global' : B;
  document.documentElement.dataset.b = theme;
  if(B==='Free Agency'&&!['freeAgency','globalRoster','landing','bk','search','account','stories'].includes(tab))tab='freeAgency';
  // Título do header: Universe Desk na home; nome da brand quando selecionada; Roster Global / Free Agency
  const h1 = document.querySelector('header.masthead h1');
  const sub = document.querySelector('header.masthead .sub');
  if(h1){
    if(tab==='landing'){ h1.innerHTML='UNIVERSE <span>DESK</span>'; if(sub)sub.textContent='Seu universo. Seu booking. Sua história.'; }
    else if(tab==='globalRoster'){ h1.innerHTML='ROSTER <span>GLOBAL</span>'; if(sub)sub.textContent='Visão completa de todos os personagens'; }
    else if(B==='Free Agency'){ h1.innerHTML='FREE <span>AGENCY</span>'; if(sub)sub.textContent='Agentes livres e contratos'; }
    else { h1.innerHTML=B.toUpperCase()+' <span>DESK</span>'; if(sub)sub.textContent='Brand ativa · booking em andamento'; }
  }
  const brandTabs=B==='Free Agency'?[]:TABS.filter(([k])=>['roster','titles','feuds','shows','teams','push','summary','year'].includes(k)||(k==='downgrade'&&B!=='NXT')||(k==='nxtcut'&&B==='NXT'));
  $('top').innerHTML=`<nav class="home-nav"><button class="${tab==='landing'?'on':''}" onclick="go('landing')">HOME</button><div class="brands">${BRS.filter(b=>b!=='Free Agency').map(b=>`<button style="--c:${COL[b]}" class="${b===B&&tab!=='landing'&&tab!=='globalRoster'?'on':''}" onclick="sb('${b}')">${b}</button>`).join('')}</div><span class="nav-divider" aria-hidden="true"></span><button style="--c:${COL['Free Agency']}" class="nav-wide ${B==='Free Agency'&&tab!=='globalRoster'?'on':''}" onclick="sb('Free Agency')">FREE AGENCY</button><button style="--c:#20c9b0" class="nav-wide ${tab==='globalRoster'?'on':''}" onclick="go('globalRoster')">ROSTER GLOBAL</button><button style="--c:#f4c95d" class="nav-wide ${tab==='bk'?'on':''}" onclick="go('bk')">💾 BACKUP</button><button style="--c:#8ab4ff" class="nav-wide ${tab==='search'?'on':''}" onclick="go('search')">🔍 BUSCA</button><button style="--c:#f59e0b" class="nav-wide ${tab==='stories'?'on':''}" onclick="go('stories')">📖 HISTÓRIAS</button><button style="--c:#ffd166" class="nav-wide" onclick="setLang('${LANG==='en'?'pt':'en'}')">🌐 ${LANG==='en'?'PORTUGUÊS':'ENGLISH'}</button><button id="acctBtn" style="--c:#7ee0a1" class="nav-wide ${tab==='account'?'on':''}" onclick="go('account')">${acctLabel()}</button></nav>${tab==='all'?`<div class="brand-home-label" style="--c:${COL[B]}">${B.toUpperCase()} · HOME DA BRAND</div><nav class="brand-menu">${brandTabs.map(([k,l])=>`<button class="brand-menu-btn ${tab===k?'on':''}" onclick="go('${k}')">${l}<span>ABRIR →</span></button>`).join('')}</nav>`:''}`;
  const back=c=>(B!=='Free Agency'&&['roster','titles','feuds','shows','teams','push','summary','year','downgrade','nxtcut'].includes(tab))?`<button class="back-btn ${c}" style="--c:${COL[B]}" onclick="go('all')">← Voltar à Home da ${B}</button>`:'';
  let _body;
  try{_body=V[tab]();}catch(e){console.error(e);_body=`<div class="card"><div class="sh">⚠ ERRO AO ABRIR ESTA TELA</div><div class="m" style="margin:8px 0">Algo nos dados desta tela causou um erro. Seus dados estão salvos e não foram alterados. Envie esta mensagem para corrigirmos:</div><textarea readonly rows="5" style="width:100%;font-family:monospace;font-size:12px">${esc('Tela: '+tab+' · Brand: '+B+'\n'+(e&&e.message||e)+'\n'+String(e&&e.stack||'').split('\n').slice(0,4).join('\n'))}</textarea></div>`;}
  try{const sd=$('side');sd.innerHTML=sideHtml();sd.style.setProperty('--bc',(B!=='Free Agency'&&BRTAB.includes(tab))?(HBC[B]||'#e11d2e'):'#e11d2e');}catch(e){console.error(e);}
  $('app').innerHTML=back('')+_body+back('bottom');
  window.scrollTo(0,y);
  if(tab==='bk')renderSnapList();
  if(tab==='search'){const q=$('gq');if(q&&!GQ)q.focus();}
  updSelBar();
  if(tab==='shows')S.shows.forEach(x=>refreshPreview(x.id));
  document.querySelectorAll('.pvbtn').forEach(b=>b.style.outline=b.dataset.m===PREVMODE?'2px solid var(--ac)':'');
  updSaveWarn();
  if(LANG==='en'){startTr();trAll();}
}
