<!DOCTYPE html>
<html lang="pt-BR" data-b="Raw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Universe Manager · WWE 2K26</title>

<style>
:root {
  --ac: #e11d2e;
  --on: #fff;
  --bg: #0a0a0e;
  --card: #14141a;
  --bd: #2a2a33;
  --tx: #f0f0f5;
  --mu: #8b8b9a;
  --in: #0d0d12;
  --glow: color-mix(in srgb, var(--ac) 35%, transparent);
  color-scheme: dark;
  box-sizing: border-box;
}
:root[data-b="Raw"] {
  --ac: #e11d2e;
  --on: #fff;
  --bg: #0c0809;
  --card: #161012;
  --bd: #3a1a1f;
}
:root[data-b="SmackDown"] {
  --ac: #2a7bf0;
  --on: #fff;
  --bg: #070b12;
  --card: #0e141f;
  --bd: #1a2a45;
}
:root[data-b="NXT"] {
  --ac: #a0a6b4;
  --on: #111;
  --bg: #0b0b0e;
  --card: #141418;
  --bd: #2c2c35;
}
:root[data-b="Free Agency"] {
  --ac: #9b5de5;
  --on: #fff;
  --bg: #100b17;
  --card: #1b1325;
  --bd: #49305f;
}
:root[data-b="Global"] {
  --ac: #20c9b0;
  --on: #04221c;
  --bg: #061412;
  --card: #0d1f1c;
  --bd: #1a4a42;
}

* { box-sizing: border-box; }
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
  background: var(--bg);
  transition: background .35s ease;
}
body {
  margin: 0;
  min-height: 100vh;
  color: var(--tx);
  font: 15px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background:
    radial-gradient(1100px 500px at 50% -120px, var(--glow), transparent 70%),
    var(--bg);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 20;
}

/* Header */
header {
  padding: 18px 16px 6px;
  max-width: 760px;
  margin: 0 auto;
}
h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 3px;
  font-weight: 900;
  text-transform: uppercase;
}
h1 span { color: var(--ac); }
.sub {
  color: var(--mu);
  font-size: 12px;
  letter-spacing: 1.2px;
  margin-top: 2px;
  text-transform: uppercase;
}

/* Sticky top bar */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 8px 12px 4px;
  border-bottom: 1px solid color-mix(in srgb, var(--bd) 60%, transparent);
}

/* Brands */
.brands {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  max-width: 760px;
  margin: 0 auto;
}
.brands button {
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  border-radius: 11px;
  padding: 10px 4px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .6px;
  cursor: pointer;
  transition: all .2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.brands button::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c);
  flex-shrink: 0;
}
.brands button.on {
  background: var(--c);
  border-color: var(--c);
  color: #fff;
  box-shadow: 0 0 18px -4px var(--c);
}
.brands button.on[style*="9aa0ad"],
.brands button.on[style*="a0a6b4"],
.brands button.on[style*="d4a017"] {
  color: #111;
}
.brands button.on::before { background: currentColor; }

/* Nav tabs */
nav {
  display: flex;
  gap: 6px;
  padding: 10px 0 6px;
  overflow-x: auto;
  max-width: 760px;
  margin: 0 auto;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button, .chip {
  flex: none;
  border: 1px solid var(--bd);
  background: var(--card);
  color: var(--tx);
  padding: 8px 14px;
  border-radius: 22px;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all .18s ease;
  white-space: nowrap;
}
nav button.on, .chip.on {
  background: var(--ac);
  border-color: var(--ac);
  color: var(--on);
  font-weight: 700;
  box-shadow: 0 0 14px -5px var(--ac);
}

/* Main content */
main {
  padding: 12px 14px 60px;
  max-width: 760px;
  margin: 0 auto;
}

/* Cards & sections */
.card, .sec {
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
  transition: border-color .2s;
}
.sec {
  border-left: 4px solid var(--c);
  margin-bottom: 16px;
}
.sh {
  font-weight: 800;
  letter-spacing: 1.6px;
  color: var(--c);
  margin-bottom: 8px;
  font-size: 13px;
  text-transform: uppercase;
}
.hero {
  border-color: var(--ac);
  box-shadow: 0 0 28px -12px var(--ac);
  background: linear-gradient(145deg, color-mix(in srgb, var(--ac) 8%, var(--card)), var(--card));
}
.champ {
  font-size: 22px;
  font-weight: 900;
  color: var(--ac);
  letter-spacing: .5px;
  margin: 4px 0 10px;
}

/* Details / accordion */
summary {
  cursor: pointer;
  list-style: none;
}
summary::-webkit-details-marker { display: none; }
details.card {
  padding: 0;
  overflow: hidden;
}
details.card > summary {
  padding: 14px;
}
details.card[open] > summary {
  border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--ac) 5%, transparent);
}
details.card > :not(summary) {
  padding: 14px;
}

/* Layout helpers */
.row, .rw {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.rw {
  padding: 8px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--bd) 70%, transparent);
  gap: 6px;
}
.rw:last-child { border: 0; }
.g {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.fl {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

/* Form elements */
input, select, textarea {
  background: var(--in);
  color: var(--tx);
  border: 1px solid var(--bd);
  border-radius: 9px;
  padding: 10px 11px;
  font: inherit;
  min-width: 0;
  width: 100%;
  transition: border-color .15s;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--ac);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--ac) 25%, transparent);
}
.row input, .row select { width: auto; }
input.f { flex: 1 1 140px; }
textarea {
  margin-top: 4px;
  resize: vertical;
  min-height: 60px;
}

/* Buttons */
button.add {
  background: var(--ac);
  color: var(--on);
  border: 0;
  border-radius: 9px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: transform .12s, box-shadow .15s;
}
button.add:active { transform: scale(.97); }
button.add:hover { box-shadow: 0 0 16px -4px var(--ac); }
button.x {
  background: none;
  border: 0;
  color: var(--mu);
  font-size: 14px;
  padding: 4px 8px;
  cursor: pointer;
  border-radius: 6px;
  transition: color .15s, background .15s;
}
button.x:hover {
  color: #ff6b6b;
  background: color-mix(in srgb, #ff6b6b 12%, transparent);
}

/* Text & tags */
.t { font-weight: 650; }
.m { color: var(--mu); font-size: 13px; }
.n {
  display: inline-flex;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--ac);
  color: var(--on);
  font-size: 12px;
  font-weight: 800;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tag {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 12px;
  border: 1px solid var(--bd);
  color: var(--mu);
  white-space: nowrap;
  font-weight: 500;
}
.face {
  color: var(--ac);
  border-color: color-mix(in srgb, var(--ac) 50%, transparent);
  background: color-mix(in srgb, var(--ac) 10%, transparent);
}
.heel {
  color: #ff6b6b;
  border-color: color-mix(in srgb, #ff6b6b 50%, transparent);
  background: color-mix(in srgb, #ff6b6b 10%, transparent);
}
.sp { flex: 1; }
.empty {
  text-align: center;
  color: var(--mu);
  padding: 32px 12px;
  font-size: 14px;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 12px 0;
}

h2 {
  font-size: 12px;
  letter-spacing: 1.8px;
  color: var(--ac);
  margin: 20px 2px 10px;
  text-transform: uppercase;
  font-weight: 800;
}

/* Small polish */
.rw .t { font-size: 15px; }
.sec .rw:last-child { padding-bottom: 0; }

@media (max-width: 420px) {
  .brands button { font-size: 11px; padding: 9px 2px; }
  h1 { font-size: 20px; letter-spacing: 2px; }
}

function bindWselInputs(root){

      const w=btn.closest('.wsel'); w.classList.remove('open');

}

function setPhotoUrl(id,url){const r=S.roster.find(x=>x.id===id);if(!r)return;r.photo=(url||'').trim();save();draw();}
function clearPhoto(id){const r=S.roster.find(x=>x.id===id);if(!r)return;r.photo='';save();draw();}
function setPhotoFile(id,input){
  const file=input&&input.files&&input.files[0];if(!file)return;
  if(!file.type.startsWith('image/')){alert('Escolha uma imagem.');return;}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=420; let w=img.width, h=img.height;
      if(w>max||h>max){const s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
      const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      const data=canvas.toDataURL('image/jpeg',0.72);
      const r=S.roster.find(x=>x.id===id);if(!r)return;r.photo=data;save();draw();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function statsFor(id){let wins=0,losses=0,draws=0;S.shows.forEach(s=>(s.matches||[]).forEach(m=>{if(m.matchType==='Promo'||!(m.participants||[]).includes(id))return;const o=(m.outcomes||{})[id];if(o==='Vitoria')wins++;else if(o==='Derrota')losses++;else if(o==='Empate')draws++;}));const total=wins+losses+draws;return{wins,losses,draws,total,pct:total?Math.round(wins/total*100):0};}

/* ===== ESTRELAS DAS LUTAS (0 a 5, passo 0,5) ===== */
const STAR_STEPS=Array.from({length:11},(_,i)=>i/2);
function starTxt(v){if(typeof v!=='number'||isNaN(v))return '';const f=Math.floor(v);return (f?'★'.repeat(f):'')+(v-f>=.5?'½':'')+(v===0?'☆':'')+' '+v.toFixed(1).replace('.',',');}
function starsInfo(id){let sum=0,n=0;S.shows.forEach(sh=>(sh.matches||[]).forEach(m=>{if(typeof m.stars==='number'&&(m.participants||[]).includes(id)){sum+=m.stars;n++;}}));
  // nota manual do perfil (opcional) vale como ponto de partida; sem ela, o ponto de partida é 3,0 (neutro)
  const r=S.roster.find(x=>x.id===id),man=r&&typeof r.starBase==='number'?r.starBase:null,base=man!=null?man:3;
  return {n,sum,man,avg:n?sum/n:null,adj:(sum+base*2)/(n+2)};}
function starLine(id){const i=starsInfo(id),f=v=>v.toFixed(1).replace('.',',');if(i.man!=null)return '★ '+f(i.adj)+(i.n?' ('+i.n+(i.n===1?' luta':' lutas')+' + base '+f(i.man)+')':' (manual)');return i.n?'★ '+f(i.avg)+' ('+i.n+(i.n===1?' luta':' lutas')+')':'★ sem notas';}
function starFactor(id){return .4+1.6*starsInfo(id).adj/5;}      // 0,4 (péssimo) … 2,0 (5 estrelas)
function pushWeight(r){const p=popularity(r.id),ideal=Math.abs((p<40?40:p>75?75:p)-55);const fit=Math.max(.2,1-ideal/25);const f=starFactor(r.id);return fit*f*f;}
function weightedOrder(items,wfn){return items.map(x=>({x,k:-Math.log(Math.random()||1e-9)/Math.max(1e-6,wfn(x))})).sort((a,b)=>a.k-b.k).map(o=>o.x);}
function setMatchStars(showId,idx,val){const m=S.shows.find(s=>s.id==showId).matches[idx];if(val==='')delete m.stars;else m.stars=Math.max(0,Math.min(5,Math.round(+val*2)/2));save();draw();}

const WK={Raw:1,SmackDown:5,NXT:2}, DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pd(x){const [y,m,d]=x.split('-').map(Number);return new Date(y,m-1,d);}
function addDays(x,n){const d=pd(x);d.setDate(d.getDate()+n);return dstr(d);}
function addMonths(x,n){const d=pd(x);d.setMonth(d.getMonth()+n);return dstr(d);}
function fmtBR(x){return x?x.split('-').reverse().join('/'):'';}
function dow(x){return DIAS[pd(x).getDay()];}
function universeDate(){const done=S.shows.filter(s=>s.completed&&s.date).map(s=>s.date).sort();if(done.length)return done[done.length-1];const all=S.shows.filter(s=>s.date).map(s=>s.date).sort();return all.length?all[0]:dstr(new Date());}

/* ===== CALENDÁRIO: shows semanais avançam +7 dias automaticamente ===== */
function lastWeekly(b){const l=S.shows.filter(s=>s.type==='Show semanal'&&s.brand===b&&s.date).map(s=>s.date).sort();return l.length?l[l.length-1]:'';}
function nextWeekly(b){const l=lastWeekly(b);if(l)return {date:addDays(l,7),auto:true,last:l};const d=new Date();d.setDate(d.getDate()+((WK[b]-d.getDay()+7)%7));return {date:dstr(d),auto:false,last:''};}
function createWeekly(b,manual){const date=manual||nextWeekly(b).date;if(S.shows.some(s=>s.type==='Show semanal'&&s.brand===b&&s.date===date)){alert(b+' já tem show semanal em '+fmtBR(date)+'.');return false;}S.shows.push({id:uid(),name:b,type:'Show semanal',brand:b,brands:[b],date,matches:[],notes:'',completed:false});return true;}
function addWeeklyOne(b){const el=$('wk'+b);if(createWeekly(b,el&&el.value)){save();draw();}}
function addWeeklyPack(){let ok=false;['Raw','SmackDown','NXT'].forEach(b=>{const el=$('wk'+b);if(createWeekly(b,el&&el.value))ok=true;});if(ok){save();draw();}}

/* ===== DESEMPENHO (usado no downgrade e na revisão da NXT) ===== */
function champIds(){const ids=new Set();S.titles.forEach(t=>{if(!t.champ)return;ids.add(t.champ);const tm=S.teams.find(x=>x.id===t.champ);if(tm)(tm.members||[]).forEach(m=>ids.add(m));});return ids;}
function perfOf(r,pool){const pop=popularity(r.id),si=starsInfo(r.id),st=statsFor(r.id);const maxW=Math.max(1,...pool.map(x=>statsFor(x.id).wins));
  const starsBad=(5-si.adj)/5*100,winsBad=100*(1-(.5*st.wins/maxW+.5*(st.total?st.wins/st.total:.5)));
  return {r,pop,si,st,score:.35*(100-pop)+.35*starsBad+.30*winsBad};}
function perfReason(c){const w=c.st.wins;return 'Pop '+Math.round(c.pop)+'% · '+starLine(c.r.id)+' · '+w+(w===1?' vitória':' vitórias')+(c.st.total?' ('+c.st.pct+'%)':'')+' · pior nota '+c.score.toFixed(0)+'/100';}
function worstByDivision(pool,n){const ch=champIds(),res={};['Masculino','Feminino'].forEach(d=>{const g=pool.filter(r=>r.division===d&&!ch.has(r.id));res[d]=g.map(r=>perfOf(r,g)).sort((a,b)=>b.score-a.score).slice(0,n);});return res;}
function moveBrand(id,to,kind,skip){const r=S.roster.find(x=>x.id===id);if(!r)return;if(!skip&&!confirm((kind==='cut'?'Demitir ':'Mandar para a '+to+': ')+r.name+(kind==='cut'?' (vai para a Free Agency)?':'?')))return;
  (S.moves=S.moves||[]).unshift({date:universeDate(),id,name:r.name,from:r.brand,to,kind});r.brand=to;save();draw();}
function nxtState(){const rv=S.nxtReview=S.nxtReview||{last:'',kept:[]};rv.kept=rv.kept||[];const today=universeDate();let base=rv.last;if(!base){const ds=S.shows.filter(s=>s.date).map(s=>s.date).sort();base=ds[0]||today;}const due=addMonths(base,6);return {rv,today,base,due,isDue:today>=due};}
function keepNxt(id){const rv=nxtState().rv;if(!rv.kept.includes(id))rv.kept.push(id);save();draw();}
function finishNxtReview(){if(!confirm('Concluir a revisão de hoje? A próxima será daqui a 6 meses.'))return;const st=nxtState();st.rv.last=st.today;st.rv.kept=[];save();draw();}


/* ===== SUGESTÃO DE BOOKING (renovada a cada 3 meses, pela data do universo) ===== */
function hashN(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rngFrom(seed){let a=hashN(String(seed))||1;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pickR(rnd,arr){return arr.length?arr[Math.floor(rnd()*arr.length)]:null;}
function rosterAverages(){const l=S.roster.filter(r=>r.role==='Lutador'&&r.brand!=='Free Agency');if(!l.length)return {pop:50,adj:3};return {pop:l.reduce((a,r)=>a+popularity(r.id),0)/l.length,adj:l.reduce((a,r)=>a+starsInfo(r.id).adj,0)/l.length};}
const FAC_WORDS=['Regime','Syndicate','Order','Dominion','Collective','Alliance','Legion','Council'];
const TAG_WORDS=['Connection','Express','Dynasty','Inc.','Brothers','Duo','Project','Tandem'];
function buildBooking(r,bump){
  const today=universeDate(),av=rosterAverages(),pop=popularity(r.id),si=starsInfo(r.id),st=statsFor(r.id),held=carry(r.id);
  const rnd=rngFrom(r.id+'|'+today+'|'+(bump||0));
  const z=(pop-av.pop)/15+(si.adj-av.adj)/.8+(st.total>=3?(st.pct-50)/50:0)+(held.length?1:0);
  const reduced=!held.length&&(pop<av.pop-8||si.adj<av.adj-.7||(st.total>=3&&st.pct<30));
  const tier=reduced?'reduzido':(z>=1.5||(pop>=75&&si.adj>=3.5))?'forte':z>=.4?'subindo':'estavel';
  const short=r.name.split(' ').slice(-1)[0];
  const same=S.roster.filter(x=>x.id!==r.id&&x.role==='Lutador'&&x.status!=='Lesionado'&&x.brand===r.brand&&x.division===r.division);
  const byClose=(arr)=>arr.slice().sort((a,b)=>Math.abs(popularity(a.id)-pop)-Math.abs(popularity(b.id)-pop)).slice(0,3);
  const al=r.alignment||'Tweener';
  const opp=al==='Face'?'Heel':al==='Heel'?'Face':null;
  const rivals=byClose(same.filter(x=>!opp||x.alignment===opp));
  const _op=bookingOpps(r,3).map(o=>o.r),rival=pickR(rnd,_op.length?_op:(rivals.length?rivals:byClose(same))),rival2=pickR(rnd,(_op.length?_op:byClose(same)).filter(x=>!rival||x.id!==rival.id));
  const free=same.filter(x=>!S.teams.some(t=>(t.members||[]).includes(x.id)&&t.status!=='Dissolvido'));
  const partner=(r.brand!=='Free Agency'&&!teamFor(r.id).length)?pickR(rnd,byClose(free.filter(x=>x.alignment===al||!x.alignment))):null;
  const facPool=same.filter(x=>!x.faction&&(!partner||x.id!==partner.id)&&x.alignment===al);
  const facMembers=(!r.faction&&r.brand!=='Free Agency'&&facPool.length>=2)?byClose(facPool).slice(0,2):[];
  const titles=S.titles.filter(t=>t.brand===r.brand&&t.champ&&!held.includes(t)&&((S.roster.find(x=>x.id===t.champ)||{}).division||r.division)===r.division&&t.lv!=='Tag Team');
  const title=pickR(rnd,titles.filter(t=>(r.card==='Main Event'?t.lv==='Main Event':true)));
  const plan=[],act={turn:null,partner:null,teamName:'',facIds:[],facName:''};
  const rv=rival?rival.name:'um rival da brand';
  let head,why;
  if(r.brand==='Free Agency'){
    tier==='reduzido'?(head='Sem contrato · baixa demanda',why='Popularidade e estrelas abaixo da média do elenco.'):(head='Sem contrato · bom candidato à contratação',why='Estatísticas acima ou na média do elenco: vale contratar.');
    plan.push('Contratar para '+(r.division==='Feminino'?'Raw ou SmackDown':'Raw, SmackDown ou NXT')+' conforme a vaga e iniciar com 2–3 vitórias em TV para recuperar o momentum.');
  }else if(tier==='forte'){
    head='Destaque · booking de topo de card';
    why='Popularidade '+Math.round(pop)+'% (média do elenco '+Math.round(av.pop)+'%), '+starLine(r.id).replace('★ ','')+' estrelas'+(held.length?' e campeão atual':'')+'. Está com momentum.';
    plan.push(held.length?'Defesas de título em PPV contra '+rv+(rival2?' e '+rival2.name:'')+', com reinado longo e vitórias limpas.':(title?'Disputa pelo '+title.name+' (campeão: '+nm(title.champ)+'), construída em 3 shows com promos e luta em PPV.':'Rivalidade principal com '+rv+' ao longo dos próximos 3 meses, fechando em luta de PPV.'));
    plan.push('Espaço no main event de TV e promo de abertura ao menos 1 vez por mês.');
    if(al==='Face'&&pop>=75){act.turn='Heel';plan.push('Virada heel: traição a '+(partner?partner.name:'um aliado')+' no auge do apoio do público — história de "quem te fez grande agora te abandona".');}
    else if(al==='Heel'&&pop>=75){act.turn='Face';plan.push('Virada face: o público já torce por ele; deixe os fãs "adotarem" '+short+' após uma derrota injusta por interferência.');}
    else if(al==='Tweener'){act.turn=rnd()<.5?'Face':'Heel';plan.push('Definir alinhamento ('+act.turn+') para dar direção clara ao personagem no topo.');}
  }else if(tier==='subindo'){
    head='Em ascensão · meio de card em alta';
    why='Acima da média recente ('+Math.round(pop)+'% de popularidade, '+si.adj.toFixed(1).replace('.',',')+'★). Merece subir de degrau.';
    plan.push('Rivalidade com '+rv+': dois confrontos em TV (um de cada lado vencendo) e luta decisiva em PPV.');
    plan.push('Sequência de 2–3 vitórias em TV para firmar o nome e sustentar o crescimento.');
    if(title)plan.push('Se mantiver o ritmo, disputar o '+title.name+' no próximo ciclo.');
  }else if(tier==='estavel'){
    head='Estável · manter no meio de card';
    why='Desempenho na média do elenco ('+Math.round(pop)+'% de popularidade, '+si.adj.toFixed(1).replace('.',',')+'★).';
    plan.push('Luta de TV regular e uma história curta com '+rv+' para testar a reação do público.');
    plan.push('Subir só se emendar boas lutas (≥ 3,5★) e vitórias nos próximos shows.');
  }else{
    head='Participação reduzida até melhorar';
    why='Abaixo da média do elenco ('+Math.round(pop)+'% vs '+Math.round(av.pop)+'% de popularidade; '+si.adj.toFixed(1).replace('.',',')+'★ vs '+av.adj.toFixed(1).replace('.',',')+'★'+(st.total>=3?'; '+st.pct+'% de aproveitamento':'')+').';
    plan.push('Aparições curtas: segmentos, promos e lutas de TV sem destaque; fora de títulos e de lutas principais de PPV.');
    plan.push('Reconstrução: vitória clara sobre '+(rival?rival.name:'um lutador de nível menor')+' para reabrir a história.');
    plan.push('Meta para voltar a ter destaque: popularidade ≥ '+Math.round(av.pop)+'% e estrelas ≥ '+av.adj.toFixed(1).replace('.',',')+'.');
    {act.turn=al==='Face'?'Heel':'Face';plan.push('Mudança de alinhamento ('+al+' → '+act.turn+') para renovar o personagem: '+(act.turn==='Heel'?'abandona o público que "não o apoiou o suficiente"':'passa a ser o azarão que o público volta a abraçar')+'.');}
  }
  if(partner&&tier!=='forte'||(partner&&tier==='forte'&&rnd()<.4)){act.partner=partner.id;act.teamName=short+' & '+partner.name.split(' ').slice(-1)[0]+' '+pickR(rnd,TAG_WORDS);plan.push('Tag team com '+partner.name+' ("'+act.teamName+'"): '+(tier==='reduzido'?'dividir o holofote ajuda a recuperar fôlego e a estar em lutas de PPV.':'abre a disputa pelos títulos de duplas.'));}
  if(facMembers.length&&(tier==='forte'||tier==='subindo')&&rnd()<.6){act.facIds=facMembers.map(x=>x.id);act.facName=short+' '+pickR(rnd,FAC_WORDS);plan.push('Facção "'+act.facName+'" com '+facMembers.map(x=>x.name).join(' e ')+': '+short+' como líder, dominando o meio de card.');}
  if(rival)plan.push(STORY_PFX+pickStory(r,rival,al,title,rnd,rv));
  return {date:today,next:addMonths(today,3),tier,head,why,plan,act,bump:bump||0};
}
let _bkSave=0;
function ensureBooking(r){
  if(r.role!=='Lutador')return null;
  const b=r.bookingSug;
  if(!b||universeDate()>=b.next){r.bookingSug=buildBooking(r,0);if(!_bkSave)_bkSave=setTimeout(()=>{_bkSave=0;save();},60);}
  return r.bookingSug;
}
function regenBooking(id){const r=S.roster.find(x=>x.id===id);if(!r)return;r.bookingSug=buildBooking(r,((r.bookingSug||{}).bump||0)+1);save();draw();}
function bookingTurn(id){const r=S.roster.find(x=>x.id===id),a=r&&r.bookingSug&&r.bookingSug.act;if(!a||!a.turn)return;if(!confirm('Mudar o alinhamento de '+r.name+' para '+a.turn+'?'))return;r.alignment=a.turn;a.turn=null;save();draw();}
function bookingTeam(id){const r=S.roster.find(x=>x.id===id),a=r&&r.bookingSug&&r.bookingSug.act;if(!a||!a.partner)return;const pt=S.roster.find(x=>x.id===a.partner);if(!pt)return;if(!confirm('Criar a tag team "'+a.teamName+'" com '+r.name+' e '+pt.name+'?'))return;S.teams.push({id:uid(),name:a.teamName,brand:r.brand,members:[r.id,pt.id],status:'Ativo',since:'',manager:'',notes:'Criada pela sugestão de booking.'});a.partner=null;save();draw();}
function bookingFaction(id){const r=S.roster.find(x=>x.id===id),a=r&&r.bookingSug&&r.bookingSug.act;if(!a||!a.facIds||!a.facIds.length)return;const ms=a.facIds.map(i=>S.roster.find(x=>x.id===i)).filter(Boolean);if(!confirm('Criar a facção "'+a.facName+'" com '+[r].concat(ms).map(x=>x.name).join(', ')+'?'))return;const f={id:uid(),name:a.facName,brand:r.brand,tipo:'Stable',status:'Ativa',since:'',leader:r.id,goal:'',enemies:'',notes:'Criada pela sugestão de booking.'};S.factions.push(f);[r].concat(ms).forEach(x=>x.faction=f.id);a.facIds=[];save();draw();}
function bookingBlock(r,held){
  const b=ensureBooking(r);if(!b)return '';
  const col=b.tier==='reduzido'?'heel':'face';
  return `<div class="card" style="margin-top:10px"><div class="row" style="flex-wrap:wrap"><div class="m">SUGESTÃO DE BOOKING · renovada a cada 3 meses</div><span class="sp"></span>${tag(b.head,col)}</div>
  <div class="m" style="margin:8px 0">${esc(b.why)}${held?' Campeão atual: fora das sugestões de push.':''}</div>
  <ul style="margin:0 0 8px 18px;padding:0">${b.plan.map(x=>planLi(r,x,'m')).join('')}</ul>${oppsHtml(r)}
  <div class="row" style="flex-wrap:wrap;gap:6px">${b.act.turn?`<button class="add" onclick="bookingTurn('${r.id}')">Aplicar: virar ${b.act.turn}</button>`:''}${b.act.partner?`<button class="add" onclick="bookingTeam('${r.id}')">Criar tag team sugerida</button>`:''}${b.act.facIds&&b.act.facIds.length?`<button class="add" onclick="bookingFaction('${r.id}')">Criar facção sugerida</button>`:''}<button class="add" onclick="regenBooking('${r.id}')">Outra sugestão</button></div>
  <div class="m" style="margin-top:6px">Gerada em ${fmtBR(b.date)} · próxima renovação em ${fmtBR(b.next)} (data do universo).</div></div>`;
}

function showAvg(sh){const r=(sh.matches||[]).filter(m=>typeof m.stars==='number'&&m.matchType!=='Promo');return r.length?{avg:r.reduce((a,m)=>a+m.stars,0)/r.length,n:r.length}:null;}
function starAvgTxt(v){return starTxt(Math.floor(v*2)/2).replace(/\s[\d,]+$/,'')+' '+v.toFixed(2).replace('.',',');}

function teamFor(id){return S.teams.filter(t=>(t.members||[]).includes(id));}
function historyHas(h,field,id){return h[field]===id||(h[field+'Members']||[]).includes(id)||teamFor(id).some(tm=>tm.id===h[field]);}
function titleReigns(id){return S.titles.reduce((n,t)=>n+(t.history||[]).filter(h=>historyHas(h,'champion',id)).length,0);}
function hasPushBonus(id){
  const pb=S.pushBoard||{};
  const ab=pb.activeBonus||{singles:[],tags:[]};
  if((ab.singles||[]).includes(id)) return true;
  return (ab.tags||[]).some(tid=>{
    const t=S.teams.find(x=>x.id===tid);
    return t&&(t.members||[]).includes(id);
  });
}
function popularity(id){
  const r=S.roster.find(x=>x.id===id);
  let score=50+(r&&r.popAdj?+r.popAdj:0);
  S.shows.forEach(s=>(s.matches||[]).forEach(m=>{
    const o=(m.outcomes||{})[id];if(!o)return;
    // Promo: vencedor +0,5 · perdedor −0,5 · empate: todos +0,5
    if(m.matchType==='Promo'){if(o==='Vitoria'||o==='Empate')score+=.5;else if(o==='Derrota')score-=.5;return;}
    const stv=typeof m.stars==='number'?m.stars:null;
    if(o==='Vitoria'){let g=m.matchType==='Royal Rumble'?10:s.type==='PPV'?2.5:1;if(stv===5)g*=1.5;score+=g;}   // luta 5★: vencedor ganha ×1,5
    else if(o==='Derrota'){let l=.5;if(stv!==null&&stv>=5)l=0;else if(stv!==null&&stv>=4)l=.25;score-=l;}        // 5★ não perde · 4–4,5★ perde metade
  }));
  S.titles.forEach(t=>(t.history||[]).forEach(h=>{
    if(historyHas(h,'champion',id))score+=5;
    if(historyHas(h,'previous',id))score-=5;
  }));
  if(hasPushBonus(id)) score = score * 1.5; // +0.5 no multiplicador até o próximo PPV
  return Math.max(0,Math.min(100,Math.round(score*10)/10));
}
function teamDivision(t){
  const mem=(t.members||[]).map(id=>S.roster.find(r=>r.id===id)).filter(Boolean);
  if(!mem.length) return 'Masculino';
  const f=mem.filter(r=>r.division==='Feminino').length;
  const m=mem.filter(r=>r.division==='Masculino').length;
  if(f&&!m) return 'Feminino';
  if(m&&!f) return 'Masculino';
  return 'Mix';
}
function generatePushSuggestions(ppvId){
  const pb=S.pushBoard||(S.pushBoard={suggestions:{men:[],women:[],tagMen:[],tagWomen:[]},selected:{singles:[],tags:[]},activeBonus:{singles:[],tags:[]},lastPpvId:'',pending:false});
  // Encerra bônus do ciclo anterior ao gerar novas sugestões pós-PPV
  pb.activeBonus={singles:[],tags:[]};
  pb.selected={singles:[],tags:[]};
  const eligible=r=>r.role==='Lutador'&&r.status==='Ativo'&&r.brand!=='Free Agency';
  const rankW=(a,b)=>{
    // prioriza mid pop (espaço para crescer) + vitórias recentes
    const pa=popularity(a.id), pb2=popularity(b.id);
    const ideal=x=>Math.abs((x<40?40:x>75?75:x)-55);
    return ideal(pa)-ideal(pb2) || pb2-pa;
  };
  // temporariamente sem bônus já limpo
  // quanto melhores as estrelas (e quanto mais "espaço para crescer" em popularidade), maior a chance de ser sugerido
  let men=weightedOrder(S.roster.filter(r=>eligible(r)&&r.division==='Masculino'),pushWeight);
  let women=weightedOrder(S.roster.filter(r=>eligible(r)&&r.division==='Feminino'),pushWeight);
  // evita campeões mundiais principais se possível
  const worldish=t=>/championship/i.test(t.name)&&t.lv==='Main Event';
  const isWorldChamp=id=>S.titles.some(t=>worldish(t)&&t.champ===id);
  men=men.filter(r=>!isWorldChamp(r.id)).concat(men.filter(r=>isWorldChamp(r.id)));
  women=women.filter(r=>!isWorldChamp(r.id)).concat(women.filter(r=>isWorldChamp(r.id)));
  const pick=arr=>arr.slice(0,2).map(r=>r.id);
  pb.suggestions.men=pick(men);
  pb.suggestions.women=pick(women);
  const tags=S.teams.filter(t=>(t.members||[]).length>=2&&t.status!=='Dissolvido');
  const tw=t=>{const ms=(t.members||[]).map(id=>S.roster.find(r=>r.id===id)).filter(Boolean);return ms.length?ms.reduce((a,r)=>a+pushWeight(r),0)/ms.length:.2;};
  const tagMen=weightedOrder(tags.filter(t=>teamDivision(t)==='Masculino'),tw);
  const tagWomen=weightedOrder(tags.filter(t=>teamDivision(t)==='Feminino'),tw);
  pb.suggestions.tagMen=tagMen.slice(0,2).map(t=>t.id);
  pb.suggestions.tagWomen=tagWomen.slice(0,2).map(t=>t.id);
  pb.pending=true;
  pb.lastPpvId=ppvId||'';
  S.pushBoard=pb;
}
function togglePushSelect(kind,id){
  const pb=S.pushBoard; if(!pb)return;
  const arr=pb.selected[kind]||(pb.selected[kind]=[]);
  const i=arr.indexOf(id);
  if(i>=0)arr.splice(i,1); else arr.push(id);
  save();draw();
}
function confirmPushPicks(){
  const pb=S.pushBoard; if(!pb)return;
  pb.activeBonus={
    singles:(pb.selected.singles||[]).slice(),
    tags:(pb.selected.tags||[]).slice()
  };
  pb.pending=false;
  save();draw();
}
function applyPop(id,delta){const r=S.roster.find(x=>x.id===id);if(!r)return;r.popAdj=(+r.popAdj||0)+delta;}

/* ===== duplas de rivalidade: time cadastrado OU lutadores avulsos ===== */
function getTeam(id){let t=S.teams.find(x=>x.id===id);if(t)return t;for(const f of S.feuds){const g=f.groups&&f.groups[id];if(g)return {id,name:g.name,members:g.members,brand:f.brand};}return null;}
function fillPickers(name,tid){const t=S.teams.find(x=>x.id===tid);[...document.querySelectorAll('[name="'+name+'"]')].forEach((h,k)=>{const id=(t&&(t.members||[])[k])||'';h.value=id;const w=h.closest('.wsel'),bt=w&&w.querySelector('.wsel-btn'),r=S.roster.find(x=>x.id===id);if(bt)bt.innerHTML=r?avHtml(r,false)+'<span>'+esc(r.name)+'</span>':'<span class="m">Selecionar wrestler…</span>';});}
function groupFromPicks(name,teamId,store){const ids=[...new Set([...document.querySelectorAll('[name="'+name+'"]')].map(x=>x.value).filter(Boolean))];if(!ids.length)return {empty:true};if(ids.length<2)return {err:'Cada dupla precisa de pelo menos 2 lutadores.'};
  const same=t=>t&&(t.members||[]).length===ids.length&&ids.every(i=>t.members.includes(i));
  const t=S.teams.find(x=>x.id===teamId&&same(x))||S.teams.find(same);if(t)return {id:t.id,ids};
  const gid='g'+uid();store[gid]={name:ids.map(nm).join(' & '),members:ids};return {id:gid,ids};}
function pickerSlot(pool,key,label,teams){return `<div class="card" style="margin:6px 0"><div class="m">${label}</div><select onchange="fillPickers('${key}',this.value)" style="margin:6px 0"><option value="">Preencher com time cadastrado (opcional)</option>${teams.map(t=>`<option value="${t.id}">${esc(t.name)} · ${esc((t.members||[]).map(nm).join(' / '))}</option>`).join('')}</select><div class="g">${wselInput(pool,key,'','Lutador 1')}${wselInput(pool,key,'','Lutador 2')}${wselInput(pool,key,'','Lutador 3 (opcional)')}</div></div>`;}


/* ===== pôsteres (por enquanto só nas rivalidades) ===== */
function posterHtml(id){const r=S.roster.find(x=>x.id===id);const name=r?r.name:'Vago';
  return `<div class="poster" title="${esc(name)}">${esc(initials(name))}${r&&r.photo?`<img src="${esc(r.photo)}" alt="" onerror="this.style.display='none'">`:''}<span class="pn">${esc(name)}</span></div>`;}
function feudGroups(f){const k=f.kind||'lutador';
  if(k==='lutador')return [[(f.sideA||[f.a])[0]],[(f.sideB||[f.b])[0]]];
  if(k==='multi')return (f.participants||[]).map(x=>[x]);
  if(k==='multi-tag')return (f.participants||[]).map(tid=>((getTeam(tid)||{}).members||[]));
  return [feudSideMembers(f,'a'),feudSideMembers(f,'b')];}
function feudPosters(f){const gs=feudGroups(f).filter(g=>g.length);if(!gs.length)return '';
  return `<div class="vsrow">${gs.map(g=>`<div class="vsgrp">${g.map(posterHtml).join('')}</div>`).join('<span class="vs">VS</span>')}</div>`;}

function feudSideMembers(f,side){
  const ids=[];
  if(f.kind==='lutador'){
    const arr=side==='a'?(f.sideA||[f.a]).filter(Boolean):(f.sideB||[f.b]).filter(Boolean);
    arr.forEach(id=>{if(id)ids.push(id);});
  } else if(f.kind==='tag'){
    const teams=side==='a'?(f.sideA||[]):(f.sideB||[]);
    teams.forEach(tid=>{const t=getTeam(tid);if(t)(t.members||[]).forEach(m=>ids.push(m));});
  } else if(f.kind==='faction'){
    const facs=side==='a'?(f.sideA||[]):(f.sideB||[]);
    facs.forEach(fid=>{S.roster.filter(r=>r.faction===fid).forEach(r=>ids.push(r.id));});
  }
  return [...new Set(ids)];
}
function teamMemberNames(tid){
  const t=getTeam(tid);
  if(!t)return '';
  return (t.members||[]).map(nm).filter(Boolean).join(' · ')||'sem membros';
}
function factionMemberNames(fid){
  return S.roster.filter(r=>r.faction===fid).map(r=>r.name).join(' · ')||'sem membros';
}
function resolveFeud(id,winnerKey){
  const f=S.feuds.find(x=>x.id===id);if(!f||f.resolved)return;
  let win=[], lose=[];
  if(f.kind==='multi'){
    const parts=(f.participants||[]).filter(Boolean);
    if(!parts.includes(winnerKey))return;
    win=[winnerKey];
    lose=parts.filter(x=>x!==winnerKey);
    win.forEach(i=>applyPop(i,3.5));
    lose.forEach(i=>applyPop(i,-2));
  } else if(f.kind==='multi-tag'){
    const parts=(f.participants||[]).filter(Boolean);
    if(!parts.includes(winnerKey))return;
    const tWin=getTeam(winnerKey);
    win=(tWin&&tWin.members||[]).slice();
    parts.filter(tid=>tid!==winnerKey).forEach(tid=>{
      const t=getTeam(tid);
      if(t)(t.members||[]).forEach(m=>lose.push(m));
    });
    win=[...new Set(win)]; lose=[...new Set(lose)].filter(x=>!win.includes(x));
    win.forEach(i=>applyPop(i,1.5));
    lose.forEach(i=>applyPop(i,-1));
  } else {
    const side = winnerKey;
    win=feudSideMembers(f,side);
    lose=feudSideMembers(f,side==='a'?'b':'a');
    const isGroup = f.kind==='tag'||f.kind==='faction';
    const wDelta = isGroup ? 1.5 : 3.5;
    const lDelta = isGroup ? -1 : -2;
    win.forEach(i=>applyPop(i,wDelta));
    lose.forEach(i=>applyPop(i,lDelta));
  }
  f.resolved=true;f.winnerSide=winnerKey;f.status='Encerrada';
  save();draw();
}
function resolveButtons(f){
  if(f.resolved){
    let label=f.winnerSide||'';
    if(f.kind==='multi') label=nm(f.winnerSide);
    else if(f.kind==='multi-tag'){const t=getTeam(f.winnerSide);label=t?t.name+' ('+teamMemberNames(f.winnerSide)+')':f.winnerSide;}
    else if(f.kind==='tag'){
      const tid=((f.winnerSide==='a'?f.sideA:f.sideB)||[])[0];
      const t=getTeam(tid);
      label=t?(t.name+' · '+teamMemberNames(t.id)):'Lado '+(f.winnerSide||'').toUpperCase();
    } else if(f.kind==='faction'){
      const fid=((f.winnerSide==='a'?f.sideA:f.sideB)||[])[0];
      const fac=S.factions.find(x=>x.id===fid);
      label=fac?(fac.name+' · '+factionMemberNames(fac.id)):'Lado '+(f.winnerSide||'').toUpperCase();
    } else if(f.kind==='lutador'){
      const id=(f.winnerSide==='a'?(f.sideA||[f.a]):(f.sideB||[f.b]))[0];
      label=nm(id);
    }
    return `<span class="m">Resolvida · vencedor: ${esc(label)} · pop aplicada</span>`;
  }
  if(f.kind==='multi'){
    return (f.participants||[]).map(id=>`<button class="add" onclick="resolveFeud('${f.id}','${id}')">🏆 ${esc(nm(id))} (+3.5)</button>`).join('');
  }
  if(f.kind==='multi-tag'){
    return (f.participants||[]).map(tid=>{
      const t=getTeam(tid);
      const name=t?t.name:tid;
      const mems=teamMemberNames(tid);
      return `<button class="add" onclick="resolveFeud('${f.id}','${tid}')">🏆 ${esc(name)} <span class="m">(${esc(mems)})</span></button>`;
    }).join('');
  }
  if(f.kind==='tag'){
    const a=f.sideA&&f.sideA[0], b=f.sideB&&f.sideB[0];
    const ta=getTeam(a), tb=getTeam(b);
    return `<button class="add" onclick="resolveFeud('${f.id}','a')">🏆 ${esc(ta?ta.name:'Lado A')} <span class="m">(${esc(teamMemberNames(a))})</span></button>
      <button class="add" onclick="resolveFeud('${f.id}','b')">🏆 ${esc(tb?tb.name:'Lado B')} <span class="m">(${esc(teamMemberNames(b))})</span></button>`;
  }
  if(f.kind==='faction'){
    const a=f.sideA&&f.sideA[0], b=f.sideB&&f.sideB[0];
    const fa=S.factions.find(x=>x.id===a), fb=S.factions.find(x=>x.id===b);
    return `<button class="add" onclick="resolveFeud('${f.id}','a')">🏆 ${esc(fa?fa.name:'Lado A')} <span class="m">(${esc(factionMemberNames(a))})</span></button>
      <button class="add" onclick="resolveFeud('${f.id}','b')">🏆 ${esc(fb?fb.name:'Lado B')} <span class="m">(${esc(factionMemberNames(b))})</span></button>`;
  }
  const a=(f.sideA||[f.a])[0], b=(f.sideB||[f.b])[0];
  return `<button class="add" onclick="resolveFeud('${f.id}','a')">🏆 ${esc(nm(a))} (+3.5)</button>
    <button class="add" onclick="resolveFeud('${f.id}','b')">🏆 ${esc(nm(b))} (+3.5)</button>`;
}
function pushLabel(id){if(hasPushBonus(id))return 'Push ativo (×1.5 até próximo PPV)';const p=popularity(id);return p>=80?'Push forte':p>=60?'Candidato a Main Event':p>=40?'Construir momentum':'Reabilitar / reconstruir';}
function titleHistoryMarkup(id){const ts=S.titles.filter(t=>(t.history||[]).some(h=>historyHas(h,'champion',id)));return ts.length?ts.map(t=>{const hs=(t.history||[]).filter(h=>historyHas(h,'champion',id));return `<div class="rw"><span class="t">${esc(t.name)}</span><span class="sp"></span>${tag(hs.length+' reinado(s)','face')}</div>`}).join(''):em('Ainda não há reinados registrados para este wrestler.');}
function brandsFor(s){return s.brands&&s.brands.length?s.brands:[s.brand||'Raw'];}
function monthYear(v=new Date()){const d=v instanceof Date?v:new Date(v+'T12:00:00');return Number.isNaN(d.getTime())?'Data não definida':MS[d.getMonth()]+' '+d.getFullYear();}
function assignChampion(t,v,date){if(!t||t.champ===v)return;t.history=t.history||[];const previous=t.champ||'';if(previous){const open=[...t.history].reverse().find(h=>h.champion===previous&&!h.ended);if(open){open.ended=monthYear(date);open.lostTo=v||'';open.daysHeld=Math.max(0,Math.round((new Date((date||new Date().toISOString().slice(0,10))+'T12:00:00')-new Date((open.startDate||t.since||date||new Date().toISOString().slice(0,10))+'T12:00:00'))/86400000));}}if(previous||v)t.history.push({champion:v||'',championMembers:(S.teams.find(tm=>tm.id===v)?.members||[]).slice(),previous,previousMembers:(S.teams.find(tm=>tm.id===previous)?.members||[]).slice(),started:monthYear(date),startDate:date||new Date().toISOString().slice(0,10),ended:'',lostTo:'',defenses:0});t.champ=v;t.rank=(t.rank||[]).filter(x=>x!==v);if(v){t.since=monthYear(date);t.reigns=(t.reigns||0)+1;t.defs=0;}else t.since='';}

/* ===== v1.5: pré-visualização, sugestão, arrastar, rivalidade a partir da luta ===== */
let PREVMODE=(()=>{try{return localStorage.getItem('universedesk_prev')||'poster';}catch(e){return 'poster';}})();
function matchGroups(m){return (m.groups&&m.groups.length)?m.groups:(m.participants||[]).map(x=>[x]);}
function matchPosters(m){const gs=matchGroups(m).filter(g=>g.length);
  if(m.matchType==='Promo'||gs.length<2)return `<div class="vsgrp" style="margin:4px 0">${gs.map(g=>g.map(posterHtml).join('')).join('')}</div>`;
  return `<div class="vsrow" style="margin:4px 0">${gs.map(g=>`<div class="vsgrp">${g.map(posterHtml).join('')}</div>`).join('<span class="vs">VS</span>')}</div>`;}
function cardPreviewHtml(s,draft){
  const items=(s.matches||[]).map((m,i)=>({m,i,d:false}));
  if(draft)items.push({m:draft,i:items.length,d:true});
  if(!items.length)return '<div class="m">Nenhuma luta no card ainda.</div>';
  const head=it=>`${it.i+1}. ${esc(it.m.matchType||'Luta')}${it.m.title?' · 🏆 '+esc(it.m.title):''}${typeof it.m.stars==='number'?' · '+starTxt(it.m.stars):''}${it.d?' · (montando…)':''}`;
  if(PREVMODE==='lista')return `<div>${items.map(it=>`<div class="pvl ${it.d?'draft':''}"><b>${head(it)}</b><br><span class="m">${esc(matchLine(it.m))}</span></div>`).join('')}</div>`;
  return `<div class="pv">${items.map(it=>`<div class="pvm ${it.d?'draft':''}"><div class="pvh">${head(it)}</div>${matchPosters(it.m)}</div>`).join('')}</div>`;}
function draftMatch(id){
  const type=$('type'+id)?.value;if(!type)return null;
  const title=$('mt'+id)?.value||'';
  if($('tg'+id+'_0_0')){
    const nT=Math.max(2,Math.min(6,parseInt($('nt'+id)?.value||2))),per=Math.max(1,Math.min(4,parseInt($('per'+id)?.value||2))),groups=[];
    for(let g=0;g<nT;g++){const mem=[];for(let k=0;k<per;k++){const v=$('tg'+id+'_'+g+'_'+k)?.value;if(v)mem.push(v);}if(mem.length)groups.push(mem);}
    if(!groups.length)return null;
    return {matchType:'Tag Team',title,groups,participants:groups.flat()};}
  const cnt=type==='Promo'?3:10,ps=[];
  for(let i=0;i<cnt;i++){const v=$('mp'+id+'_'+i)?.value;if(v&&!ps.includes(v))ps.push(v);}
  if(!ps.length)return null;
  return {matchType:type,title:type==='Promo'?'':title,participants:ps};}
function refreshPreview(id){const s=S.shows.find(x=>x.id===id),el=$('prev'+id);if(s&&el)el.innerHTML=cardPreviewHtml(s,draftMatch(id));}
function refreshPreviewFor(el){const f=el&&el.closest&&el.closest('[id^="matchForm"]');if(f)refreshPreview(f.id.slice(9));}
document.addEventListener('change',e=>refreshPreviewFor(e.target));
function setPrev(mode){PREVMODE=mode;try{localStorage.setItem('universedesk_prev',mode);}catch(e){}
  S.shows.forEach(x=>refreshPreview(x.id));document.querySelectorAll('.pvbtn').forEach(b=>b.style.outline=b.dataset.m===mode?'2px solid var(--ac)':'');}
(function(){const _r=refreshMatchForm;refreshMatchForm=function(id){_r(id);refreshPreview(id);};})();

/* arrastar para reordenar (ponteiro: funciona com toque e mouse) */
function moveMatch(sid,from,to){const s=S.shows.find(x=>x.id==sid);if(!s)return;const a=s.matches;if(to<0||to>=a.length||from===to)return;const [x]=a.splice(from,1);a.splice(to,0,x);save();draw();}
function dragStart(ev,sid,i){
  ev.preventDefault();const h=ev.currentTarget,card=h.closest('.mcard');if(!card)return;
  const D={from:i,to:i};card.classList.add('drag');
  try{h.setPointerCapture(ev.pointerId);}catch(e){}
  const mv=e=>{
    const el=document.elementFromPoint(e.clientX,e.clientY),t=el&&el.closest&&el.closest('.mcard');
    if(t&&t.dataset.sid===sid){D.to=+t.dataset.mi;document.querySelectorAll('.mcard.over').forEach(x=>x.classList.remove('over'));if(D.to!==D.from)t.classList.add('over');}
    if(e.clientY<80)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-80)window.scrollBy(0,14);};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
    document.querySelectorAll('.mcard.over,.mcard.drag').forEach(x=>x.classList.remove('over','drag'));
    if(D.to!==D.from)moveMatch(sid,D.from,D.to);};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);}

/* sugerir luta: rivalidades ativas + popularidade */
const SUGGN={};
function setPick(iid,val){const h=$(iid);if(!h)return;h.value=val;const w=h.closest('.wsel'),b=w&&w.querySelector('.wsel-btn'),r=S.roster.find(z=>z.id===val);if(b&&r)b.innerHTML=avHtml(r,false)+'<span>'+esc(r.name)+'</span>';}
function suggestCandidates(s){
  const booked=new Set((s.matches||[]).flatMap(m=>m.participants||[])),br=brandsFor(s);
  const ok=id=>{const r=S.roster.find(x=>x.id===id);return r&&r.role==='Lutador'&&r.status!=='Lesionado'&&r.status!=='Ausente'&&br.includes(r.brand)&&!booked.has(id);};
  const out=[];
  S.feuds.forEach(f=>{
    if(f.resolved||(f.status&&f.status!=='Ativa')||f.kind==='faction')return;
    const gs=feudGroups(f).filter(g=>g.length);if(gs.length<2)return;
    const flat=gs.flat();if(!flat.every(ok)||new Set(flat).size!==flat.length)return;
    const tagLike=f.kind==='tag'||f.kind==='multi-tag';
    if(tagLike&&(gs.length>6||gs.some(g=>g.length!==gs[0].length)||gs[0].length>4))return;
    if(!tagLike&&gs.length>10)return;
    const pop=flat.reduce((a,id)=>a+popularity(id),0)/flat.length,st=flat.reduce((a,id)=>a+starsInfo(id).adj,0)/flat.length;
    const past=(S.shows||[]).reduce((n,sh)=>n+(sh.matches||[]).filter(m=>flat.every(id=>(m.participants||[]).includes(id))).length,0);
    const idleW=flat.reduce((a,id)=>a+Math.min(idleDays(id),60),0)/flat.length/7,score=pop+st*2+(f.hasTitle?8:0)-past*1.5+Math.min(6,idleW);
    const tt=f.hasTitle&&f.titleId?S.titles.find(t=>t.id===f.titleId):null;
    out.push({score,groups:gs,tagLike,division:f.division||'Masculino',title:tt?tt.name:'',why:`Rivalidade ativa: ${gs.map(g=>g.map(nm).join(' & ')).join(' vs ')} · popularidade média ${pop.toFixed(0)}${f.hasTitle?' · valendo título':''}`});});
  out.sort((a,b)=>b.score-a.score);
  if(!out.length){
    const div=$('div'+s.id)?.value||'Masculino';
    const pool=S.roster.filter(r=>ok(r.id)&&(div==='Mix'||r.division===div)).sort((a,b)=>popularity(b.id)-popularity(a.id));
    if(pool.length>=2)out.push({score:0,groups:[[pool[0].id],[pool[1].id]],tagLike:false,division:div,title:'',why:`Sem rivalidade ativa disponível — sugestão por popularidade: ${pool[0].name} vs ${pool[1].name}`});}
  return out;}
function suggestMatch(id){
  const s=S.shows.find(x=>x.id===id);if(!s)return;
  const c=suggestCandidates(s),box=$('sugg'+id);
  if(!c.length){if(box)box.textContent='Sem sugestão: nenhuma rivalidade ativa livre (ou todos já estão no card).';return;}
  const n=(SUGGN[id]||0)%c.length;SUGGN[id]=n+1;const x=c[n];
  const set=(k,v)=>{const e=$(k+id);if(e)e.value=v;};
  set('div',x.division);set('type',x.tagLike?'Tag Team':'Single');refreshMatchForm(id);
  if(x.tagLike){set('nt',x.groups.length);set('per',x.groups[0].length);}else set('cnt',x.groups.length);
  refreshMatchForm(id);
  if(x.tagLike)x.groups.forEach((g,gi)=>g.forEach((w,k)=>setPick('tg'+id+'_'+gi+'_'+k,w)));
  else x.groups.forEach((g,i)=>setPick('mp'+id+'_'+i,g[0]));
  const mt=$('mt'+id);if(mt){mt.value=x.title&&[...mt.options].some(o=>o.value===x.title)?x.title:'';}
  refreshPreview(id);
  if(box)box.textContent='💡 '+x.why+(c.length>1?`  (sugestão ${n+1}/${c.length} — clique de novo para outra)`:'');}

/* criar rivalidade a partir de uma luta */
function feudFromMatch(sid,i){
  const s=S.shows.find(x=>x.id==sid),m=s&&s.matches[i];if(!m)return;
  const gs=matchGroups(m).filter(g=>g.length),n=gs.length,flat=gs.flat();
  if(n<2){alert('Uma rivalidade precisa de pelo menos 2 lados.');return;}
  if(n>4){alert('Rivalidades suportam até 4 lados; esta luta tem '+n+'.');return;}
  const sig=a=>a.slice().sort().join('|'),mine=sig(flat);
  if(S.feuds.some(f=>!f.resolved&&(!f.status||f.status==='Ativa')&&sig(feudGroups(f).flat())===mine)){alert('Já existe uma rivalidade ativa com esses lutadores.');return;}
  if(!confirm('Criar rivalidade a partir desta luta?\n\n'+matchLine(m)))return;
  const allSingle=gs.every(g=>g.length===1),groups={};
  const gid=g=>{const t=teamForGroup(g);if(t&&(t.members||[]).length===g.length)return t.id;const id='g'+uid();groups[id]={name:g.map(nm).join(' & '),members:g.slice()};return id;};
  let kind,sideA=[],sideB=[],participants=[];
  if(allSingle){if(n===2){kind='lutador';sideA=[gs[0][0]];sideB=[gs[1][0]];}else{kind='multi';participants=gs.map(g=>g[0]);}}
  else{const ids=gs.map(gid);if(n===2){kind='tag';sideA=[ids[0]];sideB=[ids[1]];}else{kind='multi-tag';participants=ids;}}
  const br=brandsFor(s),brand=br.includes(B)?B:s.brand;
  const tt=m.title?S.titles.find(t=>t.name===m.title&&br.includes(t.brand)):null;
  const f={id:uid(),brand,kind,division:m.division||'Masculino',hasTitle:!!tt,titleId:tt?tt.id:'',sideA,sideB,participants,a:sideA[0]||participants[0]||'',b:sideB[0]||participants[1]||'',status:'Ativa',
    notes:`Criada a partir da luta ${i+1} de ${s.name}${s.date?' ('+fmtBR(s.date)+')':''}: ${matchLine(m)}${m.result?' — resultado: '+m.result:''}.`,goal:'',story:'',resolved:false,groups};
  f.progress=0;f.timeline=[{id:uid(),date:s.date||universeDate(),text:'Origem: '+matchLine(m)+(m.result?' → '+m.result:''),ref:s.id+'|'+i}];f.touched=universeDate();S.feuds.push(f);m.feudId=f.id;save();draw();
  alert('Rivalidade criada! Veja na aba Rivalidades da brand.');}

/* ===== v2.0 ===== */
const dayDiff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
function lastMatchDate(id){let d='';S.shows.forEach(sh=>{if(!sh.completed||!sh.date||sh.date<=d)return;if((sh.matches||[]).some(m=>(m.participants||[]).includes(id)))d=sh.date;});return d;}
function idleDays(id){const d=lastMatchDate(id);return d?Math.max(0,dayDiff(universeDate(),d)):9999;}
function idleShort(id){const n=idleDays(id);if(n===9999)return 'nunca lutou';if(n<7)return n+(n===1?' dia':' dias');const w=Math.floor(n/7);return w+(w===1?' sem':' sem');}
function lossStreak(id){const l=S.shows.filter(sh=>sh.completed&&sh.date&&(sh.matches||[]).some(m=>(m.participants||[]).includes(id))).sort((a,b)=>b.date.localeCompare(a.date));let n=0;for(const sh of l){const ms=sh.matches.filter(m=>m.matchType!=='Promo'&&(m.participants||[]).includes(id));let lost=false,other=false;ms.forEach(m=>{const o=(m.outcomes||{})[id];if(o==='Derrota')lost=true;else if(o)other=true;});if(other)break;if(lost)n++;else if(ms.length)break;}return n;}
function idleTag(id){const n=idleDays(id),cls=n===9999?'bad':n<=14?'ok':n<=28?'warn':'bad';
  const txt=n===9999?'⏱ Sem lutas registradas':'⏱ Última luta: há '+n+(n===1?' dia':' dias')+(n>=7?' ('+Math.floor(n/7)+' sem)':'');
  const ls=lossStreak(id);return `<span class="idle ${cls}" title="Dias desde a última luta (data do universo)">${txt}</span>`+(ls>=3?`<span class="idle bad" title="Cuidado com o jobber eterno">📉 ${ls} derrotas seguidas</span>`:'');}

/* feedback de popularidade / estrelas */
let CHG={};
const fnum=v=>(v>0?'+':'')+(Math.round(v*10)/10).toFixed(1).replace('.',',');
function popSnap(){const o={};S.roster.forEach(r=>{if(r.role==='Lutador')o[r.id]={p:popularity(r.id),s:starsInfo(r.id).adj};});return o;}
function chgChip(id){const c=CHG[id];if(!c||Date.now()-c.t>15*60*1000)return '';let h='';
  if(Math.abs(c.dp)>=.05)h+=`<span class="chg ${c.dp>0?'up':'dn'}">${c.dp>0?'▲':'▼'} pop ${fnum(c.dp)}</span>`;
  if(Math.abs(c.ds)>=.05)h+=`<span class="chg ${c.ds>0?'up':'dn'}">${c.ds>0?'▲':'▼'} ★ ${fnum(c.ds)}</span>`;return h;}
function toastImpact(before){
  const after=popSnap(),rows=[];
  Object.keys(after).forEach(id=>{const b=before[id];if(!b)return;const dp=after[id].p-b.p,ds=after[id].s-b.s;if(Math.abs(dp)>=.05||Math.abs(ds)>=.05)rows.push({id,dp,ds,p0:b.p,p1:after[id].p,s0:b.s,s1:after[id].s});});
  if(!rows.length)return;
  rows.forEach(x=>CHG[x.id]={dp:x.dp,ds:x.ds,t:Date.now()});
  rows.sort((a,b)=>(Math.abs(b.dp)+Math.abs(b.ds)*3)-(Math.abs(a.dp)+Math.abs(a.ds)*3));
  let el=$('impactToast');if(el)el.remove();el=document.createElement('div');el.id='impactToast';
  const f1=v=>v.toFixed(1).replace('.',',');
  el.innerHTML=`<b>📊 Impacto da alteração</b>`+rows.slice(0,6).map(x=>`<div class="ir"><span>${esc(nm(x.id))}</span><span>${Math.abs(x.dp)>=.05?`pop ${f1(x.p0)} → ${f1(x.p1)} <b class="${x.dp>0?'up':'dn'}">${x.dp>0?'▲':'▼'} ${fnum(x.dp)}</b>`:''}${Math.abs(x.ds)>=.05?` · ★ ${f1(x.s0)} → ${f1(x.s1)} <b class="${x.ds>0?'up':'dn'}">${x.ds>0?'▲':'▼'} ${fnum(x.ds)}</b>`:''}</span></div>`).join('')+(rows.length>6?`<div class="m">+${rows.length-6} outros</div>`:'')+`<div class="m" style="margin-top:4px">toque para fechar</div>`;
  el.onclick=()=>el.remove();document.body.appendChild(el);setTimeout(()=>{if(el.parentNode)el.remove();},10000);
  draw();}
function withImpact(fn){return function(){const b=popSnap();const r=fn.apply(this,arguments);toastImpact(b);return r;};}
setMatchResult=withImpact(setMatchResult);setMatchStars=withImpact(setMatchStars);delMatch=withImpact(delMatch);completeShow=withImpact(completeShow);
function popWithout(id,sh){const keep=S.shows;S.shows=keep.filter(x=>x!==sh);try{return {p:popularity(id),s:starsInfo(id).adj};}finally{S.shows=keep;}}
function showImpactCard(sh){
  const ids=[...new Set((sh.matches||[]).flatMap(m=>m.participants||[]))].filter(id=>{const r=S.roster.find(x=>x.id===id);return r&&r.role==='Lutador';});
  if(!ids.length)return '';
  const rows=ids.map(id=>{const b=popWithout(id,sh),a={p:popularity(id),s:starsInfo(id).adj};return {id,dp:a.p-b.p,ds:a.s-b.s,p1:a.p,s1:a.s};}).sort((a,b)=>Math.abs(b.dp)-Math.abs(a.dp));
  const f1=v=>v.toFixed(1).replace('.',',');
  return `<div class="card" style="margin-top:12px"><div class="sh">IMPACTO DESTE SHOW</div><div class="m" style="margin-bottom:6px">Quanto cada lutador ganhou ou perdeu de popularidade e estrelas só com as lutas deste show.</div>${rows.slice(0,14).map(x=>`<div class="row" style="justify-content:space-between;margin:3px 0"><span>${esc(nm(x.id))}</span><span class="m">pop ${f1(x.p1)}% <b class="${x.dp>0?'up':x.dp<0?'dn':''}">${Math.abs(x.dp)<.05?'=':(x.dp>0?'▲ ':'▼ ')+fnum(x.dp)}</b> · ★ ${f1(x.s1)} <b class="${x.ds>0?'up':x.ds<0?'dn':''}">${Math.abs(x.ds)<.05?'=':(x.ds>0?'▲ ':'▼ ')+fnum(x.ds)}</b></span></div>`).join('')}${rows.length>14?`<div class="m">+${rows.length-14} outros</div>`:''}</div>`;}

/* card destaque: próxima sugestão de booking */
const HERO_I={};
function heroPick(b){
  const l=lut(b).map(r=>{const bk=ensureBooking(r);if(!bk)return null;const idle=Math.min(idleDays(r.id),120)/7;
    const sc=({reduzido:4,forte:3,subindo:2,estavel:0})[bk.tier]+idle*.5+(universeDate()>=addDays(bk.next,-14)?2:0);return {r,bk,sc};}).filter(Boolean).sort((a,c)=>c.sc-a.sc);return l;}
function heroBooking(b){

  <div class="row" style="flex-wrap:wrap;gap:6px">${bk.act.turn?`<button class="add" onclick="bookingTurn('${r.id}')">Aplicar: virar ${bk.act.turn}</button>`:''}${bk.act.partner?`<button class="add" onclick="bookingTeam('${r.id}')">Criar tag team sugerida</button>`:''}${bk.act.facIds&&bk.act.facIds.length?`<button class="add" onclick="bookingFaction('${r.id}')">Criar facção sugerida</button>`:''}<button class="add" onclick="openWrestler('${r.id}')">Abrir ficha</button><button class="add" onclick="regenBooking('${r.id}')">Outra história</button>${l.length>1?`<button class="add" onclick="HERO_I['${b}']=${i+1};draw()">Próximo lutador (${i+1}/${l.length}) →</button>`:''}</div>
  <div class="m" style="margin-top:8px">Prioriza quem precisa de atenção (popularidade/estrelas, tempo sem lutar e renovação próxima). Renovação: ${fmtBR(bk.next)}.</div></div>`;}

/* busca global */
let GQ='';
function norm(x){return String(x==null?'':x).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function gSearch(v){GQ=v;const el=$('gres');if(el)el.innerHTML=gResults(v);}
function gMatch(hay,terms){const h=norm(hay);return terms.every(t=>h.includes(t));}
function gResults(q){
  const terms=norm(q).split(/\s+/).filter(Boolean);
  if(!terms.length)return '<div class="m" style="padding:10px">Digite para buscar. Dica: use várias palavras (ex.: "raw campeão", "backlash 2026", "heel smackdown").</div>';
  const sec=(t,arr)=>arr.length?`<div class="card"><div class="sh">${t} · ${arr.length}</div>${arr.slice(0,25).join('')}${arr.length>25?`<div class="m">+${arr.length-25} resultados — refine a busca.</div>`:''}</div>`:'';
  const W=S.roster.filter(r=>gMatch([r.name,r.brand,r.role,r.card,r.alignment,r.division,r.status,r.origin,(S.factions.find(f=>f.id===r.faction)||{}).name,teamFor(r.id).map(t=>t.name).join(' '),carry(r.id).map(t=>t.name).join(' ')].join(' '),terms)).map(r=>`<div class="sr" onclick="openWrestler('${r.id}')">${avHtml(r,false)}<div style="flex:1;min-width:0"><b>${esc(r.name)}</b><div class="m">${esc(r.brand||'')} · ${esc(r.role==='Manager'?'Manager':r.card||'')} · ${esc(r.division||'')}</div>${r.role==='Lutador'?idleTag(r.id):''}</div>${r.role==='Lutador'?tag(Math.round(popularity(r.id))+'%'):''}</div>`);
  const T=S.titles.filter(t=>gMatch([t.name,t.brand,t.lv,nm(t.champ)].join(' ')+' '+(t.champ?'campeao':'vago'),terms)).map(t=>`<div class="sr" onclick="openTab('${t.brand}','titles','${esc(t.name).replace(/'/g,"\\'")}')"><div style="flex:1"><b>🏆 ${esc(t.name)}</b><div class="m">${esc(t.brand||'')} · Campeão: ${t.champ?esc(nm(t.champ)):'vago'}</div></div></div>`);
  const F=S.feuds.filter(f=>{const gs=feudGroups(f);const tt=f.titleId?S.titles.find(x=>x.id===f.titleId):null;return gMatch([gs.map(g=>g.map(nm).join(' ')).join(' '),f.notes,f.goal,f.story,f.brand,f.status,tt&&tt.name,f.kind].join(' '),terms);}).map(f=>{const gs=feudGroups(f).filter(g=>g.length),first=gs[0]?nm(gs[0][0]):'';return `<div class="sr" onclick="openTab('${f.brand||B}','feuds','${esc(first).replace(/'/g,"\\'")}')"><div style="flex:1"><b>🔥 ${esc(gs.map(g=>g.map(nm).join(' & ')).join(' vs '))}</b><div class="m">${esc(f.brand||'')} · ${esc(f.status||'Ativa')}${f.resolved?' · resolvida':''}</div></div></div>`;});
  const SH=S.shows.filter(sh=>gMatch([sh.name,sh.type,sh.date,sh.date&&fmtBR(sh.date),brandsFor(sh).join(' '),sh.notes,(sh.matches||[]).map(m=>matchLine(m)+' '+(m.title||'')+' '+(m.matchType||'')).join(' ')].join(' '),terms)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(sh=>{const hits=(sh.matches||[]).filter(m=>gMatch(matchLine(m)+' '+(m.title||'')+' '+(m.matchType||''),terms)).slice(0,3);return `<div class="sr" onclick="openShow('${sh.id}')"><div style="flex:1"><b>📅 ${esc(sh.name)}</b><div class="m">${esc(sh.type)}${sh.date?' · '+fmtBR(sh.date):''} · ${esc(brandsFor(sh).join(' / '))}${sh.completed?' · concluído':''}</div>${hits.map(m=>`<div class="m">• ${esc(matchLine(m))}${m.result?' → '+esc(m.result):''}</div>`).join('')}</div></div>`;});
  const TM=S.teams.filter(t=>gMatch([t.name,t.brand,(t.members||[]).map(nm).join(' ')].join(' '),terms)).map(t=>`<div class="sr" onclick="openTab('${t.brand||B}','teams','${esc(t.name).replace(/'/g,"\\'")}')"><div style="flex:1"><b>🤝 ${esc(t.name)}</b><div class="m">${esc(t.brand||'')} · ${esc((t.members||[]).map(nm).join(' / '))}</div></div></div>`);
  const FC=S.factions.filter(f=>gMatch([f.name,f.brand,f.tipo,nm(f.leader),S.roster.filter(r=>r.faction===f.id).map(r=>r.name).join(' ')].join(' '),terms)).map(f=>`<div class="sr" onclick="openTab('${f.brand||B}','teams','${esc(f.name).replace(/'/g,"\\'")}')"><div style="flex:1"><b>🏴 ${esc(f.name)}</b><div class="m">${esc(f.brand||'')} · ${esc(f.tipo||'')}</div></div></div>`);
  const out=sec('LUTADORES / PERSONAGENS',W)+sec('TÍTULOS',T)+sec('RIVALIDADES',F)+sec('SHOWS E LUTAS',SH)+sec('TAG TEAMS',TM)+sec('FACÇÕES',FC);
  return out||'<div class="m" style="padding:10px">Nada encontrado.</div>';}

/* ===== v2.1: progresso/timeline de rivalidade + arquivo de shows ===== */
function feudIds(f){return feudGroups(f).flat();}
function feudStale(f){if((f.status&&f.status!=='Ativa')||(f.progress||0)>=100)return 0;const last=f.touched||((f.timeline||[]).map(x=>x.date).sort().pop())||'';if(!last)return 0;const d=dayDiff(universeDate(),last);return d>=28?d:0;}
function feudProgressHtml(f){
  const pr=f.progress||0,st=feudStale(f),tl=(f.timeline||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const chips=[[0,'Início'],[25,'25%'],[50,'50%'],[75,'75%'],[100,'Final']].map(([v,l])=>`<button class="fm-chip ${pr===v?'on':''}" onclick="feudProgress('${f.id}',${v})">${l}</button>`).join('');
  return `<div style="margin-top:12px"><div class="m" style="font-weight:800;letter-spacing:.06em">PROGRESSO DA RIVALIDADE · ${pr>=100?'FINAL':pr+'%'}</div><div class="pbar"><i style="width:${pr}%"></i></div><div class="row" style="gap:6px;flex-wrap:wrap">${chips}</div>
  ${st?`<div class="m" style="margin-top:6px;color:#f4c95d">⚠ Sem avanço há ${st} dias (${Math.floor(st/7)} sem) — não esqueça este ângulo.</div>`:''}
  <div class="m" style="font-weight:800;letter-spacing:.06em;margin-top:12px">TIMELINE DE MOMENTOS</div>
  ${tl.length?`<div class="tl">${tl.map(e=>`<div class="te"><span class="m">${e.date?fmtBR(e.date):'sem data'}</span> <button class="x" style="float:right" onclick="feudTlDel('${f.id}','${e.id}')">✕</button><div>${esc(e.text)}</div></div>`).join('')}</div>`:'<div class="m" style="margin:6px 0">Nenhum momento registrado ainda.</div>'}
  <div class="row" style="gap:6px;flex-wrap:wrap"><input type="date" id="tlD${f.id}" value="${universeDate()}"><input class="f" id="tlT${f.id}" style="flex:1;min-width:160px" placeholder="Ex.: promo de ataque nos bastidores"><button class="add" onclick="feudTlAdd('${f.id}')">+ Momento</button><button class="add" onclick="feudTlSync('${f.id}')" title="Adiciona as lutas já realizadas entre estes lutadores">↻ Importar lutas</button></div></div>`;}
function feudTouch(f){f.touched=universeDate();}
function feudProgress(id,v){const f=S.feuds.find(x=>x.id==id);if(!f)return;f.progress=v;delete f.steps;feudTouch(f);(f.timeline=f.timeline||[]).push({id:uid(),date:universeDate(),text:'Progresso → '+(v>=100?'Final':v===0?'Início':v+'%')});save();draw();}
function feudTlAdd(id){const f=S.feuds.find(x=>x.id==id),t=$('tlT'+id),d=$('tlD'+id);if(!f||!t||!t.value.trim())return;(f.timeline=f.timeline||[]).push({id:uid(),date:d&&d.value||universeDate(),text:t.value.trim()});feudTouch(f);save();draw();}
function feudTlDel(id,eid){const f=S.feuds.find(x=>x.id==id);if(!f)return;f.timeline=(f.timeline||[]).filter(e=>e.id!==eid);save();draw();}
function feudTlSync(id){const f=S.feuds.find(x=>x.id==id);if(!f)return;const ids=feudIds(f);if(ids.length<2)return;f.timeline=f.timeline||[];let n=0;
  S.shows.forEach(sh=>(sh.matches||[]).forEach((m,i)=>{const ref=sh.id+'|'+i;if(f.timeline.some(e=>e.ref===ref))return;if(!ids.every(x=>(m.participants||[]).includes(x)))return;
    f.timeline.push({id:uid(),date:sh.date||'',text:`${sh.name}: ${matchLine(m)}${m.result?' → '+m.result:''}${typeof m.stars==='number'?' ('+starTxt(m.stars)+')':''}`,ref});n++;}));
  if(n){feudTouch(f);save();draw();}else alert('Nenhuma luta nova encontrada para esta rivalidade.');}

function showSummary(sh){const ms=sh.matches||[],a=showAvg(sh);return {n:ms.length,avg:a?a.avg:null,lines:ms.map(m=>`${matchLine(m)}${m.result?' → '+m.result:' (sem resultado)'}${typeof m.stars==='number'?' · '+starTxt(m.stars):''}`)};}
function archiveShow(id){const sh=S.shows.find(x=>x.id==id);if(!sh)return;if(!sh.completed){alert('Só é possível arquivar shows concluídos.');return;}sh.archived=true;save();draw();}
function unarchiveShow(id){const sh=S.shows.find(x=>x.id==id);if(!sh)return;sh.archived=false;save();draw();}
function archiveOld(){const n=+($('archM')||{}).value||6,lim=addMonths(universeDate(),-n);const l=S.shows.filter(sh=>sh.completed&&!sh.archived&&sh.date&&sh.date<lim&&brandsFor(sh).includes(B));
  if(!l.length){alert('Nenhum show concluído com mais de '+n+' meses para arquivar em '+B+'.');return;}
  if(!confirm('Arquivar '+l.length+' show(s) concluídos anteriores a '+fmtBR(lim)+'?\nPopularidade, estrelas e histórico continuam iguais; só saem da lista principal.'))return;
  l.forEach(sh=>sh.archived=true);save();draw();}
function archiveSection(b){
  const arc=S.shows.filter(sh=>sh.archived&&brandsFor(sh).includes(b)).sort((x,y)=>(y.date||'').localeCompare(x.date||''));
  const tools=`<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:6px"><span class="m">Arquivar shows concluídos com mais de</span><select id="archM"><option value="6">6 meses</option><option value="9">9 meses</option><option value="12">12 meses</option></select><button class="add" onclick="archiveOld()">📦 Arquivar antigos</button></div>`;
  const body=arc.length?arc.map(sh=>{const sm=showSummary(sh);return `<details class="card" id="show-${sh.id}"><summary><b>${esc(sh.name)}</b> <span class="m">· ${sh.date?fmtBR(sh.date):'sem data'} · ${sm.n} lutas${sm.avg!=null?' · média '+starAvgTxt(sm.avg):''}</span></summary><div style="margin-top:8px">${sm.lines.map(x=>`<div class="m">• ${esc(x)}</div>`).join('')||'<div class="m">Sem lutas.</div>'}${sh.notes?`<div class="m" style="margin-top:6px">Notas: ${esc(sh.notes)}</div>`:''}<div class="row" style="margin-top:8px"><button class="add" onclick="unarchiveShow('${sh.id}')">↩ Desarquivar</button></div></div></details>`;}).join(''):'<div class="m">Nenhum show arquivado.</div>';
  return dt('archive-'+b,`<span class="sh" style="margin:0">📦 ARQUIVO DE SHOWS · ${arc.length}</span>`,`<div class="m" style="margin:6px 0">Shows arquivados saem da lista principal e ficam só com resumo e resultados (abra para ver detalhes). Popularidade, estrelas e histórico continuam contando normalmente.</div>${tools}<div style="margin-top:8px">${body}</div>`);}

/* ===== v2.2: mover vários (draft light) + oponentes sugeridos ===== */
const MSEL=new Set();
function selCb(id){return `<input type="checkbox" class="selcb" data-id="${id}" title="Selecionar" ${MSEL.has(id)?'checked':''} onclick="event.stopPropagation()" onchange="selTog('${id}',this.checked)">`;}
function selTog(id,on){on?MSEL.add(id):MSEL.delete(id);updSelBar();}
function selAllVisible(){document.querySelectorAll('.selcb').forEach(c=>{c.checked=true;MSEL.add(c.dataset.id);});updSelBar();}
function selClear(){MSEL.clear();document.querySelectorAll('.selcb').forEach(c=>c.checked=false);updSelBar();}
function updSelBar(){
  let el=$('selBar');const ok=['roster','freeAgency','globalRoster'].includes(tab);
  if(!MSEL.size||!ok){if(el)el.remove();return;}
  if(!el){el=document.createElement('div');el.id='selBar';document.body.appendChild(el);}
  const keep=el.querySelector('select')?el.querySelector('select').value:'';
  el.innerHTML=`<b>${MSEL.size} selecionado${MSEL.size>1?'s':''}</b><select id="selTo">${BRS.map(b=>`<option value="${b}" ${b===keep?'selected':''}>${b==='Free Agency'?'🚪 Free Agency (dispensar)':'➡ '+b}</option>`).join('')}</select><button class="add" onclick="moveMany()">Mover</button><button class="add" onclick="selAllVisible()">Selecionar todos da tela</button><button class="add" onclick="selClear()">Limpar</button>`;}
function moveMany(){
  const to=($('selTo')||{}).value;if(!to)return;
  const all=[...MSEL].map(id=>S.roster.find(r=>r.id===id)).filter(Boolean);
  const champs=all.filter(r=>carry(r.id).length),skipSame=all.filter(r=>r.brand===to&&!carry(r.id).length);
  const mv=all.filter(r=>r.brand!==to&&!carry(r.id).length);
  if(!mv.length){alert('Nada para mover: os selecionados já estão em '+to+(champs.length?' ou são campeões atuais.':'.'));return;}
  const inTeam=mv.filter(r=>teamFor(r.id).length||r.faction).length;
  if(!confirm((to==='Free Agency'?'Dispensar para a Free Agency':'Mover para '+to)+' ('+mv.length+'):\n'+mv.map(r=>'• '+r.name+' ('+r.brand+')').join('\n')+(champs.length?'\n\nNão serão movidos (campeões atuais): '+champs.map(r=>r.name).join(', ')+'.':'')+(inTeam?'\n\nAtenção: '+inTeam+' deles fazem parte de time/facção da brand antiga.':'')))return;
  const d=universeDate();
  mv.forEach(r=>{(S.moves=S.moves||[]).unshift({date:d,id:r.id,name:r.name,from:r.brand,to,kind:to==='Free Agency'?'cut':'draft'});r.brand=to;});
  MSEL.clear();save();draw();
  const n=document.createElement('div');n.id='impactToast';n.textContent='✅ '+mv.length+' movido(s) para '+to+(champs.length?' · '+champs.length+' campeão(ões) ignorado(s)':'');n.onclick=()=>n.remove();document.body.appendChild(n);setTimeout(()=>n.remove(),5000);}

function lastFaced(a,b){let d='';S.shows.forEach(sh=>{if(!sh.completed||!sh.date||sh.date<=d)return;if((sh.matches||[]).some(m=>(m.participants||[]).includes(a)&&(m.participants||[]).includes(b)))d=sh.date;});return d;}
function bookingOpps(r,n){
  if(!r||r.role!=='Lutador'||r.brand==='Free Agency')return [];
  const pop=popularity(r.id),al=r.alignment||'Tweener',u=universeDate();
  const busy=new Set();S.feuds.forEach(f=>{if(f.resolved||(f.status&&f.status!=='Ativa'))return;const ids=feudIds(f);if(ids.includes(r.id))ids.forEach(x=>busy.add(x));});
  return S.roster.filter(x=>x.id!==r.id&&x.role==='Lutador'&&x.brand===r.brand&&x.division===r.division&&x.status!=='Lesionado'&&x.status!=='Ausente'&&!busy.has(x.id)).map(x=>{
    const xp=popularity(x.id),dp=Math.abs(xp-pop),xa=x.alignment||'Tweener';
    const opposite=(al==='Face'&&xa==='Heel')||(al==='Heel'&&xa==='Face'),tw=(al==='Tweener')!==(xa==='Tweener');
    const lf=lastFaced(r.id,x.id),days=lf?dayDiff(u,lf):null;
    let sc=Math.max(0,100-dp*3)+(opposite?25:tw?10:0)+(days==null?20:Math.min(days,120)/6-(days<14?15:0))+(starsInfo(x.id).adj-3)*3;
    const why=`pop ${xp.toFixed(0)}% vs ${pop.toFixed(0)}% (dif. ${dp.toFixed(0)}) · ${xa} × ${al}${opposite?' (alinhamento oposto)':''} · ${days==null?'nunca se enfrentaram':'última luta entre eles há '+days+(days===1?' dia':' dias')}`;
    return {r:x,score:sc,why};}).sort((a,b)=>b.score-a.score).slice(0,n||3);}
function oppsHtml(r){const o=bookingOpps(r,3);if(!o.length)return '';
  return `<div style="margin:8px 0"><div class="m" style="font-weight:800;letter-spacing:.06em">OPONENTES POSSÍVEIS</div>${o.map(x=>`<div class="opp"><div style="min-width:0"><b>${esc(x.r.name)}</b><div class="m">${esc(x.why)}</div></div><button class="add" onclick="bookingFeud('${r.id}','${x.r.id}')">🔥 Criar rivalidade</button></div>`).join('')}</div>`;}
function bookingFeud(rid,oid){
  const a=S.roster.find(x=>x.id===rid),b=S.roster.find(x=>x.id===oid);if(!a||!b)return;
  const o=bookingOpps(a,10).find(x=>x.r.id===oid),sig=[rid,oid].sort().join('|');
  if(S.feuds.some(f=>!f.resolved&&(!f.status||f.status==='Ativa')&&feudIds(f).slice().sort().join('|')===sig)){alert('Já existe uma rivalidade ativa entre eles.');return;}
  if(!confirm('Criar rivalidade '+a.name+' vs '+b.name+'?'))return;
  S.feuds.push({id:uid(),brand:a.brand,kind:'lutador',division:a.division||'Masculino',hasTitle:false,titleId:'',sideA:[rid],sideB:[oid],participants:[],a:rid,b:oid,status:'Ativa',notes:'Sugerida pelo booking: '+(o?o.why:'')+'.',goal:'',story:'',resolved:false,groups:{},progress:0,touched:universeDate(),timeline:[{id:uid(),date:universeDate(),text:'Rivalidade criada a partir da sugestão de booking.'}]});
  save();draw();alert('Rivalidade criada! Veja na aba Rivalidades da '+a.brand+'.');}

const I18N=(()=>{
  const m=new Map();
  I18N_RAW.split('\n').forEach(l=>{const i=l.indexOf('|');if(i<1)return;const k=l.slice(0,i),v=l.slice(i+1);m.set(k,v);const ku=k.toUpperCase();if(ku!==k&&!m.has(ku))m.set(ku,v.toUpperCase());});
  const keys=[...m.keys()].sort((a,b)=>b.length-a.length);
  const esc=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const L='\\p{L}';
  const src=keys.map(k=>(/^\p{L}/u.test(k)?'(?<!['+L+'])':'')+esc(k)+(/\p{L}$/u.test(k)?'(?!['+L+'])':'')).join('|');
  return {map:m,re:new RegExp(src,'gu')};
})();
const WKD={dom:'Sun',seg:'Mon',ter:'Tue',qua:'Wed',qui:'Thu',sex:'Fri','sáb':'Sat'};
function trText(t){
  if(!t||!/[A-Za-zÀ-ú0-9]/.test(t))return t;
  let s=t.replace(/há (\d+) (dias?)\b/g,(x,n,u)=>n+' '+(+n===1?'day':'days')+' ago');
  s=s.replace(I18N.re,x=>I18N.map.get(x)||x);
  return s.replace(/(\d+) sem\b/g,'$1 wk')
    .replace(/\((dom|seg|ter|qua|qui|sex|sáb)\)/g,(x,d)=>'('+WKD[d]+')')
    .replace(/\bTime ([A-F])\b/g,'Team $1')
    .replace(/(\d{2})\/(\d{2})\/(\d{4})/g,'$2/$1/$3')
    .replace(/(\d),(\d)/g,'$1.$2');
}
const _otr=new WeakMap();
function trNode(n){
  const v=n.nodeValue,c=_otr.get(n);if(c&&c.en===v)return;
  const en=trText(v);if(en===v)return;
  const p=n.parentNode;if(p&&p.tagName==='OPTION'&&!p.hasAttribute('value'))p.setAttribute('value',v.trim().replace(/\s+/g,' '));
  _otr.set(n,{pt:v,en});n.nodeValue=en;}
function translateAll(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;return p&&/^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT)$/.test(p.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  const l=[];let n;while(n=w.nextNode())l.push(n);l.forEach(trNode);
  root.querySelectorAll('[placeholder],[title]').forEach(e=>['placeholder','title'].forEach(a=>{const v=e.getAttribute(a);if(!v)return;const k='data-pt-'+a;if(e.hasAttribute(k)&&e.getAttribute(a)===trText(e.getAttribute(k)))return;const en=trText(v);if(en!==v){e.setAttribute(k,v);e.setAttribute(a,en);}}));
}

async function forcePull(){
  if(!SESSION)return;if(!confirm('Baixar a versão da nuvem e substituir os dados deste aparelho?'))return;
  try{const r=await sbq(rowUrl());if(!r.ok)throw new Error(await errOf(r));const row=(await r.json())[0];if(row)applyCloud(row,true);}catch(e){setSync('err',e.message);}}
async function doLogout(){
  if(!SESSION||!confirm('Sair da conta? Seus dados continuam salvos na nuvem.'))return;
  let wipe=!!($('lo_wipe')&&$('lo_wipe').checked);
  try{if(getMeta().dirty)await pushNow();}catch(e){}
  if(wipe&&getMeta().dirty){alert('Há alterações não sincronizadas; a cópia local não será apagada.');wipe=false;}
  const uid=SESSION.user.id;SESSION=null;try{localStorage.removeItem('universedesk_auth');}catch(e){}
  if(wipe){try{localStorage.removeItem(BASE_KEY+':u:'+uid);localStorage.removeItem('universedesk_sync:'+uid);}catch(e){}}
  KEY=BASE_KEY;let g=null;try{g=JSON.parse(lsGet(KEY)||lsGet(OLD));}catch(e){}
  S=mig(g);setSync('off');draw();showGate();}
function cloudStart(){
  window.addEventListener('online',()=>{if(SESSION&&getMeta().dirty)pushNow();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden||!SESSION)return;getMeta().dirty?pushNow():pullCheck();});
  if(SESSION){setSync(getMeta().dirty?'pending':'ok');getMeta().dirty?pushNow():pullCheck();}
  else if(cloudOn()&&!lsGet('universedesk_guest'))showGate();}

const STORY_PFX='História sugerida: ';
function storyRival(r,text){
  return S.roster.filter(x=>x.id!==r.id&&x.role==='Lutador'&&x.brand===r.brand&&x.name&&text.includes(x.name)).sort((a,b)=>b.name.length-a.name.length)[0]||null;}
function planLi(r,x,cls){
  const st=x.startsWith(STORY_PFX)?x.slice(STORY_PFX.length):'';

function bookingStoryFeud(rid){
  const r=S.roster.find(x=>x.id===rid);if(!r||!r.bookingSug)return;
  const plan=r.bookingSug.plan||[],line=plan.find(x=>x.startsWith(STORY_PFX));if(!line)return;
  const story=line.slice(STORY_PFX.length),riv=storyRival(r,story);
  if(!riv){alert('Não encontrei o rival desta história no elenco da brand.');return;}
  const sig=[r.id,riv.id].sort().join('|');
  if(S.feuds.some(f=>!f.resolved&&(!f.status||f.status==='Ativa')&&feudIds(f).slice().sort().join('|')===sig)){alert('Já existe uma rivalidade ativa entre eles.');return;}
  const goal=plan.find(x=>x!==line&&x.includes(riv.name))||'';
  const tt=S.titles.find(t=>plan.some(x=>x.startsWith('Disputa pelo '+t.name))&&t.brand===r.brand);
  if(!confirm('Criar a rivalidade '+r.name+' vs '+riv.name+' com esta história?\n\n'+story))return;
  S.feuds.push({id:uid(),brand:r.brand,kind:'lutador',division:r.division||'Masculino',hasTitle:!!tt,titleId:tt?tt.id:'',sideA:[r.id],sideB:[riv.id],participants:[],a:r.id,b:riv.id,status:'Ativa',
    notes:'Criada pela sugestão de booking.',goal,story,resolved:false,groups:{},progress:0,touched:universeDate(),
    timeline:[{id:uid(),date:universeDate(),text:'História: '+story}]});
  save();draw();alert('Rivalidade criada com a história sugerida! Veja na aba Rivalidades da '+r.brand+'.');}

function fillStory(t,A,B,T){return String(t).replace(/\{A\}/gi,A).replace(/\{B\}/gi,B).replace(/\{T\}/gi,T);}
function storyPool(r,al,hasTitle){
  const mine=(S.stories||[]).filter(x=>x.on!==false&&(x.align==='Todos'||x.align===al)&&(x.brand==='Todas'||x.brand===r.brand)&&(hasTitle||!/\{T\}/i.test(x.text)));
  const cat=al==='Face'?'face':al==='Heel'?'heel':'tween';
  let bank=STORY_BANK.filter(x=>x.c===cat||(x.c==='title'&&hasTitle));
  if(S.storyPrefs&&S.storyPrefs.onlyMine&&mine.length)bank=[];
  return {mine,bank};}
function pickStory(r,rival,al,title,rnd,rv){
  const hasT=!!title,pool=storyPool(r,al,hasT),en=LANG==='en';
  const items=[];pool.mine.forEach(x=>{for(let i=0;i<3;i++)items.push(x.text);});pool.bank.forEach(x=>items.push(en?x.en:x.pt));
  const t=pickR(rnd,items)||'{A} e {B} disputam o respeito do vestiário.';
  return fillStory(t,r.name,rv,title?title.name:(en?'title':'título'));}

/* ===== v3.3: rivalidades em seções (ativas/encerradas), minimizar e gancho editável ===== */
const FST=(()=>{try{return JSON.parse(localStorage.getItem('universedesk_fst')||'{}');}catch(e){return {};}})();

function feudEnded(f){return !!(f.resolved||f.status==='Encerrada');}
function feudIsMin(f){const v=FST[f.id];if(v==='min')return true;if(v==='open')return false;return feudEnded(f);}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}
function feudToggle(id){const f=S.feuds.find(x=>x.id==id);if(!f)return;FST[id]=feudIsMin(f)?'open':'min';saveFst();keepScroll(draw);}
function feudMinAll(e,min){S.feuds.filter(f=>(!f.brand||f.brand==B)&&feudEnded(f)===!!e).forEach(f=>FST[f.id]=min?'min':'open');saveFst();keepScroll(draw);}
function feudEditR(id,k,v){const x=S.feuds.find(z=>z.id==id);if(x){x[k]=v;save();keepScroll(draw);}}
function feudCard(f){
  const ended=feudEnded(f),min=feudIsMin(f),pr=f.progress||0,st=f.status||'Ativa',cls=ended?'ended':st==='Pausada'?'paused':'live';

function exportBackup() {
  const name = 'UniverseDesk_Backup_' + dstr(new Date()) + '.json';

  try { localStorage.setItem('universedesk_lastexport', String(Date.now())); } catch (e) {}
  if (window.AndroidApp && AndroidApp.saveFile) { try { AndroidApp.saveFile(name, 'application/json', txt); showMsg('Backup salvo: ' + name); return; } catch (e) {} }
  const blob = new Blob([txt], { type: 'application/json' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showMsg('Backup baixado: ' + name);
