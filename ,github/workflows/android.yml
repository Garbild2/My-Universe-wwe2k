name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: bash android/build_ci.sh
      - uses: actions/upload-artifact@v4
        with: { name: UniverseDesk-apk, path: android/UniverseDesk.apk }
      - name: Publicar Release (link direto para baixar no celular)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest android/UniverseDesk.apk --title "Universe Desk (APK mais recente)" --notes "Baixe o UniverseDesk.apk abaixo."
